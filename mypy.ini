# W2·CI 护栏（e7a6d5f1）——mypy 渐进门 v1
# 渐进律（同 ruff 风格类不进基线的取舍）：
# - v1 只收「稳定地基件」： core/filelock/schemas/vault/enforce/norm/matrix_init/wallclock
#   （在航舰热件 timeline/write_cmds/query_cmds/frames 等不进 v1——舰落地稳定后逐批扩）；
# - follow_imports = silent： 未列入 files 的被依赖件只参与推断不报错（渐进单源门面）；
# - 严格档 backlog（逐批打开）： check_untyped_defs → disallow_untyped_defs → strict。
#   check_untyped_defs 实测引爆 100+ 存量（见 HANDOFF），不在 v1 一次清。
[mypy]
python_version = 3.9
files =
    cli/ledger/core.py,
    cli/ledger/filelock.py,
    cli/ledger/schemas.py,
    cli/ledger/vault.py,
    cli/ledger/enforce.py,
    cli/ledger/norm.py,
    cli/ledger/matrix_init.py,
    cli/ledger/wallclock.py
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
check_untyped_defs = True
