# actuator-leak.yaml —— 自写模板（MIT/自创；上游 nuclei-templates 仅作结构范本不搬运内容）
id: tanyin-actuator-leak
info:
  name: Spring Boot Actuator Env Exposure
  severity: high
http:
  - method: GET
    path: ["{{BaseURL}}/actuator/env"]
    matchers:
      - type: word
        words: ["properties"]
      - type: status
        status: [200]
