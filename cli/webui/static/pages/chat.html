<!-- 壳重排 IA v2·对话面（第一入口·输入面第一公民）·设计母输入
     docs/design/2026-10-20-full-history-synthesis.md §⑥推导一/二
     （对话=输入/任务=执行/仪表盘=观察，同心圆）。
     五秒三问（宪法63律——这页五秒能答的三问）：
       ① 士兵都说了什么、我说过什么？→ 消息流（timeline+ask+approval 四类
         事件只读投影为对话气泡：指挥=右泡/士兵=左泡/求助=信息卡/待审批=警示卡）；
       ② 怎么开一仗？→ 输入框「打 xxx.com 找漏洞」→ 任务卡（目标/范围预览/
         红线/预算帽）内联展示待确认——确认跳 /p/new-task（授权八问仍归表单）；
       ③ 怎么回话？→ @引用记录对象（at-search 下拉钉上下文）+回复四分类
         （批准/拒绝/改方向/给情报→既有 steer-reply，未识别保守落情报）。
     对话页机制三律（ARTEX 前端图§六.1 借通用件不借结构）：
       1s 尾轮询（POLL_MS=1000）+ key 去重 + 不乐观回声（发送不本地插泡，
       等投影回流）+ 渐进披露（尾窗 80 条渲染，「载入更早」向上翻）。
     词表律（宪法62）：屏上只说人话——漏洞/任务/士兵/钥匙/目标/证据。
     数据 /api/v2/chat-log（api_v2_chat 只读投影，零写）；零框架零 CDN。 -->
<style>
/* ===== GL-DS v1（六面同源复制，改必六处同改）===== */
:root{
--bg:#0a0b0d;--bg-side:#0f1114;--bg-card:#14171c;--bg-raise:#1c2026;--bg-hover:#22262e;
--line:#232730;--line-2:#343a44;
--tx1:#edf1f6;--tx2:#c7cfda;--tx3:#a6afbb;--tx4:#8791a0;--tx5:#5f6873;
--ok:#3ddc97;--ok-dim:rgba(61,220,151,.13);--warn:#e8b34b;--warn-dim:rgba(232,179,75,.13);
--dang:#ff6f61;--dang-dim:rgba(255,111,97,.13);--info:#5aa9e6;--info-dim:rgba(90,169,230,.13);
--sev-c:#ff5c50;--sev-h:#f0864a;--sev-m:#e8b34b;--sev-l:#5aa9e6;--sev-i:#8791a0;
--acc:#3ddc97;--acc2:#2fae78;--acc-dim:rgba(61,220,151,.12);
--mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
--fs-a:13px;--fs-b:14px;--fs-c:16px;--fs-d:20px;--fs-e:24px;
--rad:10px;--rad-s:6px;--shadow:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx3);
font:var(--fs-b)/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--info);text-decoration:none}a:hover{color:var(--acc)}
::selection{background:var(--acc-dim)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
background:var(--bg-side);border-right:1px solid var(--line);overflow-y:auto}
#side .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
#side .logo .mark{width:27px;height:27px;border-radius:8px;background:var(--acc-dim);
border:1px solid var(--acc2);display:flex;align-items:center;justify-content:center;
color:var(--acc);flex-shrink:0}
#side .logo b{color:var(--tx1);font-size:15px;letter-spacing:.3px}
#side .logo b i{font-style:normal;color:var(--acc)}
.nav-g{padding:16px 18px 6px;font-size:var(--fs-a);color:var(--tx5);letter-spacing:2px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;margin:1px 10px;
padding:0 10px;border-radius:7px;color:var(--tx4);font-size:var(--fs-b);
border-left:2px solid transparent;white-space:nowrap}
.nav-i svg{flex-shrink:0;opacity:.8}
.nav-i:hover{background:var(--bg-card);color:var(--tx2)}
.nav-i.on{background:var(--acc-dim);color:var(--acc);border-left-color:var(--acc);font-weight:500}
#side .ft{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);
font-size:var(--fs-a);color:var(--tx5);line-height:1.8}
#side .ft b{color:var(--tx4);font-weight:500}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
min-height:52px;padding:8px 26px;background:rgba(10,11,13,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line)}
#topbar .crumb{font-size:var(--fs-a);color:var(--tx5);white-space:nowrap}
#topbar .crumb b{color:var(--tx2);font-weight:600}
#topbar .sp{flex:1}
#topbar .lnk{color:var(--tx4);font-size:var(--fs-a)}
#topbar .lnk:hover{color:var(--acc)}
select.sel{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx2);
border-radius:6px;padding:6px 10px;font-size:var(--fs-a);font-family:inherit;max-width:280px}
#content{min-width:0}
#main{max-width:1000px;margin:0 auto;padding:22px 28px 40px}
@media(min-width:1680px){#main{max-width:1120px}}
@media(max-width:1279px){#main{padding:18px 18px 32px}#topbar{padding:8px 18px}}
@media(max-width:1024px){
#layout{grid-template-columns:1fr}
#side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
border-right:none;border-bottom:1px solid var(--line)}
#side .logo{padding:10px 14px}
.nav-g{display:none}
.nav-i{margin:4px;height:30px}
#side .ft{display:none}
}
.phead{display:flex;align-items:baseline;gap:12px;margin:4px 0 2px;flex-wrap:wrap}
.phead h1{font-size:var(--fs-d);color:var(--tx1);font-weight:600;letter-spacing:.2px}
.phead .sub{font-size:var(--fs-a);color:var(--tx5)}
.state{display:none}.state.on{display:block}
.skl{max-width:760px;margin:18px auto;padding:0 20px}
.skl .t{height:16px;width:220px;border-radius:6px;margin-bottom:18px}
.skl .ln{height:12px;border-radius:6px;margin-bottom:11px}
.skl .t,.skl .ln{background:linear-gradient(100deg,var(--bg-raise) 30%,var(--bg-hover) 50%,var(--bg-raise) 70%);
background-size:200% 100%;animation:glm-sweep 1.3s linear infinite}
@keyframes glm-sweep{from{background-position:180% 0}to{background-position:-80% 0}}
#st-error .box{max-width:560px;margin:9vh auto 0;text-align:center;background:var(--bg-card);
border:1px solid rgba(255,111,97,.4);border-radius:var(--rad);padding:34px 28px;box-shadow:var(--shadow)}
#st-error h3{color:var(--dang);font-size:var(--fs-c);margin-bottom:8px}
#st-error p{color:var(--tx4);font-size:var(--fs-a)}
.bdg{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
border-radius:5px;font-size:var(--fs-a);font-weight:500;line-height:1;white-space:nowrap;flex-shrink:0}
.bdg-ok{background:var(--ok-dim);color:var(--ok)}
.bdg-warn{background:var(--warn-dim);color:var(--warn)}
.bdg-info{background:var(--info-dim);color:var(--info)}
.btn{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx3);
padding:6px 14px;border-radius:6px;cursor:pointer;font-size:var(--fs-a);font-family:inherit}
.btn:hover:not(:disabled){background:var(--bg-hover);color:var(--tx1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--acc-dim);border-color:var(--acc2);color:var(--acc)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
gap:4px;padding:30px 18px}
.empty svg{color:var(--tx5);opacity:.75;margin-bottom:6px}
.empty .t{font-size:var(--fs-b);color:var(--tx2)}
.empty .d{font-size:var(--fs-a);color:var(--tx4);line-height:1.75;max-width:480px}
.empty .d a{color:var(--info)}
/* ===== 对话面专属 ===== */
#chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 52px);min-height:480px}
#chat-scroll{flex:1;overflow-y:auto;padding:6px 2px 16px}
#btn-older{display:block;margin:2px auto 14px}
/* 气泡：指挥=右泡（对齐右）·士兵=左泡 */
.bub{max-width:78%;margin:7px 0;padding:8px 13px;border-radius:12px;font-size:var(--fs-b);
line-height:1.65;word-break:break-word}
.bub .meta{display:block;font-size:var(--fs-a);color:var(--tx5);margin-bottom:3px}
.bub.warrior{background:var(--bg-card);border:1px solid var(--line);
border-top-left-radius:4px;color:var(--tx3);margin-right:auto}
.bub.command{background:var(--acc-dim);border:1px solid rgba(61,220,151,.35);
border-top-right-radius:4px;color:var(--tx2);margin-left:auto}
.bub.command .meta{color:rgba(61,220,151,.75)}
/* 求助卡（信息）与待审批卡（警示，可点选挂四分类回复） */
.cardline{max-width:86%;margin:8px 0;padding:10px 14px;border-radius:var(--rad-s);
font-size:var(--fs-b)}
.cardline .meta{display:flex;gap:8px;align-items:center;font-size:var(--fs-a);
color:var(--tx5);margin-bottom:4px}
.cardline .tx{color:var(--tx2);word-break:break-word}
.cardline .lnk{font-size:var(--fs-a)}
.cardline.ask{background:var(--info-dim);border:1px solid rgba(90,169,230,.35);margin-right:auto}
.cardline.approval{background:var(--warn-dim);border:1px solid rgba(232,179,75,.4);
margin-right:auto;cursor:pointer}
.cardline.approval:hover{border-color:var(--warn)}
.cardline.approval.sel{outline:2px solid var(--warn);outline-offset:1px}
/* 内联任务卡（propose 产物：只产卡不开仗） */
#card-prose{margin:10px 0;padding:14px 16px;background:var(--bg-card);
border:1px dashed var(--acc2);border-radius:var(--rad);display:none}
#card-prose.on{display:block}
#card-prose h3{font-size:var(--fs-c);color:var(--tx1);margin-bottom:8px}
#card-prose .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;
font-size:var(--fs-a);margin-bottom:10px}
#card-prose .kv .k{color:var(--tx4)}
#card-prose .kv .v{color:var(--tx2);font-family:var(--mono);word-break:break-all}
#card-prose .red{color:var(--tx5);font-size:var(--fs-a);margin-bottom:10px;line-height:1.7}
#card-prose .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 回复四分类条 */
#reply-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
padding:8px 2px 4px;border-top:1px solid var(--line)}
#reply-bar .hint{font-size:var(--fs-a);color:var(--tx5);margin-left:auto}
/* 输入区 */
#composer{padding:8px 0 6px}
#at-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
#at-chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
border-radius:12px;background:var(--info-dim);border:1px solid rgba(90,169,230,.4);
color:var(--info);font-size:var(--fs-a);cursor:pointer}
.chip:hover{border-color:var(--info)}
.inputrow{display:flex;gap:9px;align-items:flex-start;position:relative}
#chat-input{flex:1;background:var(--bg-raise);border:1px solid var(--line-2);
color:var(--tx1);border-radius:9px;padding:10px 13px;font:var(--fs-b)/1.5 inherit;
font-family:inherit;resize:none;min-height:44px;max-height:132px}
#chat-input:focus{outline:none;border-color:var(--acc2)}
#btn-send{background:var(--acc-dim);border:1px solid var(--acc2);color:var(--acc);
border-radius:9px;padding:10px 18px;cursor:pointer;font-size:var(--fs-b);font-family:inherit}
#btn-send:hover{background:rgba(61,220,151,.2)}
#btn-send:disabled{opacity:.45;cursor:wait}
#at-drop{position:absolute;bottom:calc(100% + 6px);left:0;right:110px;z-index:40;
background:var(--bg-raise);border:1px solid var(--line-2);border-radius:8px;
box-shadow:var(--shadow);display:none;max-height:264px;overflow-y:auto}
#at-drop.on{display:block}
#at-drop .it{display:flex;gap:9px;align-items:center;padding:8px 12px;cursor:pointer;
font-size:var(--fs-a);border-bottom:1px solid var(--line)}
#at-drop .it:last-child{border-bottom:none}
#at-drop .it:hover{background:var(--bg-hover)}
#at-drop .it .ref{color:var(--tx5);font-family:var(--mono);margin-left:auto}
#at-drop .none{padding:10px 12px;color:var(--tx5);font-size:var(--fs-a)}
#note-line{min-height:18px;font-size:var(--fs-a);color:var(--tx5);padding-top:6px}
#note-line.err{color:var(--dang)}
</style>
</head>

<script>
"use strict";
(function () {
  var POLL_MS = 1000;            /* 1s 尾轮询（ARTEX 对话页同律） */
  var RENDER_CAP = 80;           /* 渐进披露：尾窗渲染条数，向上翻再披露 */
  var LIMIT = 160;               /* 首次拉尾窗（更多=载入更早时加倍，帽 400） */
  var state = { evs: [], keys: {}, shown: RENDER_CAP, sel: null, sending: false,
                chips: [], battle: "", goal: "" };

  function $(id) { return document.getElementById(id); }
  function qs() { return new URLSearchParams(window.location.search); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                 '"': "&quot;", "'": "&#39;" }[c];
      });
  }
  function show(id) {
    ["st-loading", "st-error", "st-normal"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }
  function relTime(ts) {
    if (!ts) { return "—"; }
    var t = Date.parse(String(ts).replace(" ", "T"));
    if (isNaN(t)) { return String(ts).slice(0, 16); }
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) { return Math.floor(s) + " 秒前"; }
    if (s < 3600) { return Math.floor(s / 60) + " 分钟前"; }
    if (s < 86400) { return Math.floor(s / 3600) + " 小时前"; }
    return Math.floor(s / 86400) + " 天前";
  }
  function note(msg, isErr) {
    $("note-line").textContent = msg || "";
    $("note-line").classList.toggle("err", !!isErr);
  }
  function battleQS() {
    return state.battle ? "?battle=" + encodeURIComponent(state.battle) : "";
  }

  /* ---------- ① 消息流投影：四类气泡 + key 去重 + 不乐观回声 ---------- */
  function merge(events) {
    /* key 去重（seq 单调幂等同义）：已见 key 不重插，只更新位置 */
    var fresh = [];
    events.forEach(function (e) {
      if (!state.keys[e.key]) {
        state.keys[e.key] = true;
        fresh.push(e);
      }
    });
    if (!fresh.length) { return; }
    state.evs = state.evs.concat(fresh).sort(function (a, b) {
      return a.ts < b.ts ? -1 : a.ts > b.ts ? 1 :
             a.key < b.key ? -1 : 1;
    });
  }

  function bubble(e) {
    var meta = '<span class="meta" title="' + esc(e.ts) + '">' +
      esc(relTime(e.ts)) + " · " + esc(e.actor || "") + "</span>";
    if (e.kind === "command") {
      return '<div class="bub command" data-key="' + esc(e.key) + '">' + meta +
        esc(e.event || e.text) + "</div>";
    }
    if (e.kind === "warrior") {
      return '<div class="bub warrior" data-key="' + esc(e.key) + '">' + meta +
        esc(e.text) + (e.row ? ' <a class="lnk" href="/session">回放</a>' : "") + "</div>";
    }
    if (e.kind === "ask") {
      return '<div class="cardline ask" data-key="' + esc(e.key) + '">' +
        '<div class="meta"><span class="bdg bdg-info">求助</span><span>' +
        esc(relTime(e.ts)) + "</span></div>" +
        '<div class="tx">' + esc(e.text) +
        ' <a class="lnk" href="/p/inbox">去收件箱 →</a></div></div>';
    }
    /* 待审批：可点选挂四分类回复 */
    var selCls = state.sel === e.row ? " sel" : "";
    return '<div class="cardline approval' + selCls + '" data-key="' + esc(e.key) +
      '" data-row="' + e.row + '">' +
      '<div class="meta"><span class="bdg bdg-warn">待审批</span><span>' +
      esc(relTime(e.ts)) + '</span><a class="lnk" href="/p/approval-center">审批中心 →</a></div>' +
      '<div class="tx">' + esc(e.text) + "</div></div>";
  }

  function render() {
    var evs = state.evs;
    var start = Math.max(0, evs.length - state.shown);
    $("btn-older").hidden = start <= 0;
    $("btn-older").textContent = "载入更早（还有 " + start + " 条）";
    $("chat-log").innerHTML = evs.slice(start).map(bubble).join("") ||
      '<div class="empty"><div class="t">还没有对话</div>' +
      '<div class="d">在下方输入「打 xxx.com 找漏洞」产出任务卡——确认后开第一仗；' +
      "开仗后士兵叙述与你的指令都会流到这里。</div></div>";
    var sc = $("chat-scroll");
    sc.scrollTop = sc.scrollHeight;
  }

  function poll() {
    fetch("/api/v2/chat-log?limit=" + LIMIT +
          (state.battle ? "&battle=" + encodeURIComponent(state.battle) : ""),
          { headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) {
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function (p) {
        merge(p.events || []);
        render();
        show("st-normal");
      })
      .catch(function () { /* 尾轮询静默重试；首屏失败才走错误态 */ });
  }

  /* ---------- ② 输入框 → propose 内联任务卡（只产卡不开仗） ---------- */
  function renderCard(c) {
    var box = $("card-prose");
    var form = c.form || {};
    var link = "/p/new-task?name=" + encodeURIComponent(form.name || c.target || "") +
      "&note=" + encodeURIComponent(form.note || "") +
      "&budget=" + encodeURIComponent(form.budget || "") +
      "&scope=" + encodeURIComponent(form.scope || "");
    box.innerHTML = "<h3>任务卡待确认</h3>" +
      '<div class="kv">' +
      '<div class="k">目标</div><div class="v">' + esc(c.target) + "</div>" +
      '<div class="k">说明</div><div class="v">' + esc(c.objective || "—") + "</div>" +
      '<div class="k">范围预览</div><div class="v">' + esc(c.scope_preview || "—") + "</div>" +
      '<div class="k">预算帽</div><div class="v">' + esc(c.budget_cap || "未设（按授权窗口自律）") + "</div>" +
      "</div>" +
      '<div class="red">红线：' + (c.red_lines || []).map(esc).join(" · ") +
      "</div>" +
      '<div class="acts"><a class="btn btn-go" href="' + link + '">确认开仗 → 开仗表单</a>' +
      '<span style="font-size:var(--fs-a);color:var(--tx5)">只产卡不开仗——授权八问在表单页由你确认</span></div>';
    box.classList.add("on");
  }

  function jpost(url, body) {
    return fetch(url, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json",
                 "X-Requested-With": "XMLHttpRequest" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (p) { return { status: r.status, p: p }; });
    });
  }

  /* @引用派活（再测类命令走既有 at-dispatch 进活池） */
  var RETEST_WORDS = ["再测一次", "再测一遍", "再测", "重测", "复测", "重新测"];
  function isRetest(t) {
    return RETEST_WORDS.some(function (w) { return t.indexOf(w) >= 0; });
  }

  function send() {
    if (state.sending) { return; }
    var text = $("chat-input").value.trim();
    if (!text && !state.chips.length) { return; }
    var refs = state.chips.map(function (c) { return c.ref; }).join(" ");
    var full = refs ? refs + " " + text : text;
    state.sending = true;
    $("btn-send").disabled = true;
    note("已发送——等投影回流（不乐观回声：不本地插泡）");
    var done = function () {
      state.sending = false;
      $("btn-send").disabled = false;
      $("chat-input").value = "";
      autoGrow();
      clearChips();
      poll();
    };
    /* 优先级：@引用+复测词→at-dispatch；打目标→propose 产卡；其余→回话 */
    if (state.chips.length && isRetest(full)) {
      jpost("/api/v2/at-dispatch", { anchor: state.chips[0].anchor,
                                     command: text || "再测一次",
                                     goal: state.goal })
        .then(function (r) {
          note(r.p && r.p.note ? r.p.note : (r.p.error || ""), r.status !== 200);
          done();
        }).catch(function (e) { note(String(e), true); done(); });
      return;
    }
    jpost("/api/v2/battle/propose", { text: full })
      .then(function (r) {
        if (r.status === 200 && r.p.needs_confirm) {
          renderCard(r.p);
          note("任务卡已产出——确认后才开仗（零写：目标目录不变）");
          done();
          return;
        }
        /* 422=没解析出目标：当回话走（未识别→保守落情报，绝不自动批准） */
        return jpost("/api/v2/steer-reply",
                     { reply: full, warrior: "w1", goal: state.goal })
          .then(function (r2) {
            var cat = (r2.p && r2.p.category) || "";
            note("已按「" + ({ approve: "批准", reject: "拒绝",
                               redirect: "改方向", intel: "给情报" }[cat] || "情报") +
                 "」送达士兵" + (r2.p && r2.p.note ? "——" + r2.p.note : ""));
            done();
          });
      })
      .catch(function (e) { note(String(e), true); done(); });
  }

  /* ---------- ③ @引用下拉（at-search） ---------- */
  var atTimer = null;
  function atDetect() {
    var el = $("chat-input");
    var upto = el.value.slice(0, el.selectionStart);
    var m = upto.match(/@([\w.-]*)$/);
    if (!m) { $("at-drop").classList.remove("on"); return; }
    clearTimeout(atTimer);
    atTimer = setTimeout(function () { atSearch(m[1]); }, 250);
  }
  function atSearch(q) {
    fetch("/api/v2/at-search?q=" + encodeURIComponent(q) +
          (state.goal ? "&goal=" + encodeURIComponent(state.goal) : ""),
          { headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) { return r.ok ? r.json() : { hits: [] }; })
      .then(function (p) {
        var drop = $("at-drop");
        var hits = p.hits || [];
        drop.innerHTML = hits.length
          ? hits.map(function (h, i) {
              return '<div class="it" data-i="' + i + '"><span class="bdg bdg-info">' +
                esc(h.kind) + "</span><span>" + esc(h.label) +
                '</span><span class="ref">' + esc(h.ref) + "</span></div>";
            }).join("")
          : '<div class="none">没搜到——换个词（支持目标/漏洞/任务/证据的编号或标题）</div>';
        drop.classList.add("on");
        drop._hits = hits;
        Array.prototype.forEach.call(drop.querySelectorAll(".it"), function (it) {
          it.onclick = function () {
            var h = drop._hits[Number(it.dataset.i)];
            addChip(h);
            var el = $("chat-input");
            var upto = el.value.slice(0, el.selectionStart);
            el.value = el.value.slice(0, upto.lastIndexOf("@")) +
                       el.value.slice(el.selectionStart);
            drop.classList.remove("on");
            el.focus();
          };
        });
      });
  }
  function addChip(h) {
    state.chips.push({ ref: h.ref, label: h.label, anchor: h.anchor });
    renderChips();
  }
  function clearChips() { state.chips = []; renderChips(); }
  function renderChips() {
    $("at-chips").innerHTML = state.chips.map(function (c, i) {
      return '<span class="chip" data-i="' + i + '" title="点击移除">' +
        esc(c.label) + " ✕</span>";
    }).join("");
    Array.prototype.forEach.call($("at-chips").querySelectorAll(".chip"),
      function (ch) {
        ch.onclick = function () {
          state.chips.splice(Number(ch.dataset.i), 1);
          renderChips();
        };
      });
  }

  /* ---------- ④ 回复四分类 → steer-reply ---------- */
  function approvalSig(row) {
    return fetch("/api/approval", { credentials: "same-origin",
                                    headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        var arr = Array.isArray(list) ? list : (list.items || []);
        for (var i = 0; i < arr.length; i++) {
          if (Number(arr[i].row) === Number(row)) { return arr[i]._approval_sig || ""; }
        }
        return "";
      });
  }

  function reply(cat) {
    if (cat === "redirect") {
      $("chat-input").value = "【改方向】";
      $("chat-input").focus();
      note("补全改向内容后发送——按「改方向」送达士兵");
      return;
    }
    if (cat === "intel") {
      $("chat-input").value = "【情报】";
      $("chat-input").focus();
      note("补全情报后发送——原文必达士兵");
      return;
    }
    if (!state.sel) {
      note("先点选一条待审批气泡，再批准/拒绝", true);
      return;
    }
    var row = state.sel;
    var word = cat === "approve" ? "批准" : "拒绝";
    approvalSig(row).then(function (sig) {
      return jpost("/api/v2/steer-reply",
                   { reply: word, warrior: "w1", goal: state.goal,
                     context: { row: row, _approval_sig: sig } });
    }).then(function (r) {
      var p = r.p || {};
      if (p.action && p.action.route) {        /* 批准/拒绝→既有 /api/approval 面 */
        return jpost(p.action.route, p.action.body).then(function (r2) {
          note(word + "已提交" + ((r2.p && r2.p.error) ? "——" + r2.p.error : ""));
          poll();
        });
      }
      note(p.note || p.error || "", r.status !== 200);
      poll();
    }).catch(function (e) { note(String(e), true); });
  }

  /* ---------- 仗切换（tasks.json 供仗单，mission 同法） ---------- */
  function wireSwitcher() {
    fetch("/api/v2/tasks.json", { headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) {
        var sel = $("battle-sel");
        var list = (t && t.battles) || [];
        if (!list.length) {
          sel.innerHTML = "<option>当前记录（单记录）</option>";
          return;
        }
        var cur = state.battle || "";
        sel.innerHTML = list.map(function (b) {
          return '<option value="' + b.n + '"' +
            (String(b.n) === cur ? " selected" : "") + ">" + esc(b.id) + "</option>";
        }).join("");
        sel.onchange = function () {
          window.location.search = "?battle=" + sel.value;
        };
      }).catch(function () {});
  }

  function autoGrow() {
    var el = $("chat-input");
    el.style.height = "auto";
    el.style.height = Math.min(132, el.scrollHeight) + "px";
  }

  /* ---------- 接线 ---------- */
  $("btn-send").onclick = send;
  $("chat-input").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
  });
  $("chat-input").addEventListener("input", function () { autoGrow(); atDetect(); });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest || !ev.target.closest(".inputrow")) {
      $("at-drop").classList.remove("on");
    }
    var ap = ev.target.closest && ev.target.closest(".cardline.approval");
    if (ap) {
      state.sel = Number(ap.dataset.row);
      $("reply-hint").textContent =
        "已选待审批 第 " + state.sel + " 行——批准/拒绝即裁决；或改方向/给情报。";
      render();
    }
  });
  Array.prototype.forEach.call(
    document.querySelectorAll("#reply-bar .btn"), function (b) {
      b.onclick = function () { reply(b.dataset.cat); };
    });
  $("btn-older").onclick = function () {
    if (state.shown >= state.evs.length && LIMIT < 400) {
      LIMIT = Math.min(400, LIMIT * 2);       /* 渐进披露：尾窗加倍再拉 */
      poll();
    }
    state.shown += RENDER_CAP;
    render();
  };

  /* 侧栏/顶栏链接自动携带当前仗（任务上下文不断链） */
  state.battle = qs().get("battle") || "";
  state.goal = qs().get("goal") || "";
  if (state.battle) {
    Array.prototype.forEach.call(
      document.querySelectorAll('#side a[href^="/"], #topbar a[href^="/"]'),
      function (a) {
        a.href = a.href + (a.href.indexOf("?") < 0 ? "?" : "&") +
                 "battle=" + encodeURIComponent(state.battle);
      });
  }

  wireSwitcher();
  poll();                                     /* 首拉 */
  setInterval(poll, POLL_MS);                 /* 1s 尾轮询 */

  /* 宿主壳自注册（共享壳缺席时本页独立可用——守卫式消费 UI-1 舰契约） */
  try { nav.push({ id: "chat", label: "对话", group: "驾驶舱" }); } catch (e) {}
})();
</script>
</body>
</html>
