<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产库 · GraphLed</title>
<!-- 视觉基准 panorama/graphled-console-prototype.html：12级灰阶+单强调色+mono数字。
     文案宪法#41（界面人话律）。设计权威 docs/design/ui-spec-complete-v1.md
     §P8-P18（资产库跨任务=跨任务资产登记读面）。共享壳 /static/app.js 由 UI-1 舰
     独写；本页仅消费 nav.push 自注册（守卫式）。 -->
<style>
:root{--g0:#0a0b0d;--g1:#101216;--g2:#16181d;--g3:#1d2026;--g4:#252930;--g5:#2e333b;
--g6:#3a4049;--g7:#4c535e;--g8:#6b7480;--g9:#8b949f;--ga:#aab3bd;--gb:#ccd3da;--gc:#e8edf2;
--acc:#3ddc97;--acc2:#2fae78;--warn:#e8b34b;--dang:#e8635a;--info:#5aa9e6;
--mono:"SF Mono",Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--g0);color:var(--gb);
font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
min-height:100vh;display:flex;flex-direction:column}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
#top{height:46px;background:var(--g1);border-bottom:1px solid var(--g3);
display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0}
#top .crumb{color:var(--g8);font-size:12px}
#top .crumb b{color:var(--ga);font-weight:500}
#top .sp{flex:1}
#reg-search{background:var(--g3);border:1px solid var(--g5);color:var(--gc);
padding:6px 10px;border-radius:4px;font-size:12.5px;width:280px}
#reg-search:focus{outline:none;border-color:var(--acc2)}
#reg-counts{color:var(--g8);font-size:12px;font-family:var(--mono)}
/* 四态 */
.state{display:none;padding:26px 24px}
.state.on{display:block}
#st-empty .box,#st-error .box{max-width:560px;margin:8vh auto 0;text-align:center;
background:var(--g2);border:1px solid var(--g4);border-radius:8px;padding:34px 28px}
#st-empty h3,#st-error h3{color:var(--gc);font-size:15px;margin-bottom:8px}
#st-empty p,#st-error p{color:var(--g8);font-size:12.5px;line-height:1.8}
#st-error .box{border-color:rgba(232,99,90,.45)}
#st-error h3{color:var(--dang)}
#st-error code{font-family:var(--mono);color:var(--warn);word-break:break-all}
#st-loading .sk{max-width:880px;margin:18px auto}
.sk .ln{height:14px;border-radius:4px;background:var(--g3);margin-bottom:12px;
animation:sh 1.2s ease-in-out infinite}
.sk .ln.w1{width:62%}.sk .ln.w2{width:88%}.sk .ln.w3{width:44%}.sk .ln.w4{width:75%}
@keyframes sh{0%,100%{opacity:.45}50%{opacity:1}}
/* 主区 */
#st-normal{padding:0}
#wrap{width:100%;max-width:1180px;margin:0 auto;padding:18px 24px 60px}
.clist{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cc{background:var(--g2);border:1px solid var(--g4);border-radius:6px;
padding:10px 14px;min-width:120px}
.cc .v{font-family:var(--mono);font-size:22px;color:var(--gc)}
.cc .v.acc{color:var(--acc)}
.cc .k{color:var(--g8);font-size:11px;margin-top:2px}
.pane{background:var(--g2);border:1px solid var(--g4);border-radius:6px;
padding:14px;margin-bottom:14px}
.pane h3{font-size:13px;color:var(--gc);margin-bottom:10px}
.pane h3 .sub{color:var(--g8);font-size:11px;font-weight:400;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--g8);font-weight:500;text-align:left;padding:6px 8px;
border-bottom:1px solid var(--g4);font-size:11.5px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--g3);vertical-align:top}
tr:hover td{background:var(--g3)}
td .val{font-family:var(--mono);color:var(--gc);word-break:break-all}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:500}
.t-g{background:rgba(61,220,151,.14);color:var(--acc)}
.t-r{background:rgba(232,99,90,.14);color:var(--dang)}
.t-n{background:var(--g4);color:var(--g9)}
.t-y{background:rgba(232,179,75,.14);color:var(--warn)}
.num{font-family:var(--mono)}
.xb{background:none;border:none;color:var(--info);cursor:pointer;font-size:11.5px;
padding:0;font-family:inherit}
.xb:hover{text-decoration:underline}
.bats{margin-top:6px;display:none}
tr.open .bats{display:block}
.bats .b{display:flex;gap:10px;color:var(--g8);font-size:11.5px;
padding:2px 0 2px 14px;flex-wrap:wrap}
.bats .b .bid{font-family:var(--mono);color:var(--ga)}
.none{color:var(--g8);font-size:12.5px;padding:14px 0;text-align:center}
.btn{background:var(--g4);border:1px solid var(--g6);color:var(--gb);padding:6px 14px;
border-radius:4px;cursor:pointer;font-size:12.5px}
.btn:hover{background:var(--g5);color:var(--gc)}
</style>
</head>
<body>
<header id="top">
  <span class="crumb">系统 · <b>资产库</b></span>
  <span class="sp"></span>
  <input id="reg-search" type="search" placeholder="搜资产：值 / 类型 / 资产编号">
  <span id="reg-counts"></span>
</header>

<div id="st-empty" class="state"><div class="box">
  <h3>资产库还是空的</h3>
  <p>资产登记处汇总所有任务登记过的测试资产：同一资产值出现在多个任务时
  在此合并为一条登记（各任务的复判结论与关联发现分别列出）。任务执行
  后资产自动入账。</p>
</div></div>
<div id="st-loading" class="state"><div class="sk">
  <div class="ln w1"></div><div class="ln w2"></div><div class="ln w3"></div><div class="ln w4"></div>
  <div class="tip" style="color:var(--g8);font-size:12px;text-align:center;margin-top:6px">正在汇总跨任务资产登记…</div>
</div></div>
<div id="st-error" class="state"><div class="box">
  <h3>资产库读取失败</h3>
  <p id="err-detail"><code></code></p>
  <button id="btn-retry" class="btn" type="button">重试</button>
</div></div>

<div id="st-normal" class="state">
  <div id="wrap">
    <div class="clist" id="cards"></div>
    <div class="pane">
      <h3>资产登记 <span class="sub" id="reg-sub">同一资产值跨任务合并 · 点击行展开各任务明细</span></h3>
      <div style="overflow-x:auto">
        <table id="reg-table">
          <thead><tr>
            <th>资产</th><th>类型</th><th>出现任务</th><th>复判</th>
            <th>关联发现</th><th>已测请求</th><th>资产编号</th>
          </tr></thead>
          <tbody id="reg-body"></tbody>
        </table>
      </div>
      <div class="none" id="reg-none" style="display:none">没有匹配的资产登记</div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
"use strict";
/* T7·资产库页：跨任务资产登记读面。四态=空/加载/错误/正常。服务端
   /api/v2/asset-registry.json 全量给（真全量），页端本地过滤即时响应；
   行展开显示各任务复判结论/发现/请求（登记处口径：同值=同一登记对象）。
   宿主壳存在则 nav.push 自注册（守卫式消费 UI-1 舰契约）。 */
(function () {
  var state = { assets: [], counts: {}, battles: [], q: "" };
  function $(id) { return document.getElementById(id); }

  function show(name) {
    ["st-empty", "st-loading", "st-error", "st-normal"].forEach(function (s) {
      $(s).classList.toggle("on", s === name);
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function verdictTags(row) {
    /* 复判=各任务分别标注（同资产在不同任务可结论不同——如实并列） */
    var seen = {};
    return (row.battles || []).map(function (b) {
      var v = b.auth_zh || "未知";
      if (seen[v]) { return ""; }
      seen[v] = 1;
      var cls = v === "复判✓" ? "t-g" : v === "范围外" ? "t-r" : "t-n";
      return '<span class="tag ' + cls + '">' + esc(v) + "</span>";
    }).join(" ");
  }

  function renderCards() {
    var c = state.counts || {};
    var html = [
      card(c.assets, "登记资产", ""),
      card(c.battles, "在册任务", ""),
      card(c.cross_battle, "跨任务资产", "acc"),
      card(c.findings_total, "关联发现", ""),
      card(c.requests_total, "已测请求", "")
    ].join("");
    $("cards").innerHTML = html;
    function card(v, k, cls) {
      return '<div class="cc"><div class="v ' + cls + '">' +
        (v == null ? "—" : v) + '</div><div class="k">' + k + "</div></div>";
    }
  }

  function renderRows() {
    var body = $("reg-body");
    var needle = state.q.trim().toLowerCase();
    var shown = state.assets.filter(function (a) {
      if (!needle) { return true; }
      return (a.value + " " + a.type + " " + (a.ids || []).join(" "))
        .toLowerCase().indexOf(needle) >= 0;
    });
    body.innerHTML = "";
    shown.forEach(function (a, i) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-value", a.value);
      var cells =
        '<td><span class="val">' + esc(a.value) + "</span>" +
          '<div class="bats">' + battlesHtml(a) + "</div></td>" +
        "<td>" + esc(a.type || "—") + "</td>" +
        '<td class="num">' + (a.battle_count || 0) + ' <button class="xb" type="button"' +
          ' data-x="' + i + '">展开</button></td>' +
        "<td>" + verdictTags(a) + "</td>" +
        '<td class="num">' + (a.findings_count || 0) + "</td>" +
        '<td class="num">' + (a.requests || 0) + "</td>" +
        '<td class="num" style="color:var(--g8)">' +
          esc((a.ids || []).slice(0, 3).join(" ")) +
          ((a.ids || []).length > 3 ? " …" : "") + "</td>";
      tr.innerHTML = cells;
      body.appendChild(tr);
    });
    Array.prototype.forEach.call(body.querySelectorAll(".xb"), function (btn) {
      btn.addEventListener("click", function () {
        var tr = btn.closest("tr");
        var open = tr.classList.toggle("open");
        btn.textContent = open ? "收起" : "展开";
      });
    });
    $("reg-none").style.display = shown.length ? "none" : "block";
    $("reg-counts").textContent = shown.length + " / " +
      (state.counts.assets || 0) + " 项";
  }

  function battlesHtml(a) {
    return (a.battles || []).map(function (b) {
      return '<div class="b"><span class="bid">' + esc(b.id) + "</span>" +
        "<span>复判 " + esc(b.auth_zh || "未知") + "</span>" +
        "<span>发现 " + (b.findings || 0) + "</span>" +
        "<span>请求 " + (b.requests || 0) + "</span>" +
        '<span class="mono">' + esc(b.asset_id || "") + "</span></div>";
    }).join("");
  }

  function load() {
    show("st-loading");
    fetch('/api/v2/asset-registry.json')
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (p && p.error) { throw p.error; }
        state.assets = p.assets || [];
        state.counts = p.counts || {};
        state.battles = p.battles || [];
        if (!state.assets.length && !state.q) { show("st-empty"); return; }
        renderCards();
        renderRows();
        show("st-normal");
      })
      .catch(function (e) {
        $("err-detail").innerHTML = "<code>" + esc(e) + "</code>";
        show("st-error");
      });
  }

  $("reg-search").addEventListener("input", function () {
    state.q = this.value;
    renderRows();
  });
  $("btn-retry").addEventListener("click", load);

  /* 宿主壳自注册（共享壳缺席时本页独立可用——守卫式消费 UI-1 舰契约） */
  if (typeof nav !== "undefined" && typeof nav.push === "function") {
    nav.push({ id: 'asset-registry', title: '资产库', group: '系统' });
  }

  load();
})();
</script>
</body>
</html>
