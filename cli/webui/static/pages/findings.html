<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漏洞 · GraphLed</title>
<!-- 驾驶舱·漏洞页（功能27）·正文 docs/design/2026-10-20-cockpit-ui-blueprint.md
     五秒三问（宪法63律——这页五秒能答的三问）：
       ① 哪些漏洞验真在册、多严重？→ 榜首五档严重度+计数签（同 id 后代胜，
         被翻案的不冒充在册）；
       ② 每个漏洞的证据是什么、多久没复验了？→ 展开证据袋：证据卡引用+
         角色（证实/对照）+版本（同组多次捕获 v1/v2/v3）+「上次验真 X 天前」；
       ③ 哪些排着队待复验？→ 每枚带待复验队列位（复验队列单源队序），
         一键去复测页。
     词表律（宪法62）：屏上只说人话——证据不说黑话缩写。数据单源
     /api/v2/cockpit-findings.json（账本真件投影，零假数）。零框架零 CDN。
     视觉=GL-DS v1（六面同源）+⑦筛选器（严重度/状态/表面）+分页（>50 行）。 -->
<style>
/* ===== GL-DS v1（六面同源复制，改必六处同改）===== */
:root{
--bg:#0a0b0d;--bg-side:#0f1114;--bg-card:#14171c;--bg-raise:#1c2026;--bg-hover:#22262e;
--line:#232730;--line-2:#343a44;
--tx1:#edf1f6;--tx2:#c7cfda;--tx3:#a6afbb;--tx4:#8791a0;--tx5:#5f6873;
--ok:#3ddc97;--ok-dim:rgba(61,220,151,.13);--warn:#e8b34b;--warn-dim:rgba(232,179,75,.13);
--dang:#ff6f61;--dang-dim:rgba(255,111,97,.13);--info:#5aa9e6;--info-dim:rgba(90,169,230,.13);
--sev-c:#ff5c50;--sev-h:#f0864a;--sev-m:#e8b34b;--sev-l:#5aa9e6;--sev-i:#8791a0;
--acc:#3ddc97;--acc2:#2fae78;--acc-dim:rgba(61,220,151,.12);
--mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
--fs-a:13px;--fs-b:14px;--fs-c:16px;--fs-d:20px;--fs-e:24px;
--rad:10px;--rad-s:6px;--shadow:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx3);
font:var(--fs-b)/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--info);text-decoration:none}a:hover{color:var(--acc)}
::selection{background:var(--acc-dim)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
background:var(--bg-side);border-right:1px solid var(--line);overflow-y:auto}
#side .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
#side .logo .mark{width:27px;height:27px;border-radius:8px;background:var(--acc-dim);
border:1px solid var(--acc2);display:flex;align-items:center;justify-content:center;
color:var(--acc);flex-shrink:0}
#side .logo b{color:var(--tx1);font-size:15px;letter-spacing:.3px}
#side .logo b i{font-style:normal;color:var(--acc)}
.nav-g{padding:16px 18px 6px;font-size:var(--fs-a);color:var(--tx5);letter-spacing:2px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;margin:1px 10px;
padding:0 10px;border-radius:7px;color:var(--tx4);font-size:var(--fs-b);
border-left:2px solid transparent;white-space:nowrap}
.nav-i svg{flex-shrink:0;opacity:.8}
.nav-i:hover{background:var(--bg-card);color:var(--tx2)}
.nav-i.on{background:var(--acc-dim);color:var(--acc);border-left-color:var(--acc);font-weight:500}
#side .ft{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);
font-size:var(--fs-a);color:var(--tx5);line-height:1.8}
#side .ft b{color:var(--tx4);font-weight:500}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
min-height:52px;padding:8px 26px;background:rgba(10,11,13,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line)}
#topbar .crumb{font-size:var(--fs-a);color:var(--tx5);white-space:nowrap}
#topbar .crumb b{color:var(--tx2);font-weight:600}
#topbar .sp{flex:1}
#topbar .lnk{color:var(--tx4);font-size:var(--fs-a)}
#topbar .lnk:hover{color:var(--acc)}
input.inp{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx2);
border-radius:6px;padding:6px 10px;font-size:var(--fs-a);font-family:inherit;width:230px}
input.inp:focus{outline:none;border-color:var(--acc2)}
#content{min-width:0}
#main{max-width:1240px;margin:0 auto;padding:26px 28px 90px}
@media(min-width:1680px){#main{max-width:1400px}}
@media(max-width:1279px){#main{padding:22px 18px 80px}#topbar{padding:8px 18px}
input.inp{width:170px}}
@media(max-width:1024px){
#layout{grid-template-columns:1fr}
#side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
border-right:none;border-bottom:1px solid var(--line)}
#side .logo{padding:10px 14px}
.nav-g{display:none}
.nav-i{margin:4px;height:30px}
#side .ft{display:none}
}
.phead{display:flex;align-items:baseline;gap:12px;margin:4px 0 2px;flex-wrap:wrap}
.phead h1{font-size:var(--fs-d);color:var(--tx1);font-weight:600;letter-spacing:.2px}
.phead .sub{font-size:var(--fs-a);color:var(--tx5)}
.state{display:none}.state.on{display:block}
.skl{max-width:1000px;margin:22px auto;padding:0 20px}
.skl .t{height:16px;width:220px;border-radius:6px;margin-bottom:18px}
.skl .ln{height:12px;border-radius:6px;margin-bottom:11px}
.skl .t,.skl .ln{background:linear-gradient(100deg,var(--bg-raise) 30%,var(--bg-hover) 50%,var(--bg-raise) 70%);
background-size:200% 100%;animation:glm-sweep 1.3s linear infinite}
@keyframes glm-sweep{from{background-position:180% 0}to{background-position:-80% 0}}
#st-error .box{max-width:560px;margin:9vh auto 0;text-align:center;background:var(--bg-card);
border:1px solid rgba(255,111,97,.4);border-radius:var(--rad);padding:34px 28px;box-shadow:var(--shadow)}
#st-error h3{color:var(--dang);font-size:var(--fs-c);margin-bottom:8px}
#st-error p{color:var(--tx4);font-size:var(--fs-a)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;margin:18px 0 14px}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--rad);
padding:14px 16px}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;
font-size:var(--fs-e);color:var(--tx1);line-height:1.15}
.kpi .v.ok{color:var(--ok)}.kpi .v.warn{color:var(--warn)}.kpi .v.dang{color:var(--dang)}
.kpi .k{font-size:var(--fs-a);color:var(--tx4);margin-top:4px}
.pane{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--rad);
padding:12px 18px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--bg-raise);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--ok)}
.bar .fill.warn{background:var(--warn)}
.bar .fill.over{background:var(--dang)}
/* ⑦筛选器：状态/严重度 chips + 表面下拉 */
#filters{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}
.fgrp{display:flex;gap:6px;align-items:center;padding-right:12px;margin-right:2px;
border-right:1px solid var(--line)}
.fgrp:last-child{border-right:none}
.fgrp .lb{font-size:var(--fs-a);color:var(--tx5)}
.chip{height:28px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;
border-radius:14px;border:1px solid var(--line-2);background:transparent;
color:var(--tx4);font-size:var(--fs-a);cursor:pointer;font-family:inherit}
.chip:hover{color:var(--tx2);border-color:var(--tx5)}
.chip.on{background:var(--acc-dim);border-color:var(--acc2);color:var(--acc);font-weight:500}
select.sel{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx2);
border-radius:6px;padding:5px 10px;font-size:var(--fs-a);font-family:inherit}
select.sel:focus{outline:none;border-color:var(--acc2)}
/* ④漏洞卡（⑦行hover+点击展开=证据袋） */
.fcard{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--rad);
margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.fcard:hover{border-color:var(--line-2)}
.fcard.open{border-color:var(--acc2)}
.fcard .hd{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.fcard .hd:hover{background:var(--bg-hover)}
.fcard .ti{flex:1;min-width:0;color:var(--tx2);font-size:var(--fs-b);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.fcard.open .ti{color:var(--tx1)}
.sev{display:inline-flex;align-items:center;justify-content:center;width:36px;height:22px;
border-radius:5px;font-size:var(--fs-a);font-weight:600;flex-shrink:0}
.sev-c{background:rgba(255,92,80,.16);color:var(--sev-c)}
.sev-h{background:rgba(240,134,74,.15);color:var(--sev-h)}
.sev-m{background:rgba(232,179,75,.14);color:var(--sev-m)}
.sev-l{background:rgba(90,169,230,.13);color:var(--sev-l)}
.sev-i{background:var(--bg-raise);color:var(--sev-i)}
.bdg{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
border-radius:5px;font-size:var(--fs-a);font-weight:500;line-height:1;white-space:nowrap;flex-shrink:0}
.bdg-ok{background:var(--ok-dim);color:var(--ok)}
.bdg-warn{background:var(--warn-dim);color:var(--warn)}
.bdg-dang{background:var(--dang-dim);color:var(--dang)}
.bdg-info{background:var(--info-dim);color:var(--info)}
.bdg-mut{background:var(--bg-raise);color:var(--tx4)}
.fcard .last{flex-shrink:0;color:var(--tx5);font-size:var(--fs-a);
font-family:var(--mono);font-variant-numeric:tabular-nums}
.fcard .qpos{flex-shrink:0;color:var(--warn);font-size:var(--fs-a);
border:1px solid var(--line-2);border-radius:5px;padding:1px 8px}
.fcard .evn{flex-shrink:0;color:var(--tx4);font-size:var(--fs-a);font-family:var(--mono)}
.fcard .chev{flex-shrink:0;color:var(--tx5);transition:transform .15s}
.fcard.open .chev{transform:rotate(90deg);color:var(--acc)}
.fcard .bd{display:none;border-top:1px solid var(--line);padding:14px;background:var(--bg-side)}
.fcard.open .bd{display:block}
.kv{display:flex;gap:10px 18px;flex-wrap:wrap;margin-bottom:12px;
font-size:var(--fs-a);color:var(--tx4)}
.kv b{color:var(--tx2);font-weight:500}
/* 证据袋（IA 卖点：角色+捕获版本） */
.bag{display:grid;gap:8px}
.evcard{background:var(--bg-card);border:1px solid var(--line);border-radius:8px;
padding:10px 12px;transition:border-color .15s}
.evcard:hover{border-color:var(--line-2)}
.evcard .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.evcard .role{font-size:var(--fs-a);border-radius:5px;padding:1px 8px}
.role.main{background:var(--ok-dim);color:var(--ok)}
.role.ctrl{background:var(--info-dim);color:var(--info)}
.evcard .id{font-family:var(--mono);font-size:var(--fs-a);color:var(--tx4)}
.evcard .ti{color:var(--tx2);font-size:var(--fs-b);flex:1;min-width:120px}
.vers{display:flex;gap:8px;flex-wrap:wrap}
.ver{background:var(--bg-raise);border:1px solid var(--line-2);border-radius:6px;
padding:4px 9px;font-size:var(--fs-a);color:var(--tx4)}
.ver b{color:var(--tx2);font-family:var(--mono);font-weight:500;margin-right:6px}
.ops{display:flex;gap:16px;margin-top:12px;font-size:var(--fs-a)}
/* ⑤空态+⑦分页 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
gap:4px;padding:34px 18px}
.empty svg{color:var(--tx5);opacity:.75;margin-bottom:6px}
.empty .t{font-size:var(--fs-b);color:var(--tx2)}
.empty .d{font-size:var(--fs-a);color:var(--tx4);line-height:1.75;max-width:480px}
.empty .d a{color:var(--info)}
.pager{display:flex;align-items:center;gap:14px;justify-content:center;
padding:14px 0 2px;font-size:var(--fs-a);color:var(--tx4)}
.pager button{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx3);
border-radius:6px;padding:5px 14px;cursor:pointer;font-size:var(--fs-a);font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--acc2);color:var(--acc)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .st{font-family:var(--mono);font-variant-numeric:tabular-nums}
</style>
</head>

<script>
"use strict";
(function () {
  var PAGE_SIZE = 25;                    /* ⑦>50 行分页（25/页） */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                 '"': "&quot;", "'": "&#39;" }[c];
      });
  }
  function show(id) {
    ["st-loading", "st-error", "st-normal"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }
  function sevCls(i) {
    return i === "危急" ? "sev-c" : i === "高" ? "sev-h" :
           i === "中" ? "sev-m" : i === "低" ? "sev-l" : "sev-i";
  }
  var ITEMS = [], FILTER = "all", SEV = "all", SURFACE = "", QUERY = "", PAGE = 1;

  var STATUS_ZH = { verified: ["已验真", "bdg-ok"], suspected: ["疑似", "bdg-warn"],
                    ruled_out: ["已排除", "bdg-mut"],
                    superseded: ["已被翻案", "bdg-dang"], active: ["在册", "bdg-ok"] };

  var EICON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">' +
    '<path d="M4 7.5a15.5 4.5 0 0 1 16 0v9a15.5 4.5 0 0 1-16 0Z"/>' +
    '<path d="M4 12h4.5l1.8 2.5h3.4l1.8-2.5H20"/></svg>';
  function emptyBox(title, why) {
    return '<div class="empty">' + EICON + '<div class="t">' + title +
      "</div>" + '<div class="d">' + why + "</div></div>";
  }

  function statusTags(f) {
    var out = [];
    var e = STATUS_ZH[f.exploitation_status];
    if (e) { out.push('<span class="bdg ' + e[1] + '">' + e[0] + "</span>"); }
    else { out.push('<span class="bdg bdg-mut">' + esc(f.exploitation_status || "—") + "</span>"); }
    if (f.status === "superseded") {
      out.push('<span class="bdg bdg-dang">已被翻案</span>');
    }
    return out.join("");
  }

  function card(f) {
    var bag = f.evidence_bag.map(function (ev) {
      var vers = (ev.versions || []).map(function (v) {
        return '<span class="ver"><b>v' + v.ver + "</b>" + esc(v.artifact || "无工件") +
          " · " + esc((v.observed_at || "").slice(0, 16)) + "</span>";
      }).join("");
      return '<div class="evcard"><div class="h">' +
        '<span class="role ' + (ev.role === "对照" ? "ctrl" : "main") + '">' +
        esc(ev.role) + '</span><span class="id">' + esc(ev.ev_id) + "</span>" +
        '<span class="ti">' + esc(ev.title || "") + "</span></div>" +
        '<div class="vers">' + (vers || '<span class="ver">未登记版本</span>') +
        "</div></div>";
    }).join("");
    return '<div class="fcard" data-id="' + esc(f.id) + '">' +
      '<div class="hd" role="button" tabindex="0" aria-expanded="false">' +
      '<span class="sev ' + sevCls(f.impact) + '">' + esc(f.impact) + "</span>" +
      '<span class="ti">' + esc(f.title) + "</span>" +
      statusTags(f) +
      (f.queue_pos ? '<span class="qpos" title="待复验队列位">复验位 #' +
        f.queue_pos + "</span>" : "") +
      '<span class="last">上次验真 ' + esc(f.since_last_text) + "</span>" +
      '<span class="evn">证据 ' + f.evidence_bag.length + " 件</span>" +
      '<span class="chev">›</span></div>' +
      '<div class="bd">' +
      '<div class="kv"><span>编号 <b class="mono">' + esc(f.id) + "</b></span>" +
      "<span>发现于 <b>" + esc((f.created || "").slice(0, 16)) + "</b></span>" +
      "<span>位置 <b class=\"mono\">" + esc(f.where || "—") + "</b></span>" +
      "<span>置信 <b>" + esc(f.confidence || "—") + "</b></span>" +
      (f.last_verified_at
        ? "<span>上次验真于 <b>" + esc(f.last_verified_at.slice(0, 16)) + "</b></span>"
        : "<span>从未复验</span>") + "</div>" +
      '<div style="font-size:var(--fs-a);color:var(--tx4);margin-bottom:8px">证据袋' +
      "（每件证据：角色 + 捕获版本；点详情看原始报文）</div>" +
      '<div class="bag">' + (bag ||
        '<div class="empty" style="padding:14px"><div class="d">这枚还没挂证据——没有证据不算数。</div></div>') + "</div>" +
      '<div class="ops"><a href="' + esc(f.detail_url) + '">详情与重放史 →</a>' +
      '<a href="' + esc(f.retest_url) + '">复测队列 →</a></div>' +
      "</div></div>";
  }

  function visible(f) {
    if (QUERY) {
      var hay = (f.id + " " + f.title + " " + (f.where || "") + " " +
                 f.evidence_bag.map(function (e) { return e.ev_id; }).join(" "))
        .toLowerCase();
      if (hay.indexOf(QUERY) < 0) { return false; }
    }
    if (SEV !== "all" && f.impact !== SEV) { return false; }
    if (SURFACE && (f.where || "").indexOf(SURFACE) < 0) { return false; }
    var verified = f.exploitation_status === "verified" && f.status === "active";
    if (FILTER === "verified") { return verified; }
    if (FILTER === "queue") { return f.queue_pos > 0; }
    if (FILTER === "suspect") { return !verified && f.status === "active"; }
    return f.status === "active";                    // 全部在册（默认）
  }

  function wireCards() {
    Array.prototype.forEach.call(
      document.querySelectorAll(".fcard .hd"), function (hd) {
        function toggle() {
          var open = hd.parentElement.classList.toggle("open");
          hd.setAttribute("aria-expanded", open ? "true" : "false");
        }
        hd.onclick = toggle;
        hd.onkeydown = function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
        };
      });
  }

  function render() {
    var c = COUNTS;
    $("cnt").innerHTML =
      ch(c.total, "在册漏洞（同 id 终态）", "") +
      ch(c.verified_active, "验真在册", "ok") +
      ch(c.raw_rows, "战账原始行（含翻案史）", "") +
      ch(ITEMS.filter(function (f) { return f.queue_pos > 0; }).length,
         "可复验（挂证据）", "warn");
    var rows = ITEMS.filter(visible);
    var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (PAGE > pages) { PAGE = pages; }
    var slice = rows.slice((PAGE - 1) * PAGE_SIZE, PAGE * PAGE_SIZE);
    $("list").innerHTML = slice.length
      ? slice.map(card).join("")
      : (ITEMS.length
        ? emptyBox("这个口径下没有漏洞",
            "换个筛选或搜索词——或者去<a href='/p/mission'>任务页</a>看正在打什么。")
        : emptyBox("账本里还没有漏洞",
            "士兵报漏洞、机器复放验真后才会出现在这里。" +
            "<a href='/p/mission'>看正在打什么</a>"));
    var pager = $("pager");
    if (rows.length > PAGE_SIZE) {
      pager.style.display = "flex";
      $("pg-info").textContent = "第 " + PAGE + " / " + pages + " 页 · 共 " +
        rows.length + " 枚";
      $("pg-prev").disabled = PAGE <= 1;
      $("pg-next").disabled = PAGE >= pages;
    } else {
      pager.style.display = "none";
    }
    wireCards();
  }
  function ch(v, k, cls) {
    return '<div class="kpi"><div class="v ' + (cls || "") + '">' + esc(v) +
      '</div><div class="k">' + esc(k) + "</div></div>";
  }

  /* 筛选器接线（状态/严重度/表面） */
  Array.prototype.forEach.call(
    document.querySelectorAll("#filters [data-f]"), function (btn) {
      btn.onclick = function () {
        Array.prototype.forEach.call(
          document.querySelectorAll("#filters [data-f]"), function (b2) {
            b2.classList.toggle("on", b2 === btn);
          });
        FILTER = btn.dataset.f; PAGE = 1; render();
      };
    });
  Array.prototype.forEach.call(
    document.querySelectorAll("#filters [data-s]"), function (btn) {
      btn.onclick = function () {
        Array.prototype.forEach.call(
          document.querySelectorAll("#filters [data-s]"), function (b2) {
            b2.classList.toggle("on", b2 === btn);
          });
        SEV = btn.dataset.s; PAGE = 1; render();
      };
    });
  $("f-surface").onchange = function () {
    SURFACE = this.value; PAGE = 1; render();
  };
  $("pg-prev").onclick = function () { if (PAGE > 1) { PAGE -= 1; render(); } };
  $("pg-next").onclick = function () { PAGE += 1; render(); };
  $("f-search").oninput = function () {
    QUERY = this.value.trim().toLowerCase(); PAGE = 1; render();
  };

  var COUNTS = { total: 0, verified_active: 0, raw_rows: 0 };
  var b = new URLSearchParams(window.location.search).get("battle");
  if (b) {
    Array.prototype.forEach.call(
      document.querySelectorAll('#side a[href^="/"]'),
      function (a) {
        a.href = a.href + (a.href.indexOf("?") < 0 ? "?" : "&") +
                 "battle=" + encodeURIComponent(b);
      });
  }
  fetch("/api/v2/cockpit-findings.json" +
        (b ? "?battle=" + encodeURIComponent(b) : ""),
        { headers: { "X-Requested-With": "cockpit" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(function (p) {
      ITEMS = p.items || [];
      COUNTS = p.counts || COUNTS;
      /* 表面下拉：按 where 根（协议+主机）去重建 */
      var seen = {}, roots = [];
      ITEMS.forEach(function (f) {
        var w = f.where || ""; if (!w || w === "（未登记位置）") { return; }
        var m = w.match(/^[a-z]+:\/\/([^\/]+)/i);
        var root = m ? m[1] : w.split("/")[0];
        if (!seen[root]) { seen[root] = 0; }
        seen[root] += 1;
      });
      Object.keys(seen).sort(function (a, b2) { return seen[b2] - seen[a]; })
        .forEach(function (r2) { roots.push([r2, seen[r2]]); });
      $("f-surface").innerHTML = '<option value="">全部表面</option>' +
        roots.map(function (r2) {
          return '<option value="' + esc(r2[0]) + '">' + esc(r2[0]) +
            "（" + r2[1] + "）</option>";
        }).join("");
      render();
      show("st-normal");
    })
    .catch(function (e) {
      $("err-detail").textContent = String(e && e.message ? e.message : e);
      show("st-error");
    });

  try { nav.push({ id: "findings", label: "漏洞", group: "漏洞" }); } catch (e) {}
})();
</script>
</body>
</html>
