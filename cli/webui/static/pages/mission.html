<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务 · GraphLed</title>
<!-- 驾驶舱·任务页（功能27）·正文 docs/design/2026-10-20-cockpit-ui-blueprint.md
     五秒三问（宪法63律——这页五秒能答的三问）：
       ① 这仗在打什么？→ 顶栏仗名+概况签（目标/授权/预算帽一句话）；
       ② 打到哪了？→ 活池签（在途任务+最近动态）· 地图签（面覆盖概况）·
         漏洞签（验真漏洞榜前枚+进全部）；
       ③ 花了多少、谁说了什么？→ 消费签（余量条）· 日志签（战账动态）+
         页首会话流（对话流=一等导航对象，可 @引用 跳转）。
     词表律（宪法62）：屏上只说人话。数据单源 /api/v2/cockpit.json +
     既有 /api/v2/tasks.json（仗切换）+ /api/v2/coverage.json（地图签，
     取不到=诚实空不硬造）。零框架零 CDN。
     视觉=GL-DS v1（六面同源）+ARTEX 式页内子标签（蓝图 sanctioned 同型）。 -->
<style>
/* ===== GL-DS v1（六面同源复制，改必六处同改）===== */
:root{
--bg:#0a0b0d;--bg-side:#0f1114;--bg-card:#14171c;--bg-raise:#1c2026;--bg-hover:#22262e;
--line:#232730;--line-2:#343a44;
--tx1:#edf1f6;--tx2:#c7cfda;--tx3:#a6afbb;--tx4:#8791a0;--tx5:#5f6873;
--ok:#3ddc97;--ok-dim:rgba(61,220,151,.13);--warn:#e8b34b;--warn-dim:rgba(232,179,75,.13);
--dang:#ff6f61;--dang-dim:rgba(255,111,97,.13);--info:#5aa9e6;--info-dim:rgba(90,169,230,.13);
--sev-c:#ff5c50;--sev-h:#f0864a;--sev-m:#e8b34b;--sev-l:#5aa9e6;--sev-i:#8791a0;
--acc:#3ddc97;--acc2:#2fae78;--acc-dim:rgba(61,220,151,.12);
--mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
--fs-a:13px;--fs-b:14px;--fs-c:16px;--fs-d:20px;--fs-e:24px;
--rad:10px;--rad-s:6px;--shadow:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx3);
font:var(--fs-b)/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--info);text-decoration:none}a:hover{color:var(--acc)}
::selection{background:var(--acc-dim)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
background:var(--bg-side);border-right:1px solid var(--line);overflow-y:auto}
#side .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
#side .logo .mark{width:27px;height:27px;border-radius:8px;background:var(--acc-dim);
border:1px solid var(--acc2);display:flex;align-items:center;justify-content:center;
color:var(--acc);flex-shrink:0}
#side .logo b{color:var(--tx1);font-size:15px;letter-spacing:.3px}
#side .logo b i{font-style:normal;color:var(--acc)}
.nav-g{padding:16px 18px 6px;font-size:var(--fs-a);color:var(--tx5);letter-spacing:2px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;margin:1px 10px;
padding:0 10px;border-radius:7px;color:var(--tx4);font-size:var(--fs-b);
border-left:2px solid transparent;white-space:nowrap}
.nav-i svg{flex-shrink:0;opacity:.8}
.nav-i:hover{background:var(--bg-card);color:var(--tx2)}
.nav-i.on{background:var(--acc-dim);color:var(--acc);border-left-color:var(--acc);font-weight:500}
#side .ft{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);
font-size:var(--fs-a);color:var(--tx5);line-height:1.8}
#side .ft b{color:var(--tx4);font-weight:500}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
min-height:52px;padding:8px 26px;background:rgba(10,11,13,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line)}
#topbar .crumb{font-size:var(--fs-a);color:var(--tx5);white-space:nowrap}
#topbar .crumb b{color:var(--tx2);font-weight:600}
#topbar .sp{flex:1}
#topbar .lnk{color:var(--tx4);font-size:var(--fs-a)}
#topbar .lnk:hover{color:var(--acc)}
select.sel{background:var(--bg-raise);border:1px solid var(--line-2);color:var(--tx2);
border-radius:6px;padding:6px 10px;font-size:var(--fs-a);font-family:inherit;
max-width:280px}
select.sel:focus{outline:none;border-color:var(--acc2)}
#content{min-width:0}
#main{max-width:1240px;margin:0 auto;padding:26px 28px 90px}
@media(min-width:1680px){#main{max-width:1400px}}
@media(max-width:1279px){#main{padding:22px 18px 80px}#topbar{padding:8px 18px}}
@media(max-width:1024px){
#layout{grid-template-columns:1fr}
#side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
border-right:none;border-bottom:1px solid var(--line)}
#side .logo{padding:10px 14px}
.nav-g{display:none}
.nav-i{margin:4px;height:30px}
#side .ft{display:none}
}
.phead{display:flex;align-items:baseline;gap:12px;margin:4px 0 2px;flex-wrap:wrap}
.phead h1{font-size:var(--fs-d);color:var(--tx1);font-weight:600;letter-spacing:.2px}
.phead .sub{font-size:var(--fs-a);color:var(--tx5)}
.state{display:none}.state.on{display:block}
.skl{max-width:1000px;margin:22px auto;padding:0 20px}
.skl .t{height:16px;width:220px;border-radius:6px;margin-bottom:18px}
.skl .ln{height:12px;border-radius:6px;margin-bottom:11px}
.skl .t,.skl .ln{background:linear-gradient(100deg,var(--bg-raise) 30%,var(--bg-hover) 50%,var(--bg-raise) 70%);
background-size:200% 100%;animation:glm-sweep 1.3s linear infinite}
@keyframes glm-sweep{from{background-position:180% 0}to{background-position:-80% 0}}
#st-error .box{max-width:560px;margin:9vh auto 0;text-align:center;background:var(--bg-card);
border:1px solid rgba(255,111,97,.4);border-radius:var(--rad);padding:34px 28px;box-shadow:var(--shadow)}
#st-error h3{color:var(--dang);font-size:var(--fs-c);margin-bottom:8px}
#st-error p{color:var(--tx4);font-size:var(--fs-a)}
.sec{display:flex;align-items:baseline;gap:10px;margin:28px 0 10px;flex-wrap:wrap}
.sec h2{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.sec h2 b{color:var(--acc);font-weight:500;font-size:var(--fs-a);margin-left:4px}
.sec .sub{font-size:var(--fs-a);color:var(--tx5)}
.sec .sp{flex:1}
.sec a{font-size:var(--fs-a)}
.pane{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--rad);
padding:12px 18px}
/* 会话流：双气泡（士兵叙述左/操作员右）——一等导航对象 */
#flow{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;
padding:6px 8px 6px 2px}
.bub{max-width:80%;border-radius:10px;padding:9px 13px;font-size:var(--fs-b);line-height:1.65}
.bub.agent{align-self:flex-start;background:var(--bg-raise);
border:1px solid var(--line-2);color:var(--tx3)}
.bub.operator{align-self:flex-end;background:var(--acc-dim);
border:1px solid rgba(61,220,151,.35);color:var(--tx1)}
.bub .meta{display:block;color:var(--tx5);font-size:var(--fs-a);font-family:var(--mono);
margin-bottom:3px}
/* ⑧ARTEX 式页内子标签：透明底+下划线，未激活=弱化色 */
#tabs{display:flex;gap:2px;margin:20px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tabs button{background:none;border:none;border-bottom:2px solid transparent;
color:var(--tx4);padding:8px 14px;cursor:pointer;font-size:var(--fs-b);
font-family:inherit;margin-bottom:-1px}
#tabs button:hover{color:var(--tx2)}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}
.tabpane{display:none}.tabpane.on{display:block}
/* ④KPI 卡（字号阶梯 24 一档） */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;margin:16px 0 14px}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--rad);
padding:14px 16px}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;
font-size:var(--fs-e);color:var(--tx1);line-height:1.15}
.kpi .v.ok{color:var(--ok)}.kpi .v.warn{color:var(--warn)}.kpi .v.dang{color:var(--dang)}
.kpi .k{font-size:var(--fs-a);color:var(--tx4);margin-top:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:var(--fs-b)}
.kv .k{color:var(--tx4)}.kv .v{color:var(--tx2)}
.kv .v.mono{font-size:var(--fs-a)}
/* ④表格（②紧凑密度+⑦行hover） */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-a)}
.tbl th{text-align:left;font-weight:500;color:var(--tx4);padding:9px 10px;
border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--tx3);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--bg-hover)}
/* 行组件 */
.rows .row{display:flex;align-items:center;gap:12px;padding:9px 4px;
border-bottom:1px solid var(--line);font-size:var(--fs-b)}
.rows .row:last-child{border-bottom:none}
.row.click{cursor:pointer;color:inherit}
.row.click:hover{background:var(--bg-hover)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .rt .ti{color:var(--tx2);font-size:var(--fs-b);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.row.click:hover .rt .ti{color:var(--tx1)}
.row .rt .wh{color:var(--tx5);font-size:var(--fs-a);font-family:var(--mono);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .go{color:var(--tx5);flex-shrink:0}
.row.click:hover .go{color:var(--acc)}
.sev{display:inline-flex;align-items:center;justify-content:center;width:36px;height:22px;
border-radius:5px;font-size:var(--fs-a);font-weight:600;flex-shrink:0}
.sev-c{background:rgba(255,92,80,.16);color:var(--sev-c)}
.sev-h{background:rgba(240,134,74,.15);color:var(--sev-h)}
.sev-m{background:rgba(232,179,75,.14);color:var(--sev-m)}
.sev-l{background:rgba(90,169,230,.13);color:var(--sev-l)}
.sev-i{background:var(--bg-raise);color:var(--sev-i)}
.bdg{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
border-radius:5px;font-size:var(--fs-a);font-weight:500;line-height:1;white-space:nowrap;flex-shrink:0}
.bdg-ok{background:var(--ok-dim);color:var(--ok)}
.bdg-warn{background:var(--warn-dim);color:var(--warn)}
.bdg-dang{background:var(--dang-dim);color:var(--dang)}
.bdg-info{background:var(--info-dim);color:var(--info)}
.bdg-mut{background:var(--bg-raise);color:var(--tx4)}
.tl .r{display:flex;gap:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
.tl .r:last-child{border-bottom:none}
.tl .r:hover{background:var(--bg-hover)}
.tl .ts{flex-shrink:0;color:var(--tx5);font-family:var(--mono);
font-variant-numeric:tabular-nums;font-size:var(--fs-a);width:92px}
.tl .tx{color:var(--tx3);font-size:var(--fs-a);min-width:0}
.brow{padding:11px 4px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow .cap{display:flex;justify-content:space-between;align-items:baseline;
font-size:var(--fs-b);margin-bottom:7px}
.brow .cap .n{color:var(--tx2)}
.brow .cap .v{color:var(--tx4);font-family:var(--mono);
font-variant-numeric:tabular-nums;font-size:var(--fs-a)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--bg-raise);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--ok);transition:width .35s ease}
.bar .fill.warn{background:var(--warn)}
.bar .fill.over{background:var(--dang)}
.bar .line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn);opacity:.75}
.brow .pct{color:var(--tx5);font-size:var(--fs-a);margin-top:6px;
font-family:var(--mono);font-variant-numeric:tabular-nums}
.mapcell{display:flex;gap:12px;flex-wrap:wrap}
.mcell{background:var(--bg-raise);border:1px solid var(--line-2);border-radius:8px;
padding:12px 16px;min-width:112px}
.mcell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;
font-size:var(--fs-e);color:var(--tx1);line-height:1.2}
.mcell .v.ok{color:var(--ok)}.mcell .v.warn{color:var(--warn)}
.mcell .k{color:var(--tx4);font-size:var(--fs-a);margin-top:3px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
gap:4px;padding:34px 18px}
.empty svg{color:var(--tx5);opacity:.75;margin-bottom:6px}
.empty .t{font-size:var(--fs-b);color:var(--tx2)}
.empty .d{font-size:var(--fs-a);color:var(--tx4);line-height:1.75;max-width:480px}
.empty .d a{color:var(--info)}
</style>
</head>

<script>
"use strict";
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                 '"': "&quot;", "'": "&#39;" }[c];
      });
  }
  function show(id) {
    ["st-loading", "st-error", "st-normal"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }
  function sevCls(i) {
    return i === "危急" ? "sev-c" : i === "高" ? "sev-h" :
           i === "中" ? "sev-m" : i === "低" ? "sev-l" : "sev-i";
  }
  function fmtN(n) {
    n = Number(n) || 0;
    if (n >= 1e8) { return (n / 1e8).toFixed(2) + "亿"; }
    if (n >= 1e4) { return (n / 1e4).toFixed(1) + "万"; }
    return String(Math.round(n * 100) / 100);
  }
  function relTime(ts) {
    if (!ts) { return "—"; }
    var t = Date.parse(String(ts).replace(" ", "T"));
    if (isNaN(t)) { return String(ts).slice(0, 16); }
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) { return Math.floor(s) + " 秒前"; }
    if (s < 3600) { return Math.floor(s / 60) + " 分钟前"; }
    if (s < 86400) { return Math.floor(s / 3600) + " 小时前"; }
    return Math.floor(s / 86400) + " 天前";
  }
  function qs() { return new URLSearchParams(window.location.search); }
  var EICON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">' +
    '<path d="M4 7.5a15.5 4.5 0 0 1 16 0v9a15.5 4.5 0 0 1-16 0Z"/>' +
    '<path d="M4 12h4.5l1.8 2.5h3.4l1.8-2.5H20"/></svg>';
  function emptyBox(title, why) {
    return '<div class="empty">' + EICON + '<div class="t">' + title +
      "</div>" + '<div class="d">' + why + "</div></div>";
  }

  /* 会话流：最近动态=双气泡（CLI 叙述=士兵，battle-say=操作员） */
  function renderFlow(p) {
    var q2 = p.q2_live;
    if (!q2.recent.length) {
      $("flow").innerHTML = emptyBox("还没有会话",
        "开仗后士兵每一步叙述都在这里——" +
        '<a href="/p/new-task">说「打 xxx」开第一仗</a>。');
      return;
    }
    $("flow").innerHTML = q2.recent.map(function (r) {
      var op = /battle-say/.test(r.event || "");
      return '<div class="bub ' + (op ? "operator" : "agent") + '">' +
        '<span class="meta" title="' + esc(r.ts) + '">' + esc(relTime(r.ts)) +
        " · " + esc(r.actor) + "</span>" +
        esc(r.text) + "</div>";
    }).join("");
  }

  function renderOverview(p) {
    var q4 = p.q4_budget, g = q4.goal, q1 = p.q1_vulns;
    $("ov-cards").innerHTML =
      cc(q1.total, "验真漏洞（在册）", "ok") +
      cc(p.q2_live.inflight_count, "在途任务", "") +
      cc(p.q3_waiting.counts.pending_approvals, "待我审批",
         p.q3_waiting.counts.pending_approvals ? "warn" : "") +
      cc(p.q3_waiting.counts.asks, "求助",
         p.q3_waiting.counts.asks ? "warn" : "") +
      cc(q4.pct.tokens + "%", "token 已用",
         q4.over.tokens ? "dang" : (q4.pct.tokens >= 80 ? "warn" : ""));
    $("ov-kv").innerHTML =
      kv("目标", g.target || "—") +
      kv("任务说明", g.objective || "—") +
      kv("预算帽（token;请求;小时）", g.budget_raw || "未设") +
      kv("记账笔数", q4.rows_n) +
      kv("仗", (p.battle && p.battle.id) || "—");
  }
  function cc(v, k, cls) {
    return '<div class="kpi"><div class="v ' + (cls || "") + '">' + esc(v) +
      '</div><div class="k">' + esc(k) + "</div></div>";
  }
  function kv(k, v) {
    return '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + "</div>";
  }

  function renderMap() {
    var b = qs().get("battle");
    fetch("/api/v2/coverage.json" + (b ? "?battle=" + encodeURIComponent(b) : ""),
          { headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); }
                           return r.json(); })
      .then(function (c) {
        var st = (c && c.counts) || null;
        if (!st) {
          $("map-body").innerHTML = emptyBox("地图数据还没铺开",
            "资产面显形后这里给覆盖概况。" +
            '<a href="/p/coverage">资产覆盖</a> · <a href="/console/graph">攻击链路</a>');
          return;
        }
        var tested = st.tested || 0, untested = st.untested || 0;
        var total = tested + untested;
        $("map-body").innerHTML =
          '<div class="mapcell">' +
          mcell(tested, "已覆盖面", "ok") +
          mcell(untested, "未测面", untested ? "warn" : "") +
          mcell(total ? Math.round(tested * 100 / total) + "%" : "—", "覆盖率", "") +
          "</div>" +
          '<div style="font-size:var(--fs-a);color:var(--tx4);margin-top:12px">' +
          "格阵与原因归档见<a href=/p/coverage>资产覆盖页</a>；" +
          "链路图见<a href=/console/graph>攻击链路</a>。</div>";
      })
      .catch(function () {
        $("map-body").innerHTML = emptyBox("地图投影暂时取不到",
          "不硬造。<a href='/p/coverage'>去资产覆盖页看</a>。");
      });
  }
  function mcell(v, k, cls) {
    return '<div class="mcell"><div class="v ' + (cls || "") + '">' + esc(v) +
      '</div><div class="k">' + esc(k) + "</div></div>";
  }

  function renderLive(p) {
    var q2 = p.q2_live;
    if (!q2.intents.length) {
      $("live-intents").innerHTML = emptyBox("活池空",
        "没有在途任务——新派的任务会先落在这里。");
    } else {
      $("live-intents").innerHTML =
        '<table class="tbl"><thead><tr><th style="width:88px">状态</th>' +
        "<th>任务</th><th style=\"width:130px\">编号</th></tr></thead><tbody>" +
        q2.intents.map(function (it) {
          var b = it.status === "running" ? "bdg-ok" :
                  it.status === "blocked" ? "bdg-warn" :
                  it.status === "failed" ? "bdg-dang" : "bdg-mut";
          return "<tr><td><span class=\"bdg " + b + "\">" + esc(it.status_zh) +
            "</span></td><td>" + esc(it.title) + "</td>" +
            '<td class="mono" style="color:var(--tx5)">' + esc(it.id) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    $("live-recent").innerHTML = tlRows(q2.recent) ||
      emptyBox("还没有动态", "开仗后每一步都进战账。");
  }

  function tlRows(rows) {
    return rows.map(function (r) {
      return '<div class="r"><span class="ts" title="' + esc(r.ts) + '">' +
        esc(relTime(r.ts)) + "</span>" +
        '<span class="tx">' + esc(r.text) + "</span></div>";
    }).join("");
  }

  function renderVuln(p) {
    var q1 = p.q1_vulns;
    if (!q1.total) {
      $("vuln-body").innerHTML = emptyBox("还没有验真在册的漏洞",
        "上榜须机器复放验真。<a href='/p/findings'>漏洞页</a>会给出全部与证据袋。");
      return;
    }
    $("vuln-body").innerHTML = '<div class="rows">' +
      q1.top.map(function (v) {
        return '<a class="row click" href="' + esc(v.detail_url) + '">' +
          '<span class="sev ' + sevCls(v.impact) + '">' + esc(v.impact) + "</span>" +
          '<span class="rt"><span class="ti">' + esc(v.title) + "</span>" +
          '<span class="wh">' + esc(v.where) + "</span></span>" +
          '<span class="bdg bdg-mut">证据 ' + v.evidence.length + " 件</span>" +
          '<span class="go">›</span></a>';
      }).join("") + "</div>" +
      '<div class="empty" style="padding:12px 6px"><div class="d">共 ' + q1.total +
      ' 枚验真在册——<a href="/p/findings">全部与证据袋 →</a></div></div>';
  }

  function renderCost(p) {
    var q4 = p.q4_budget;
    var names = { tokens: "token", requests: "请求次数", hours: "时长（小时）" };
    var hasCap = q4.cap.tokens > 0 || q4.cap.requests > 0 || q4.cap.hours > 0;
    if (!q4.rows_n && !hasCap) {
      $("cost-body").innerHTML = emptyBox("还没花过钱",
        "按笔记账，对预算帽给余量条——80% 预警、超帽标红。");
      return;
    }
    var h = "";
    ["tokens", "requests", "hours"].forEach(function (k) {
      var cap = q4.cap[k], used = q4.used[k], pct = q4.pct[k];
      var cls = q4.over[k] ? "over" : (pct >= q4.warn_pct ? "warn" : "");
      h += '<div class="brow"><div class="cap"><span class="n">' + names[k] +
        '</span><span class="v">' + fmtN(used) + " / " +
        (cap > 0 ? fmtN(cap) : "未设帽") + "</span></div>" +
        '<div class="bar">' + (cap > 0
          ? '<div class="fill ' + cls + '" style="width:' + Math.min(100, pct) +
            '%"></div><div class="line" style="left:' + q4.warn_pct + '%"></div>'
          : "") + '</div><div class="pct">' + (cap > 0
          ? "已用 " + pct + "% · 余 " + Math.max(0, 100 - pct) + "%"
          : "未设帽") + "</div></div>";
    });
    $("cost-body").innerHTML = h;
  }

  function renderLog(p) {
    $("log-body").innerHTML = tlRows(p.q2_live.recent) ||
      emptyBox("还没有日志", "每一步都会进战账，防篡改可回放。<a href='/activity'>实时日志</a>");
  }

  /* 仗切换：tasks.json 供仗单（缺=只显示当前仗名） */
  function wireSwitcher(p) {
    fetch("/api/v2/tasks.json", { headers: { "X-Requested-With": "cockpit" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) {
        var sel = $("battle-sel");
        var list = (t && t.battles) || [];
        if (!list.length) {
          sel.innerHTML = "<option>" +
            esc((p.battle && p.battle.id) || "当前账本") + "</option>";
          return;
        }
        var cur = qs().get("battle") || String((p.battle && p.battle.n) || "");
        sel.innerHTML = list.map(function (b) {
          return '<option value="' + b.n + '"' +
            (String(b.n) === cur ? " selected" : "") + ">" + esc(b.id) +
            "</option>";
        }).join("");
        sel.onchange = function () {
          window.location.search = "?battle=" + sel.value;
        };
      })
      .catch(function () {});
  }

  function render(p) {
    renderFlow(p); renderOverview(p); renderLive(p); renderVuln(p);
    renderCost(p); renderLog(p); renderMap(); wireSwitcher(p);
    show("st-normal");
  }

  Array.prototype.forEach.call(
    document.querySelectorAll("#tabs button"), function (btn) {
      btn.onclick = function () {
        Array.prototype.forEach.call(
          document.querySelectorAll("#tabs button"), function (b2) {
            b2.classList.toggle("on", b2 === btn);
          });
        Array.prototype.forEach.call(
          document.querySelectorAll(".tabpane"), function (tp) {
            tp.classList.toggle("on", tp.id === "tp-" + btn.dataset.t);
          });
      };
    });

  var b = qs().get("battle");
  if (b) {
    Array.prototype.forEach.call(
      document.querySelectorAll('#side a[href^="/"]'),
      function (a) {
        a.href = a.href + (a.href.indexOf("?") < 0 ? "?" : "&") +
                 "battle=" + encodeURIComponent(b);
      });
  }
  fetch("/api/v2/cockpit.json" + (b ? "?battle=" + encodeURIComponent(b) : ""),
        { headers: { "X-Requested-With": "cockpit" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      $("err-detail").textContent = String(e && e.message ? e.message : e);
      show("st-error");
    });

  try { nav.push({ id: "mission", label: "任务", group: "任务" }); } catch (e) {}
})();
</script>
</body>
</html>
