<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问 AI · GraphLed</title>
<!-- 全域锚定对话 MVP（anchored-chat-v1 裁剪版）：锚定一行账本（如一个发现），
     问题+该行上下文投给模型道，答案带引用行址。只读问答——AI 只回答，
     不执行任何操作；对话仅本次浏览保留（不落账本）。
     设计权威 docs/design/contextual-chat-v1.md；文案宪法#41（界面人话律）。
     共享壳 /static/app.js 由 UI-1 舰独写；本页仅消费 nav.push（守卫式）。 -->
<style>
:root{--g0:#0a0b0d;--g1:#101216;--g2:#16181d;--g3:#1d2026;--g4:#252930;--g5:#2e333b;
--g6:#3a4049;--g7:#4c535e;--g8:#6b7480;--g9:#8b949f;--ga:#aab3bd;--gb:#ccd3da;--gc:#e8edf2;
--acc:#3ddc97;--acc2:#2fae78;--warn:#e8b34b;--dang:#e8635a;--info:#5aa9e6;
--mono:"SF Mono",Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--g0);color:var(--gb);
font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
min-height:100vh;display:flex;flex-direction:column}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
#top{height:46px;background:var(--g1);border-bottom:1px solid var(--g3);
display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0}
#top .crumb{color:var(--g8);font-size:12px}
#top .crumb b{color:var(--ga);font-weight:500}
#top .sp{flex:1}
#ro-badge{font-size:11px;color:var(--warn);border:1px solid rgba(232,179,75,.4);
border-radius:3px;padding:1px 8px}
body.mode-tab #top{display:none}
#wrap{width:100%;max-width:880px;margin:0 auto;padding:18px 24px 60px;flex:1}
.pane{background:var(--g2);border:1px solid var(--g4);border-radius:6px;
padding:14px;margin-bottom:14px}
.pane h3{font-size:13px;color:var(--gc);margin-bottom:10px}
.pane h3 .sub{color:var(--g8);font-size:11px;font-weight:400;margin-left:8px}
/* 锚表单 */
#anchor-form{display:flex;gap:8px;flex-wrap:wrap}
#anchor-table{background:var(--g3);border:1px solid var(--g5);color:var(--gc);
padding:7px 10px;border-radius:4px;font-size:12.5px}
#anchor-id{flex:1;min-width:200px;background:var(--g3);border:1px solid var(--g5);
color:var(--gc);padding:7px 10px;border-radius:4px;font-size:12.5px;
font-family:var(--mono)}
#anchor-id:focus,#anchor-table:focus{outline:none;border-color:var(--acc2)}
.hint{color:var(--g8);font-size:11.5px;margin-top:8px;line-height:1.7}
/* 对象卡 */
#anchor-card{display:none;border:1px solid var(--g4);border-left:3px solid var(--info);
border-radius:6px;background:var(--g1);padding:10px 12px;margin-bottom:14px}
#anchor-card.on{display:block}
#anchor-card .al{font-size:13px;color:var(--gc)}
#anchor-card .am{margin-top:4px;color:var(--g8);font-size:11px;font-family:var(--mono);
display:flex;gap:12px;flex-wrap:wrap}
/* 消息流 */
#chat-log{display:grid;gap:12px}
.msg{max-width:88%;border-radius:8px;padding:10px 14px;font-size:13px;
line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{justify-self:end;background:var(--g3);border:1px solid var(--g5);color:var(--gc)}
.msg.ai{justify-self:start;background:var(--g1);border:1px solid var(--g4)}
.msg.err{justify-self:start;background:rgba(232,99,90,.08);
border:1px solid rgba(232,99,90,.4);color:var(--dang);font-size:12.5px}
.msg .mmeta{margin-top:8px;color:var(--g8);font-size:11px;font-family:var(--mono)}
/* 引用区 */
#ask-citations{margin-top:10px}
.cite{display:inline-flex;gap:6px;align-items:center;margin:3px 4px 3px 0;
padding:2px 9px;border-radius:3px;font-size:11px;font-family:var(--mono);
background:rgba(61,220,151,.12);color:var(--acc);border:1px solid rgba(61,220,151,.25)}
.cite.miss{background:rgba(232,179,75,.12);color:var(--warn);
border-color:rgba(232,179,75,.3)}
.cite .h{color:var(--g8)}
.cites-title{color:var(--g8);font-size:11px;margin-top:10px}
/* 提问区 */
#ask-bar{display:flex;gap:8px;align-items:flex-end}
#ask-input{flex:1;resize:vertical;min-height:64px;background:var(--g3);
border:1px solid var(--g5);color:var(--gc);padding:9px 11px;border-radius:4px;
font:13px/1.6 inherit}
#ask-input:focus{outline:none;border-color:var(--acc2)}
#btn-ask{background:var(--acc2);color:#08130d;border:none;border-radius:4px;
padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;height:40px}
#btn-ask:disabled{background:var(--g5);color:var(--g8);cursor:not-allowed}
/* 错误态（通道未配/不可用） */
#st-error{display:none}
#st-error.on{display:block;margin-bottom:14px;border:1px solid rgba(232,99,90,.45);
border-radius:6px;background:rgba(232,99,90,.06);padding:10px 14px;
color:var(--dang);font-size:12.5px}
#st-error code{font-family:var(--mono);color:var(--warn);word-break:break-all}
#btn-retry{margin-top:6px;background:none;border:1px solid var(--g5);color:var(--ga);
border-radius:4px;padding:3px 12px;font-size:11.5px;cursor:pointer}
</style>
</head>
<body>
<div id="top">
  <span class="crumb"><b>问 AI</b><span id="crumb-goal"></span></span>
  <span class="sp"></span>
  <span id="ro-badge">只读问答 · 不执行任何操作</span>
</div>
<div id="wrap">

  <div class="pane">
    <h3>提问对象<span class="sub">选中一行账本再提问——上下文自动带上，无需粘贴</span></h3>
    <div id="anchor-form">
      <select id="anchor-table">
        <option value="findings.tsv" selected>发现</option>
        <option value="intents.tsv">意图</option>
        <option value="E-index.tsv">证据</option>
        <option value="assets.tsv">资产</option>
        <option value="goals.tsv">任务</option>
      </select>
      <input id="anchor-id" placeholder="编号，如 FD-t1-0001">
    </div>
    <p class="hint">例如选中「发现」并填入编号——提问时，这条发现、它的证据卡、
       所属意图会自动作为上下文发给模型；答案里的引用会标出账本行址，
       点击可对照原文核验。</p>
  </div>

  <div id="anchor-card">
    <div class="al" id="anchor-label"></div>
    <div class="am"><span id="anchor-ref"></span><span id="anchor-hash"></span></div>
  </div>

  <div id="st-error"><span id="err-text"></span>
    <button id="btn-retry">重试</button>
  </div>

  <div class="pane">
    <h3>对话<span class="sub">仅本次浏览保留——只读问答不写任何记录</span></h3>
    <div id="chat-log">
      <p class="hint" id="chat-placeholder">先填对象编号，再在下方输入问题。</p>
    </div>
    <div id="ask-citations"></div>
    <div id="ask-bar" style="margin-top:12px">
      <textarea id="ask-input" placeholder="例如：这个发现的影响是什么？依据是哪几行？"></textarea>
      <button id="btn-ask">提问</button>
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var goal = qs.get("goal") || "";
  if (qs.get("table")) { document.getElementById("anchor-table").value = qs.get("table"); }
  if (qs.get("id")) { document.getElementById("anchor-id").value = qs.get("id"); }
  if (goal) { document.getElementById("crumb-goal").textContent = " · " + goal; }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
               "'": "&#39;" }[c];
    });
  }
  function tok(n) { return n == null ? "—" : String(n); }
  function hidePlaceholder() {
    var p = $("chat-placeholder");
    if (p) { p.parentNode.removeChild(p); }
  }
  function addMsg(cls, html) {
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerHTML = html;
    $("chat-log").appendChild(div);
    div.scrollIntoView({ block: "nearest" });
    return div;
  }
  function showError(err) {
    $("err-text").innerHTML = "<code>" + esc(err) + "</code>";
    $("st-error").classList.add("on");
  }
  function clearError() { $("st-error").classList.remove("on"); }

  function renderAnchor(a) {
    if (!a) { return; }
    $("anchor-label").textContent = a.label || "";
    $("anchor-ref").textContent = "账本行址 " + (a.ref || "");
    $("anchor-hash").textContent = a.line_hash
      ? "行内容指纹 " + a.line_hash : "";
    $("anchor-card").classList.add("on");
  }

  function renderCitations(cites) {
    var box = $("ask-citations");
    if (!cites || !cites.length) { box.innerHTML = ""; return; }
    var html = '<div class="cites-title">引用行址（已对回账本核验）</div>';
    cites.forEach(function (c) {
      if (c.ok) {
        html += '<span class="cite" title="行内容指纹 ' + esc(c.line_hash) + '">' +
          esc(c.ref) + '<span class="h">' + esc(c.label) + "</span></span>";
      } else {
        html += '<span class="cite miss" title="答案引用了不存在的行——请以上下文为准">' +
          esc(c.ref) + " 未命中</span>";
      }
    });
    box.innerHTML = html;
  }

  function busy(on) {
    $("btn-ask").disabled = on;
    $("btn-ask").textContent = on ? "思考中…" : "提问";
    $("ask-input").disabled = on;
  }

  function ask() {
    var table = $("anchor-table").value;
    var id = $("anchor-id").value.trim();
    var message = $("ask-input").value.trim();
    if (!message) { return; }
    if (!id) {
      showError("请先填提问对象的编号（如 FD-t1-0001），再提问。");
      return;
    }
    clearError();
    hidePlaceholder();
    addMsg("user", esc(message));
    $("ask-input").value = "";
    busy(true);
    var body = { anchor: { table: table, id: id }, message: message };
    if (goal) { body.goal = goal; }
    fetch('/api/v2/ask', {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "X-Requested-With": "XMLHttpRequest" },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (p) {
        busy(false);
        if (p.error) {
          showError(p.error + (p.reason ? "（" + esc(p.reason) + "）" : ""));
          addMsg("err", "这次提问没有成功：\n" + esc(p.error));
          return;
        }
        renderAnchor(p.anchor);
        var meta = "模型 " + esc(p.model || "—") +
          " · 输入 " + tok(p.usage && p.usage.prompt_tokens) +
          " token · 输出 " + tok(p.usage && p.usage.completion_tokens) + " token";
        addMsg("ai", esc(p.answer) + '\n<span class="mmeta">' + meta + "</span>");
        renderCitations(p.citations);
      })
      .catch(function (e) {
        busy(false);
        showError("网络问题：" + e);
      });
  }

  $("btn-ask").addEventListener("click", ask);
  $("ask-input").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ask(); }
  });
  $("btn-retry").addEventListener("click", function () {
    clearError();
    $("ask-input").focus();
  });

  /* 宿主壳自注册（共享壳缺席时本页独立可用——守卫式消费 UI-1 舰契约） */
  if (typeof nav !== "undefined" && typeof nav.push === "function") {
    nav.push({ id: 'anchored-chat', title: '问 AI', group: '系统' });
  }
  if (window.__TAB_ID__ === "AnchoredChatTab") { document.body.classList.add("mode-tab"); }
})();
</script>
</body>
</html>
