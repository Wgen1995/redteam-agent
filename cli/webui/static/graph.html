<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探隐观察面 · 十边图 tanyin-web v0.9d</title>
<style>
  /* ZhulongFire 皮肤：浅色默认 + 深色镜像（变量同名成对，切 html[data-theme]） */
  :root { --bg:#f6f8fb; --card:#ffffff; --ink:#182230; --dim:#5c6b80;
          --line:#d9e1ec; --accent:#2563EB; --accent-ink:#ffffff;
          --soft:#e9effd; --ok:#157347; --bad:#d92d20; --warn:#b54708;
          --idle:#8593a8; --skeleton:#e3e9f2; }
  html[data-theme="dark"] { --bg:#0d1320; --card:#151d2e; --ink:#e8eef8;
          --dim:#8fa0b8; --line:#2a3752; --accent:#7aa5ff; --accent-ink:#0b1220;
          --soft:#1d2a47; --ok:#3ecf8e; --bad:#ff7a70; --warn:#f0b429;
          --idle:#66759a; --skeleton:#1e2a44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "PingFang SC","Hiragino Sans GB",Microsoft YaHei,sans-serif; }
  a { color:var(--accent); }
  header { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 16px;
           padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:1px; }
  .page-sub { flex-basis:100%; margin:0; color:var(--dim); font-size:12px; }
  header nav { display:flex; gap:2px 12px; font-size:12px; margin-left:auto; }
  header nav a { color:var(--dim); text-decoration:none; white-space:nowrap; }
  header nav a:hover { color:var(--accent); }
  header nav a.here { color:var(--accent); border-bottom:2px solid var(--accent);
                      font-weight:600; }
  #theme-toggle { font:inherit; font-size:12px; padding:3px 12px; cursor:pointer;
                  border:1px solid var(--line); border-radius:14px;
                  background:var(--card); color:var(--ink); }
  #theme-toggle:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:18px 22px; max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px;
            padding:14px 16px; margin-bottom:16px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--dim);
               font-weight:600; letter-spacing:2px; }
  footer { color:var(--dim); font-size:11px; padding:8px 22px 18px; }
  /* 四态纪律：骨架/加载/空/错误（骨架=静默灰条占位，零动效） */
  .statebox { min-height:22px; }
  .state-msg { display:none; margin:4px 0 2px; font-size:12px; color:var(--dim); }
  .statebox[data-state="loading"] .state-msg { display:block; }
  .statebox[data-state="empty"] .state-msg { display:block; }
  .statebox[data-state="error"] .state-msg { display:block; color:var(--bad); }
  .skeleton { display:none; height:12px; border-radius:4px;
              background:var(--skeleton); margin:6px 0; }
  .statebox[data-state="loading"] .skeleton { display:block; }
  .skeleton.sk-a { width:55%; }
  .skeleton.sk-b { width:85%; }
  .skeleton.sk-c { width:40%; }
  .statebox > .content { display:none; }
  .statebox[data-state="ready"] > .content { display:block; }
  .statebox[data-state="error"] > .content { display:block; }
  .statebox[data-state="empty"] > .content { display:none; }
  .t-ok { color:var(--ok); } .t-bad { color:var(--bad); }
  .t-warn { color:var(--warn); } .t-idle { color:var(--dim); }
  /* 页内 */
  #stats .content { font-size:13px; color:var(--dim); }
  #stats .num { color:var(--accent); font-weight:600; }
  #edge-legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12px;
                 color:var(--dim); align-items:center; }
  #edge-legend .item { display:inline-flex; align-items:center; gap:5px; }
  #edge-legend svg { display:block; }
  #graph { width:100%; background:var(--bg); border-radius:6px; display:block; }
  #detail { min-height:40px; color:var(--dim); font-size:13px; margin-top:10px; }
  .node { cursor:pointer; }
  .node text { font:12px ui-monospace,Menlo,Consolas,monospace; }
  .node.candidate { opacity:.45; }
  .layer-head { font:11px ui-monospace,Menlo,Consolas,monospace; }
</style>
<script>
/* STATUS-JS:BEGIN */
"use strict";
/* tanyin-web status.js · 状态语义单源（v0.9d ZhulongFire 换肤批）
   语义照 ARTEX status.ts「状态先讲清语义边界再上色」——抄语义不抄代码：
   九门门态 / 证据重放态 / 矩阵格态 → 中文标签+tone 一处定义，五页共用。
   本文件即单源；五页 <head> 内嵌字节级副本（tests/test_v09d_skin.py 字节钉同步——
   常驻 0.9c 老进程无 /status.js 路由，页面必须完全自包含，不得外链引用本文件）。 */

var TY = window.TY || {};

/* 九门：id+中文名 —— 与 phases/phases.yaml 的 states 全序 + gates.title 一致 */
TY.NINE_GATES = [
  { id: "P0", name: "授权门" },
  { id: "P1", name: "测绘" },
  { id: "P2", name: "规划" },
  { id: "P3", name: "演进循环" },
  { id: "P4", name: "汇总" },
  { id: "P5", name: "报告" },
  { id: "P5.5", name: "签发门" },
  { id: "P6.0", name: "清理门" },
  { id: "P6", name: "沉淀" }
];

/* 门态：过门=绿 / 拦下=红 / 未到=灰（label=单字徽章文案） */
TY.GATE_STATE = {
  "PASS": { label: "过", tone: "ok" },
  "FAIL": { label: "拦", tone: "bad" },
  "PENDING": { label: "待", tone: "idle" }
};

/* 证据重放态：空串=未重放（timeline 无对应 replay-probe 行） */
TY.REPLAY_STATE = {
  "reproduced": { label: "已复现", tone: "ok" },
  "not-reproduced": { label: "未复现", tone: "bad" },
  "manual": { label: "人工", tone: "warn" },
  "env-diff": { label: "环境差异", tone: "warn" },
  "": { label: "未重放", tone: "idle" }
};

/* 矩阵格态：空格=欠账（覆盖热图三态语义） */
TY.CELL_STATE = {
  "cold": { label: "已置格", tone: "ok" },
  "frozen": { label: "冻结格", tone: "info" },
  "empty": { label: "欠账空格", tone: "bad" }
};

/* 主题：浅色默认 + 深色镜像（CSS 变量同名成对）；localStorage 记忆——偏好只存本浏览器 */
TY.THEME_KEY = "tanyin-theme";

TY.applyTheme = function (theme) {
  var t = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  return t;
};

TY.savedTheme = function () {
  try { return window.localStorage.getItem(TY.THEME_KEY); }
  catch (err) { return null; }               /* 隐私模式禁存：回浅色默认 */
};

TY.toggleTheme = function () {
  var now = document.documentElement.getAttribute("data-theme") === "dark"
    ? "light" : "dark";
  TY.applyTheme(now);
  try { window.localStorage.setItem(TY.THEME_KEY, now); }
  catch (err) { /* 存不进也照样换肤 */ }
  return now;
};

TY.syncThemeButton = function (btn) {
  if (!btn) { return; }
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  btn.textContent = dark ? "浅色" : "深色";
  btn.setAttribute("aria-label", dark ? "切换到浅色主题" : "切换到深色主题");
};

/* 四态纪律：骨架/加载/空/错误 —— 一处实现五页共用（骨架=静默灰条占位，零动效） */
TY.setState = function (box, state, text) {
  if (!box) { return null; }
  box.setAttribute("data-state", state);
  if (text !== undefined && text !== null) { box.textContent = text; }
  return box;
};

TY.failText = function (err) {
  return "加载失败：" + err + "（自动重试，画面保留上次数据）";
};

/* 载入即恢复主题（内嵌于 <head>，早于正文绘制——深色用户不白闪） */
TY.bootTheme();
/* STATUS-JS:END */
</script>
</head>
<body>
<header>
  <h1>十边图</h1>
  <p class="page-sub">你在看什么：这一仗打出来的所有对象（目标→意图→资产/凭据→事实→发现→证据）之间谁连着谁——十种连线各一色，点节点看详情。</p>
  <nav>
    <a href="/">战局总览</a><a href="/activity">活动流</a><a href="/session">会话</a><a href="/coverage">热图</a><a class="here" href="/graph">十边图</a><a href="/evidence">证据卡</a><a href="/metrics">度量</a><a href="/experiments">实验</a>
  </nav>
  <button id="theme-toggle" type="button">深色</button>
</header>
<main>
  <section>
    <h2>图谱统计</h2>
    <div id="stats" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"></div>
    </div>
  </section>
  <section>
    <h2>边着色图例 · 十种连线全区分（attack 实线金 / cross_ref 虚线 / supersedes 点线 / scope-rel 灰）</h2>
    <div id="edge-legend"></div>
  </section>
  <section>
    <h2>分层布局（目标→意图→资产/凭据→事实→发现→证据 · 候选半透明 · 点击节点看详情）</h2>
    <div id="graph-box" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <div class="skeleton sk-c"></div>
      <p class="state-msg">载入中…</p>
      <div class="content">
        <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="detail">点击节点查看详情</div>
      </div>
    </div>
  </section>
</main>
<footer>tanyin-web v0.9d · 十边图只读投影（血缘边账 · 十种 kind · 零写入账本）</footer>
<script>
"use strict";
/* 数据面：/api/graph.json（节点 id+kind+layer / 边 10 kind / edge_style 着色单源）；
   渲染面：vanilla SVG 静态分层布局（viz_render 同语义升级），色取皮肤变量，零框架零 CDN。 */
var NS = "http://www.w3.org/2000/svg";
var COL_W = 170, ROW_H = 34, TOP = 48, LEFT = 30;
var LAYER_NAMES = { 0: "目标", 1: "意图", 2: "资产/凭据", 3: "事实", 4: "发现", 5: "证据" };

function svgEl(tag, attrs) {
  var n = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach(function (k) {
    n.setAttribute(k, attrs[k]);
  });
  return n;
}
function el(tag, cls) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  return n;
}
/* 文本一律 textContent 落节点——账本文本不当 HTML 解析（防注入） */

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function setBox(box, stateName, msgText) {
  TY.setState(box, stateName);
  var m = box.querySelector(".state-msg");
  if (m && msgText) { m.textContent = msgText; }
}

/* —— 主题切换钮（单源逻辑在 status.js；换肤后重画取色） —— */
var themeBtn = document.getElementById("theme-toggle");
TY.syncThemeButton(themeBtn);
themeBtn.addEventListener("click", function () {
  TY.toggleTheme();
  TY.syncThemeButton(themeBtn);
  refresh();                                  /* SVG 重新取皮肤变量色 */
});

function renderStats(st) {
  var box = document.getElementById("stats");
  var content = box.querySelector(".content");
  content.textContent = "";
  var a = el("span", "num"), b = el("span", "num");
  a.textContent = st.nodes; b.textContent = st.edges;
  content.appendChild(document.createTextNode("节点 "));
  content.appendChild(a);
  content.appendChild(document.createTextNode(" · 连线 "));
  content.appendChild(b);
  content.appendChild(document.createTextNode("（血缘账十种 kind 全集投影）"));
  setBox(box, "ready");
}

function renderEdgeLegend(d) {
  var box = document.getElementById("edge-legend");
  box.textContent = "";
  var kinds = Object.keys(d.edge_style).sort();
  kinds.forEach(function (k) {
    var st = d.edge_style[k];
    var item = el("span", "item");
    var sw = svgEl("svg", { width: 34, height: 8 });
    var line = svgEl("line", { x1: 1, y1: 4, x2: 33, y2: 4,
                               stroke: st.color, "stroke-width": 2 });
    if (st.dash) { line.setAttribute("stroke-dasharray", st.dash); }
    sw.appendChild(line);
    var cnt = d.edges.filter(function (e) { return e.kind === k; }).length;
    var lab = el("span");
    lab.textContent = k + " ×" + cnt;
    item.appendChild(sw); item.appendChild(lab);
    box.appendChild(item);
  });
}

function layout(nodes) {
  /* 静态分层：层=列，层内按 id 序叠放（确定性，无随机源） */
  var byLayer = {}, pos = {}, maxRows = 1;
  nodes.forEach(function (n) {
    (byLayer[n.layer] = byLayer[n.layer] || []).push(n);
  });
  Object.keys(byLayer).forEach(function (l) {
    byLayer[l].sort(function (a, b) { return a.id < b.id ? -1 : 1; })
      .forEach(function (n, i) {
        pos[n.id] = [LEFT + Number(l) * COL_W + 10, TOP + i * ROW_H + 14];
      });
    maxRows = Math.max(maxRows, byLayer[l].length);
  });
  return { pos: pos, width: LEFT + 6 * COL_W, height: TOP + maxRows * ROW_H + 20 };
}

function renderGraph(d) {
  var svg = document.getElementById("graph");
  while (svg.firstChild) { svg.removeChild(svg.firstChild); }
  var ink = cssVar("--ink"), dim = cssVar("--dim"), accent = cssVar("--accent");
  var lay = layout(d.nodes);
  svg.setAttribute("viewBox", "0 0 " + lay.width + " " + lay.height);
  svg.setAttribute("height", lay.height);
  Object.keys(LAYER_NAMES).forEach(function (l) {
    var t = svgEl("text", { x: LEFT + Number(l) * COL_W + 10, y: 24,
                            "class": "layer-head", fill: dim });
    t.textContent = LAYER_NAMES[l] + "（" + l + "）";
    svg.appendChild(t);
  });
  d.edges.forEach(function (e) {
    var p1 = lay.pos[e.src], p2 = lay.pos[e.dst];
    if (!p1 || !p2) { return; }              /* 端点不在节点集：跳画不跳数据 */
    var st = d.edge_style[e.kind] || { color: accent, dash: "" };
    var attrs = { x1: p1[0] + 6, y1: p1[1] + 4, x2: p2[0] - 6, y2: p2[1] + 4,
                  stroke: st.color, "stroke-width": 1.5,
                  "stroke-dasharray": st.dash || "none",
                  opacity: .85 };
    svg.appendChild(svgEl("line", attrs));
  });
  d.nodes.forEach(function (n) {
    var p = lay.pos[n.id];
    var g = svgEl("g", { "class": "node" + (n.candidate ? " candidate" : "") });
    var dot = svgEl("circle", { cx: p[0], cy: p[1] + 4, r: 4,
                                fill: n.candidate ? dim : accent });
    var t = svgEl("text", { x: p[0] + 9, y: p[1] + 8, fill: n.candidate ? dim : ink });
    t.textContent = n.kind + ":" + n.id;
    g.appendChild(dot); g.appendChild(t);
    g.addEventListener("click", function () {
      document.getElementById("detail").textContent =
        "节点 " + n.id + " · 类型 " + n.kind + " · 层 " + LAYER_NAMES[n.layer] +
        (n.candidate ? " · 候选（半透明）" : "");
    });
    svg.appendChild(g);
  });
}

function refresh() {
  fetch("/api/graph.json").then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.nodes.length) {
        renderStats(d.stats);
        setBox(document.getElementById("graph-box"), "empty",
               "暂无图谱——账本还没建任何节点/连线");
        return;
      }
      renderStats(d.stats); renderEdgeLegend(d); renderGraph(d);
      setBox(document.getElementById("graph-box"), "ready");
    })
    .catch(function (e) {
      setBox(document.getElementById("stats"), "error", TY.failText(e));
      setBox(document.getElementById("graph-box"), "error", TY.failText(e));
    });
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
