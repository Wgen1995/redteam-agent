<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphLed · 操作员登录</title>
<!-- T6·P1 登录页美化：视觉=原型 panorama/graphled-console-prototype.html
     （12级灰阶+单强调色+mono数字）；文案宪法#41；四态=空/加载/错误/正常。
     POST /login 窄门口径不变（JSON password+X-Requested-With）；
     429 retry_after_s → 页内锁定倒计时；成功 → 总览。 -->
<style>
  :root{--g0:#0a0b0d;--g1:#101216;--g2:#16181d;--g3:#1d2026;--g4:#252930;--g5:#2e333b;
        --g6:#3a4049;--g7:#4c535e;--g8:#6b7480;--g9:#8b949f;--ga:#aab3bd;--gb:#ccd3da;
        --gc:#e8edf2;--acc:#3ddc97;--acc2:#2fae78;--warn:#e8b34b;--dang:#e8635a;
        --mono:"SF Mono",Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--g0);color:var(--gb);
       font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;
       background-image:radial-gradient(ellipse 60% 40% at 50% 0%,
                        rgba(61,220,151,.05), transparent 70%)}
  .login-card{background:var(--g2);border:1px solid var(--g4);border-radius:8px;
              padding:32px;width:min(360px,92vw);
              box-shadow:0 8px 32px rgba(0,0,0,.45)}
  .brand-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .brand-row svg{flex:none;color:var(--acc)}
  .login-card h1{font-size:20px;letter-spacing:1px;color:var(--gc)}
  .login-card .sub{color:var(--g8);font-size:12px;margin:0 0 20px;line-height:1.7}
  .login-card label{display:block;font-size:12px;color:var(--g8);
                    margin:0 0 8px;letter-spacing:1px}
  .pw-wrap{position:relative}
  .pw-wrap input{width:100%;background:var(--g1);border:1px solid var(--g5);
                 border-radius:6px;color:var(--gc);padding:8px 48px 8px 12px;
                 font:14px/1.4 inherit;transition:border-color .15s}
  .pw-wrap input:focus{outline:none;border-color:var(--acc2)}
  .pw-wrap input.err{border-color:var(--dang)}          /* 错误态=输入框红 */
  .pw-wrap button{position:absolute;top:0;right:0;height:100%;
                  padding:0 12px;border:none;background:none;
                  color:var(--g8);cursor:pointer;display:inline-flex;align-items:center}
  .pw-wrap button:hover{color:var(--acc)}
  #op-login{width:100%;font:600 14px/1 inherit;margin-top:16px;padding:12px;
            border:1px solid var(--acc2);border-radius:6px;
            background:var(--acc2);color:#08130d;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:8px}
  #op-login:hover{background:var(--acc)}
  #op-login:disabled{background:var(--g4);border-color:var(--g5);color:var(--g7);
                     cursor:not-allowed}
  /* 加载态：按钮转圈（loading class 由 JS 挂） */
  #op-login .spin{width:14px;height:14px;border:2px solid rgba(8,19,13,.25);
                  border-top-color:#08130d;border-radius:50%;display:none;
                  animation:spin .8s linear infinite}
  #op-login.loading .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  #op-msg{color:var(--dang);font-size:12px;min-height:20px;margin:8px 0 0}
  #lock-countdown{display:none;margin-top:8px;padding:8px 12px;font-size:13px;
                  border-radius:6px;border:1px solid rgba(232,99,90,.5);
                  background:rgba(232,99,90,.08);color:var(--dang);
                  font-family:var(--mono)}                 /* mono 数字 */
  #lock-countdown.on{display:block}
  /* 空态（首次）：从启动日志取口令提示 */
  #st-empty{margin-top:12px;padding:12px;border:1px dashed var(--g5);
            border-radius:6px;color:var(--g8);font-size:12px;line-height:1.8}
  #st-empty b{color:var(--ga);font-weight:500}
  #st-empty .mono{font-family:var(--mono);color:var(--ga)}
  .login-card .foot{color:var(--g8);font-size:12px;margin:16px 0 0;line-height:1.7}
  .login-card .foot .sep{color:var(--g6);margin:0 8px}
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-row">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none"
         stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M8 1.2 14 3.6v4.2c0 3.4-2.5 5.8-6 7-3.5-1.2-6-3.6-6-7V3.6Z"></path>
      <circle cx="8" cy="7.4" r="2.2"></circle>
      <path d="M6.4 7.4c.9.9 2.3.9 3.2 0"></path>
    </svg>
    <h1>GraphLed</h1>
  </div>
  <p class="sub">授权渗透测试的观察与驾驶舱：只看授权范围内的事，每一步留痕。</p>
  <label for="op-password">操作员口令</label>
  <div class="pw-wrap">
    <input id="op-password" type="password" autocomplete="current-password"
           placeholder="输入操作员口令">
    <button id="op-peek" type="button" aria-label="显示或隐藏口令" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"></path>
        <circle cx="8" cy="8" r="2"></circle>
      </svg>
    </button>
  </div>
  <div id="lock-countdown" role="status" aria-live="polite"></div>
  <p id="op-msg" role="alert"></p>
  <button id="op-login" type="button"><span class="spin"></span>登录</button>
  <div id="st-empty">
    <b>首次使用？</b>操作员口令在服务启动日志里——启动横幅会打印一次；
    设 <span class="mono">TANYIN_OPERATOR_KEY</span> 可固定口令。
  </div>
  <footer class="foot">GraphLed · 本系统仅用于已授权的安全测试<span class="sep">·</span>口令错 5 次锁定 60 秒，登录会话仅本浏览器有效。</footer>
</div>
<script>
"use strict";
/* T6·P1：四态登录页。空=启动日志提示（输入即收起）；加载=按钮转圈；
   错误=红字+输入框红（不计细节）；正常=跳总览 /console；
   429 retry_after_s → 实时倒计时。POST /login 窄门口径不变。 */
var peek = document.getElementById("op-peek");
peek.addEventListener("click", function () {
  var inp = document.getElementById("op-password");
  var show = inp.type === "password";
  inp.type = show ? "text" : "password";
  peek.setAttribute("aria-pressed", show ? "true" : "false");
});

var pwInput = document.getElementById("op-password");
pwInput.addEventListener("input", function () {
  pwInput.classList.remove("err");
  var hint = document.getElementById("st-empty");
  if (pwInput.value && hint) { hint.style.display = "none"; }  /* 空态收起 */
});
pwInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { document.getElementById("op-login").click(); }
});

var lockTimer = null;
function startLockdown(seconds) {
  var box = document.getElementById("lock-countdown");
  var btn = document.getElementById("op-login");
  var left = Math.max(1, Math.ceil(Number(seconds) || 0));
  btn.disabled = true;
  btn.classList.remove("loading");
  box.classList.add("on");
  function tick() {
    if (left > 0) {
      box.textContent = "已锁定，请 " + left + " 秒后重试";
      left -= 1;
    } else {
      clearInterval(lockTimer);
      lockTimer = null;
      box.classList.remove("on");
      box.textContent = "";
      btn.disabled = false;
      document.getElementById("op-msg").textContent = "锁定解除，可再试。";
    }
  }
  if (lockTimer) { clearInterval(lockTimer); }
  tick();
  lockTimer = setInterval(tick, 1000);
}

document.getElementById("op-login").addEventListener("click", function () {
  var msg = document.getElementById("op-msg");
  var btn = this;
  btn.disabled = true;
  btn.classList.add("loading");                     /* 加载态=转圈 */
  msg.textContent = "";
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: JSON.stringify({ password: pwInput.value })
  }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (out) {
      btn.classList.remove("loading");
      if (out.s === 200 && out.j.ok) {
        window.location.href = "/console";          /* 正常态=总览 */
        return;
      }
      if (out.s === 429) {
        startLockdown(out.j.retry_after_s);         /* 429 → 锁定倒计时 */
        msg.textContent = out.j.error || "口令错误次数过多";
        return;
      }
      btn.disabled = false;
      pwInput.classList.add("err");                 /* 错误态=输入框红 */
      pwInput.focus();
      msg.textContent = out.j.error || ("登录失败（HTTP " + out.s + "）");
    })
    .catch(function (e) {
      btn.classList.remove("loading");
      btn.disabled = false;
      msg.textContent = "网络错误：" + String(e);
    });
});
</script>
</body>
</html>
