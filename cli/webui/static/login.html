<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探隐 · 操作员登录</title>
<style>
  /* craft-v09d 皮肤同源（极简登录页：色值只落令牌区，规则区一律 var()） */
  :root { --g1:#ffffff; --g2:#f6f8fb; --g4:#e3e9f2; --g5:#d9e1ec;
          --g9:#5c6b80; --g12:#182230; --radius:8px;
          --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,
                       "Helvetica Neue",Arial,sans-serif;
          --bg:var(--g2); --card:var(--g1); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#2563EB; --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 8%, var(--card));
          --bad:#d92d20; }
  html[data-theme="dark"] { --g1:#182230; --g2:#2e3949; --g4:#5c6b80;
          --g5:#8593a8; --g9:#e3e9f2; --g12:#ffffff;
          --bg:var(--g1); --card:var(--g2); --ink:var(--g12); --dim:var(--g6);
          --line:var(--g4); --accent:color-mix(in srgb, #2563EB 55%, var(--g12));
          --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 12%, var(--card));
          --bad:#ff7a70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:var(--font-sans); font-size:15px; line-height:1.6;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .login-card { background:var(--card); border:1px solid var(--line);
                border-radius:var(--radius); padding:32px; width:min(360px, 92vw);
                box-shadow:0 4px 12px color-mix(in srgb, var(--g12) 12%, transparent); }
  .login-card h1 { font-size:20px; margin:0 0 4px; letter-spacing:1px; }
  .login-card .sub { color:var(--dim); font-size:12px; margin:0 0 20px; }
  .login-card label { display:block; font-size:12px; color:var(--dim);
                      margin:0 0 6px; letter-spacing:1px; }
  .login-card input { width:100%; font:inherit; padding:8px 12px;
                      border:1px solid var(--line); border-radius:var(--radius);
                      background:var(--card); color:var(--ink); }
  .login-card input:focus-visible { outline:2px solid var(--accent);
                                    outline-offset:2px; }
  .login-card button { margin-top:16px; width:100%; font:inherit; font-weight:600;
                       padding:8px 16px; border:none; border-radius:var(--radius);
                       background:var(--accent); color:var(--accent-ink);
                       cursor:pointer; }
  #op-msg { min-height:20px; margin:12px 0 0; font-size:12px; color:var(--bad); }
  .login-card .back { display:block; margin-top:16px; font-size:12px;
                      color:var(--dim); }
</style>
</head>
<body>
<main class="login-card">
  <h1>探隐 · 操作员登录</h1>
  <p class="sub">只读页面无需登录；下达指令、审批与开战须操作员身份。</p>
  <form id="op-form">
    <label for="op-password">操作员口令</label>
    <input id="op-password" type="password" autocomplete="current-password"
           placeholder="口令见服务启动横幅（TANYIN_OPERATOR_KEY 可固定）" required>
    <button id="op-login" type="submit">登录</button>
    <p id="op-msg" role="status"></p>
  </form>
  <a class="back" href="/">← 返回总览（只读）</a>
</main>
<script>
"use strict";
/* v0.9.8 方向盘：登录（POST /login，JSON+自定义头；会话 cookie HttpOnly）。
   成功即去新建任务页；锁定/口令不符如实显示服务端错误文本。 */
document.getElementById("op-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var msg = document.getElementById("op-msg");
  msg.textContent = "";
  fetch("/login", { method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: JSON.stringify({ password: document.getElementById("op-password").value })
  }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (out) {
      if (out.s === 200 && out.j.ok) { window.location.href = "/new"; return; }
      msg.textContent = out.j.error || ("登录失败（HTTP " + out.s + "）");
    })
    .catch(function (e) { msg.textContent = "网络错误：" + String(e); });
});
</script>
</body>
</html>
