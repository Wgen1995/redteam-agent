<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphLed · 操作员登录</title>
<style>
  /* craft-v09d 皮肤同源（操作员登录页：色值只落令牌区，规则区一律 var()）。
     品牌卡=ZhuLong §2.0 登录定位 + multica 登录单卡形态；锁定倒计时=ZhuLong 错5锁15分语义。 */
  :root { --g1:#ffffff; --g2:#f6f8fb; --g4:#e3e9f4; --g5:#d9e1ec;
          --g6:#c6d0df; --g9:#5c6b80; --g12:#182230; --radius:8px;
          --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,
                       "Helvetica Neue",Arial,sans-serif;
          --shadow-2:0 4px 12px color-mix(in srgb, var(--g12) 12%, transparent);
          --bg:var(--g2); --card:var(--g1); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#2563EB; --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 8%, var(--card));
          --bad:#d92d20; }
  html[data-theme="dark"] { --g1:#182230; --g2:#2e3949; --g4:#5c6b80;
          --g5:#8593a8; --g6:#a5b1c4; --g9:#e3e9f2; --g12:#ffffff;
          --shadow-2:0 4px 12px color-mix(in srgb, var(--g1) 55%, transparent);
          --bg:var(--g1); --card:var(--g2); --ink:var(--g12); --dim:var(--g6);
          --line:var(--g4); --accent:color-mix(in srgb, #2563EB 55%, var(--g12));
          --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 12%, var(--card));
          --bad:#ff7a70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:var(--font-sans); font-size:15px; line-height:1.6;
         display:flex; min-height:100vh; align-items:center; justify-content:center;
         padding:24px; }
  .login-card { background:var(--card); border:1px solid var(--line);
                border-radius:var(--radius); padding:32px; width:min(360px, 92vw);
                box-shadow:var(--shadow-2); }
  .brand-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .brand-row svg { flex:none; color:var(--accent); }
  .login-card h1 { font-size:20px; margin:0; letter-spacing:1px; }
  .login-card .sub { color:var(--dim); font-size:12px; margin:0 0 20px; }
  .login-card label { display:block; font-size:12px; color:var(--dim);
                      margin:0 0 8px; letter-spacing:1px; }
  .pw-wrap { position:relative; }
  .pw-wrap input { width:100%; font:inherit; padding:8px 48px 8px 12px;
                   border:1px solid var(--line); border-radius:var(--radius);
                   background:var(--card); color:var(--ink); }
  .pw-wrap input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pw-wrap button { position:absolute; top:0; right:0; height:100%;
                    padding:0 12px; border:none; background:none;
                    color:var(--dim); cursor:pointer; display:inline-flex;
                    align-items:center; }
  .pw-wrap button:hover { color:var(--accent); }
  #op-login { width:100%; font:inherit; font-weight:600; margin-top:16px;
              padding:8px 12px; border:none; border-radius:var(--radius);
              background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  #op-login:disabled { opacity:.6; cursor:not-allowed; }
  #op-msg { color:var(--bad); font-size:12px; min-height:20px; margin:8px 0 0; }
  #lock-countdown { display:none; margin-top:8px; padding:8px 12px;
                    font-size:13px; border-radius:var(--radius);
                    border:1px solid var(--bad);
                    background:color-mix(in srgb, var(--bad) 8%, var(--card));
                    color:var(--bad); }
  #lock-countdown.on { display:block; }
  .login-card .foot { color:var(--dim); font-size:12px; margin:16px 0 0; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-row">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none"
         stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M8 1.2 14 3.6v4.2c0 3.4-2.5 5.8-6 7-3.5-1.2-6-3.6-6-7V3.6Z"></path>
      <circle cx="8" cy="7.4" r="2.2"></circle>
      <path d="M6.4 7.4c.9.9 2.3.9 3.2 0"></path>
    </svg>
    <h1>GraphLed</h1>
  </div>
  <p class="sub">授权渗透测试的观察与驾驶舱：只看授权范围内的事，每一步留痕。</p>
  <label for="op-password">操作员口令</label>
  <div class="pw-wrap">
    <input id="op-password" type="password" autocomplete="current-password"
           placeholder="输入操作员口令">
    <button id="op-peek" type="button" aria-label="显示或隐藏口令" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"></path>
        <circle cx="8" cy="8" r="2"></circle>
      </svg>
    </button>
  </div>
  <div id="lock-countdown" role="status" aria-live="polite"></div>
  <p id="op-msg" role="alert"></p>
  <button id="op-login" type="button">登录</button>
  <footer class="foot">GraphLed · 口令错 5 次锁定 60 秒；登录会话仅本浏览器有效。</footer>
</div>
<script>
"use strict";
/* v0.9.8 方向盘·二：登录页（POST /login 窄门口径不变；429 retry_after_s → 实时倒计时）。 */
var peek = document.getElementById("op-peek");
peek.addEventListener("click", function () {
  var inp = document.getElementById("op-password");
  var show = inp.type === "password";
  inp.type = show ? "text" : "password";
  peek.setAttribute("aria-pressed", show ? "true" : "false");
});

var lockTimer = null;
function startLockdown(seconds) {
  var box = document.getElementById("lock-countdown");
  var btn = document.getElementById("op-login");
  var left = Math.max(1, Math.ceil(Number(seconds) || 0));
  btn.disabled = true;
  box.classList.add("on");
  function tick() {
    if (left > 0) {
      box.textContent = "已锁定，请 " + left + " 秒后重试";
      left -= 1;
    } else {
      clearInterval(lockTimer);
      lockTimer = null;
      box.classList.remove("on");
      box.textContent = "";
      btn.disabled = false;
      document.getElementById("op-msg").textContent = "锁定解除，可再试。";
    }
  }
  if (lockTimer) { clearInterval(lockTimer); }
  tick();
  lockTimer = setInterval(tick, 1000);
}

document.getElementById("op-login").addEventListener("click", function () {
  var msg = document.getElementById("op-msg");
  var btn = this;
  btn.disabled = true;
  msg.textContent = "";
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: JSON.stringify({ password: document.getElementById("op-password").value })
  }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (out) {
      if (out.s === 200 && out.j.ok) { window.location.href = "/new"; return; }
      if (out.s === 429) {
        startLockdown(out.j.retry_after_s);     /* 429 → 锁定倒计时 */
        msg.textContent = out.j.error || "口令错误次数过多";
        return;
      }
      btn.disabled = false;
      msg.textContent = out.j.error || ("登录失败（HTTP " + out.s + "）");
    })
    .catch(function (e) {
      btn.disabled = false;
      msg.textContent = "网络错误：" + String(e);
    });
});
</script>
</body>
</html>
