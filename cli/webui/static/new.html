<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探隐 · 新建任务</title>
<style>
  /* craft-v09d 皮肤同源（操作员表单页：色值只落令牌区，规则区一律 var()） */
  :root { --g1:#ffffff; --g2:#f6f8fb; --g4:#e3e9f4; --g5:#d9e1ec;
          --g6:#c6d0df; --g9:#5c6b80; --g12:#182230; --radius:8px;
          --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,
                       "Helvetica Neue",Arial,sans-serif;
          --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
          --bg:var(--g2); --card:var(--g1); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#2563EB; --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 8%, var(--card));
          --ok:#157347; --bad:#d92d20; }
  html[data-theme="dark"] { --g1:#182230; --g2:#2e3949; --g4:#5c6b80;
          --g5:#8593a8; --g6:#c6d0df; --g9:#e3e9f2; --g12:#ffffff;
          --bg:var(--g1); --card:var(--g2); --ink:var(--g12); --dim:var(--g6);
          --line:var(--g4); --accent:color-mix(in srgb, #2563EB 55%, var(--g12));
          --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 12%, var(--card));
          --ok:color-mix(in srgb, #157347 55%, var(--g12)); --bad:#ff7a70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:var(--font-sans); font-size:15px; line-height:1.6; }
  header { background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 24px; display:flex; align-items:baseline; gap:16px;
           flex-wrap:wrap; }
  header h1 { font-size:24px; margin:0; letter-spacing:1px; }
  header .sub { color:var(--dim); font-size:12px; flex-basis:100%; margin:0; }
  header a { margin-left:auto; font-size:12px; }
  main { max-width:720px; margin:0 auto; padding:20px 24px; }
  section { background:var(--card); border:1px solid var(--line);
            border-radius:var(--radius); padding:16px; }
  section h2 { font-size:13px; margin:0 0 12px; color:var(--dim);
               font-weight:600; letter-spacing:1px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; color:var(--dim);
                 margin-bottom:8px; letter-spacing:1px; }
  .field input, .field textarea { width:100%; font:inherit; padding:8px 12px;
                                  border:1px solid var(--line);
                                  border-radius:var(--radius);
                                  background:var(--card); color:var(--ink); }
  .field textarea { font-family:var(--font-mono); font-size:13px; min-height:96px;
                    resize:vertical; }
  .field input:focus-visible, .field textarea:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  .field .hint { font-size:12px; color:var(--dim); margin:4px 0 0; }
  #f-submit { font:inherit; font-weight:600; padding:8px 24px; border:none;
              border-radius:var(--radius); background:var(--accent);
              color:var(--accent-ink); cursor:pointer; }
  #f-submit:disabled { opacity:.6; cursor:wait; }
  #new-result { margin-top:16px; padding:12px; border-radius:var(--radius);
                font-size:13px; display:none; }
  #new-result.ok { display:block; background:var(--soft); color:var(--ink); }
  #new-result.bad { display:block; background:color-mix(in srgb, var(--bad) 8%, var(--card));
                    color:var(--bad); }
  #new-result code { font-family:var(--font-mono); }
  footer { color:var(--dim); font-size:12px; padding:8px 24px 16px;
           max-width:720px; margin:0 auto; }
</style>
</head>
<body>
<header>
  <h1>新建任务</h1>
  <p class="sub">填写任务书并开战。范围白名单必填——没有范围不开战；全部提交经登录校验并逐条留痕。</p>
  <a href="/">返回总览</a>
</header>
<main>
  <section>
    <h2>任务书 · 开战表单</h2>
    <form id="new-form">
      <div class="field">
        <label for="f-name">任务名称（目标）</label>
        <input id="f-name" type="text" maxlength="120" required
               placeholder="如：汽配外网一期">
      </div>
      <div class="field">
        <label for="f-scope">范围白名单（每行一条：域名后缀或网段）</label>
        <textarea id="f-scope" required
                  placeholder="*.example.com&#10;10.0.0.0/24"></textarea>
        <p class="hint">留空或没有有效行=拒绝提交（无范围的测试一律不开）。</p>
      </div>
      <div class="field">
        <label for="f-budget">预算硬顶（token;requests;hours 三段）</label>
        <input id="f-budget" type="text" required
               placeholder="2000000;50000;40">
        <p class="hint">三段整数，分号隔开：令牌数;请求数;小时数。</p>
      </div>
      <div class="field">
        <label for="f-note">说明（测试目的，可空）</label>
        <textarea id="f-note" maxlength="500"
                  placeholder="一句话说明本战目的与背景"></textarea>
      </div>
      <button id="f-submit" type="submit">开战</button>
    </form>
    <div id="new-result" role="status"></div>
  </section>
</main>
<footer>探隐 v0.9.8 · 本页提交写操作，全部经登录校验并逐条留痕</footer>
<script>
"use strict";
/* v0.9.8 方向盘：开战表单（POST /api/battle/new——窄门：JSON+自定义头+会话）。
   回执渲染=任务号+立项编号+逐条留痕行号；401 跳登录；422 如实展示拒因。 */
document.getElementById("new-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var out = document.getElementById("new-result");
  out.className = "";
  out.textContent = "";
  var scope = document.getElementById("f-scope").value
    .split("\n").map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });
  var payload = {
    name: document.getElementById("f-name").value.trim(),
    scope: scope,
    budget: document.getElementById("f-budget").value.trim(),
    note: document.getElementById("f-note").value.trim()
  };
  var btn = document.getElementById("f-submit");
  btn.disabled = true;
  fetch("/api/battle/new", { method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: JSON.stringify(payload)
  }).then(function (r) {
    if (r.status === 401) { window.location.href = "/login"; return null; }
    return r.json().then(function (j) { return { s: r.status, j: j }; });
  }).then(function (res) {
    btn.disabled = false;
    if (!res) { return; }
    var j = res.j || {};
    if (res.s === 200 && j.ok) {
      var rows = (j.ledger || []).map(function (x) {
        return x.cmd + " 行" + x.timeline_row;
      }).join(" · ");
      out.className = "ok";
      out.textContent = "已创建任务 battle-" + j.battle +
        "（立项 " + j.goal_id + "；留痕：" + rows + "）";
      return;
    }
    out.className = "bad";
    out.textContent = "被拒（HTTP " + res.s + "）：" + (j.error || "未知原因");
  }).catch(function (e) {
    btn.disabled = false;
    out.className = "bad";
    out.textContent = "网络错误：" + String(e);
  });
});
</script>
</body>
</html>
