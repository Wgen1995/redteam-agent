<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱 · GraphLed</title>
<!-- 驾驶舱首页（功能27）·设计唯一正文 docs/design/2026-10-20-cockpit-ui-blueprint.md
     五秒三问（宪法63律——这页五秒能答的三问）：
       ① 打出什么漏洞了？→ 问一「验真漏洞榜」（只有机器复放验真+在册的才上榜，
         每枚带 多严重/在哪/几件证据/详情链接）；
       ② 正在打什么、有没有事等我？→ 问二「活池」（在途任务+最近动态）+
         问三「等我拍板」（待审批+求助，按等久了排，同类聚合一票）；
       ③ 花了多少钱、还剩多少？→ 问四「消费」（token/请求/小时 三条余量条，
         对 goals 帽三段，80% 预警线）。
     词表律（宪法62）：屏上只说人话——漏洞/任务/士兵/钥匙/目标/证据。
     数据单源 /api/v2/cockpit.json（api_v2_cockpit 只读投影，账本真件，
     零假数；空状态按蓝图说人话，不放空表）。视觉基准 12 级灰阶+单强调色。 -->
<style>
:root{--g0:#0a0b0d;--g1:#101216;--g2:#16181d;--g3:#1d2026;--g4:#252930;--g5:#2e333b;
--g6:#3a4049;--g7:#4c535e;--g8:#6b7480;--g9:#8b949f;--ga:#aab3bd;--gb:#ccd3da;--gc:#e8edf2;
--acc:#3ddc97;--acc2:#2fae78;--warn:#e8b34b;--dang:#e8635a;--info:#5aa9e6;
--mono:"SF Mono",Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--g0);color:var(--gb);
font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
min-height:100vh}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
#top{height:46px;background:var(--g1);border-bottom:1px solid var(--g3);
display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:5}
#top .brand{color:var(--gc);font-size:14px;font-weight:600;letter-spacing:.5px}
#top .brand i{font-style:normal;color:var(--acc)}
#top .bt{color:var(--g8);font-size:12px}
#top .sp{flex:1}
#top .lnk{color:var(--g9);font-size:12px}
.state{display:none}
.state.on{display:block}
#st-error .wrap{max-width:640px;margin:10vh auto 0;text-align:center}
#st-error .box{background:var(--g2);border:1px solid rgba(232,99,90,.45);
border-radius:8px;padding:30px}
#st-error h3{color:var(--dang);font-size:15px;margin-bottom:8px}
#st-error p{color:var(--g8);font-size:12.5px}
.sk{max-width:1000px;margin:16px auto;padding:0 20px}
.sk .ln{height:52px;border-radius:8px;background:var(--g3);margin-bottom:12px;
animation:sh 1.2s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.45}50%{opacity:1}}
#main{max-width:1080px;margin:0 auto;padding:18px 20px 70px}
.qhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.qhead h2{font-size:16px;color:var(--gc);font-weight:600}
.qhead h2 b{color:var(--acc);font-weight:600;font-size:13px}
.qhead .sub{color:var(--g8);font-size:12px}
.qhead .sp{flex:1}
.qhead .more{font-size:12px}
.pane{background:var(--g2);border:1px solid var(--g4);border-radius:8px;padding:14px 16px}
.empty{color:var(--g8);font-size:13px;line-height:1.9;padding:8px 2px}
.empty a{color:var(--info)}
/* 问一 榜 */
.vrow{display:flex;align-items:center}
.vrow:last-child{border-bottom:none}
.vrow a.whole{color:inherit;display:flex;gap:10px;align-items:center;
width:100%;text-decoration:none;padding:9px 4px;border-bottom:1px solid var(--g3)}
.vrow:last-child a.whole{border-bottom:none}
.vrow a.whole:hover .ti{color:var(--acc)}
.sev{flex-shrink:0;width:30px;text-align:center;border-radius:4px;
font-size:12px;font-weight:600;padding:2px 0}
.sev.h{background:rgba(232,99,90,.16);color:var(--dang)}
.sev.m{background:rgba(232,179,75,.16);color:var(--warn)}
.sev.l{background:rgba(90,169,230,.14);color:var(--info)}
.vrow .t{flex:1;min-width:0}
.vrow .t .ti{color:var(--gc);font-size:13px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.vrow .t .wh{color:var(--g8);font-size:11.5px;font-family:var(--mono);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .ev{flex-shrink:0;color:var(--g9);font-size:11px;
border:1px solid var(--g5);border-radius:3px;padding:1px 6px}
.vrow .go{flex-shrink:0;color:var(--g7);font-size:13px}
/* 问二 活池 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.irow{display:flex;gap:8px;align-items:center;padding:7px 4px;
border-bottom:1px solid var(--g3);font-size:12.5px}
.irow:last-child{border-bottom:none}
.irow .st{flex-shrink:0;font-size:11px;border-radius:3px;padding:1px 7px;
background:var(--g4);color:var(--g9)}
.irow .tt{flex:1;color:var(--gb);overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
.tl .r{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--g3)}
.tl .r:last-child{border-bottom:none}
.tl .ts{flex-shrink:0;color:var(--g8);font-family:var(--mono);font-size:11px;
width:146px}
.tl .tx{color:var(--gb);font-size:12px}
/* 问三 等我 */
.wrow{display:flex;gap:10px;align-items:center;padding:9px 4px;
border-bottom:1px solid var(--g3);font-size:12.5px}
.wrow:last-child{border-bottom:none}
.wrow .kind{flex-shrink:0;width:52px;text-align:center;font-size:11px;
border-radius:3px;padding:2px 0}
.wrow .kind.ap{background:rgba(232,179,75,.16);color:var(--warn)}
.wrow .kind.ask{background:rgba(90,169,230,.16);color:var(--info)}
.wrow .bd{flex:1;min-width:0;color:var(--gc);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.wrow .bd small{color:var(--g8);font-family:var(--mono);font-size:11px}
/* 问四 消费 */
.brow{padding:10px 4px;border-bottom:1px solid var(--g3)}
.brow:last-child{border-bottom:none}
.brow .cap{display:flex;justify-content:space-between;font-size:12px;
margin-bottom:6px}
.brow .cap .n{color:var(--gb)}
.brow .cap .v{color:var(--g8);font-family:var(--mono);font-size:11.5px}
.bar{position:relative;height:10px;background:var(--g3);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--acc);border-radius:5px}
.bar .fill.warn{background:var(--warn)}
.bar .fill.over{background:var(--dang)}
.bar .line{position:absolute;top:-2px;bottom:-2px;width:2px;
background:var(--warn);opacity:.8}
.brow .pct{color:var(--g8);font-size:11px;margin-top:5px;font-family:var(--mono)}
#foot{max-width:1080px;margin:8px auto 40px;padding:0 20px;color:var(--g8);
font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#foot a{color:var(--g9)}
</style>
</head>
<body>
<div id="top">
  <span class="brand">Graph<i>Led</i> 驾驶舱</span>
  <span class="bt mono" id="bt-name"></span>
  <span class="sp"></span>
  <a class="lnk" href="/p/mission">任务页</a>
  <a class="lnk" href="/p/inbox">收件箱</a>
</div>
<div id="st-loading" class="state on"><div class="sk">
  <div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div>
</div></div>
<div id="st-error" class="state"><div class="wrap"><div class="box">
  <h3>驾驶舱数据没取到</h3><p id="err-detail" class="mono"></p>
  <p><a href="/">刷新重试</a> · 数据来自账本真件，不造假数。</p>
</div></div></div>
<div id="st-normal" class="state"><div id="main">

  <div class="qhead" id="q1"><h2>① 打出什么漏洞了？ <b id="q1-n"></b></h2>
    <span class="sub">只有机器复放验真、仍在册的才上榜</span>
    <span class="sp"></span><a class="more" href="/p/findings">全部漏洞 →</a></div>
  <div class="pane" id="q1-body"></div>

  <div class="qhead" id="q2"><h2>② 正在打什么？</h2>
    <span class="sub">在途任务与最近动态</span>
    <span class="sp"></span><a class="more" href="/p/mission">任务页 →</a></div>
  <div class="cols">
    <div class="pane" id="q2-intents"></div>
    <div class="pane tl" id="q2-recent"></div>
  </div>

  <div class="qhead" id="q3"><h2>③ 什么在等我？ <b id="q3-n"></b></h2>
    <span class="sub">待审批 · 求助 · 按等久了排</span>
    <span class="sp"></span><a class="more" href="/p/inbox">收件箱 →</a></div>
  <div class="pane" id="q3-body"></div>

  <div class="qhead" id="q4"><h2>④ 花多少钱？</h2>
    <span class="sub">本仗消耗对预算帽的余量（预警线 80%）</span>
    <span class="sp"></span><a class="more" href="/p/settings">预算与范围 →</a></div>
  <div class="pane" id="q4-body"></div>

</div>
<footer id="foot"><!-- GraphLed 驾驶舱深页目录（旧 22 页不删，收进导航「更多」） -->
  <span>GraphLed · 深页目录：</span><a href="/p/tasks">任务列表</a><a href="/p/new-task">新建任务</a>
  <a href="/p/findings">漏洞</a><a href="/p/knowledge">知识库</a>
  <a href="/p/approval-center">审批中心</a><a href="/p/report-center">报告中心</a>
  <a href="/metrics">度量</a><a href="/activity">日志</a>
</footer>
</div>
<script src="/static/app.js"></script>
<script>
"use strict";
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                 '"': "&quot;", "'": "&#39;" }[c];
      });
  }
  function show(id) {
    ["st-loading", "st-error", "st-normal"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }
  function sevCls(imp) { return imp === "高" ? "h" : imp === "中" ? "m" : "l"; }
  function fmtN(n) {                                   // 335000 → 33.5万
    n = Number(n) || 0;
    if (n >= 1e8) { return (n / 1e8).toFixed(2) + "亿"; }
    if (n >= 1e4) { return (n / 1e4).toFixed(1) + "万"; }
    return String(Math.round(n * 100) / 100);
  }
  function qs() { return new URLSearchParams(window.location.search); }
  function battleQS() {
    var b = qs().get("battle");
    return b ? "&battle=" + encodeURIComponent(b) : "";
  }

  function renderQ1(p) {
    var q1 = p.q1_vulns;
    $("q1-n").textContent = q1.total ? "（" + q1.total + " 枚验真在册）" : "";
    if (!q1.total) {
      $("q1-body").innerHTML = '<div class="empty">还没有验真在册的漏洞——' +
        "士兵报上来的每一枚都要机器复放验真才上榜。" +
        '<a href="/p/mission">看正在打什么</a></div>';
      return;
    }
    var h = q1.top.map(function (v) {
      return '<div class="vrow"><a class="whole" href="' + esc(v.detail_url) +
        battleQS() + '"><span class="sev ' + sevCls(v.impact) + '">' +
        esc(v.impact) + "</span>" +
        '<span class="t"><span class="ti">' + esc(v.title) + "</span>" +
        '<span class="wh">' + esc(v.where) + "</span></span>" +
        '<span class="ev">证据 ' + v.evidence.length + " 件</span>" +
        '<span class="go">›</span></a></div>';
    }).join("");
    if (q1.total > q1.top.length) {
      h += '<div class="empty" style="text-align:center">还有 ' +
        (q1.total - q1.top.length) + ' 枚——<a href="/p/findings">看全部</a></div>';
    }
    $("q1-body").innerHTML = h;
  }

  function renderQ2(p) {
    var q2 = p.q2_live;
    if (!q2.intents.length) {
      $("q2-intents").innerHTML = '<div class="empty">活池是空的——还没派活。' +
        '<a href="/p/new-task">说「打 xxx」开第一仗</a></div>';
    } else {
      $("q2-intents").innerHTML = q2.intents.map(function (it) {
        return '<div class="irow"><span class="st">' + esc(it.status_zh) +
          '</span><span class="tt" title="' + esc(it.id + " " + it.title) +
          '">' + esc(it.title) + "</span></div>";
      }).join("");
    }
    if (!q2.recent.length) {
      $("q2-recent").innerHTML = '<div class="empty">还没有动态——开仗后每一步都进战账。</div>';
    } else {
      $("q2-recent").innerHTML = q2.recent.map(function (r) {
        return '<div class="r"><span class="ts">' + esc(r.ts) + "</span>" +
          '<span class="tx">' + esc(r.text) + "</span></div>";
      }).join("");
    }
  }

  function renderQ3(p) {
    var q3 = p.q3_waiting, rows = [];
    $("q3-n").textContent = (q3.counts.pending_approvals + q3.counts.asks)
      ? "（" + q3.counts.pending_approvals + " 待审批 · " +
        q3.counts.asks + " 求助）" : "";
    q3.pending_approvals.forEach(function (a) {
      rows.push('<div class="wrow"><span class="kind ap">待审批</span>' +
        '<span class="bd">' + esc(a.event) + " <small>" + esc(a.battle) +
        " 第" + a.row + "行 · " + esc(a.ts) + "</small></span>" +
        '<a href="/p/inbox">去审 →</a></div>');
    });
    q3.asks.forEach(function (a) {
      rows.push('<div class="wrow"><span class="kind ask">求助</span>' +
        '<span class="bd">' + esc(a.question) + " <small>" + esc(a.battle) +
        '</small></span><a href="/p/inbox">去看 →</a></div>');
    });
    if (!rows.length) {
      $("q3-body").innerHTML =
        '<div class="empty">没有等你拍板的事——士兵各就各位，有事会来敲收件箱。</div>';
      return;
    }
    $("q3-body").innerHTML = rows.join("");
  }

  function renderQ4(p) {
    var q4 = p.q4_budget, g = q4.goal;
    var names = { tokens: "token", requests: "请求次数", hours: "时长（小时）" };
    var hasCap = q4.cap.tokens > 0 || q4.cap.requests > 0 || q4.cap.hours > 0;
    var h = "";
    if (g.target) {
      h += '<div class="empty" style="padding-top:2px">本仗：<b style="color:var(--gc)">' +
        esc(g.target) + "</b> · " + esc(g.objective || "") +
        (q4.rows_n ? " · 已记 " + q4.rows_n + " 笔消耗" : "") + "</div>";
    }
    if (!q4.rows_n && !hasCap) {
      h += '<div class="empty">还没花过钱——开仗后这里按笔记账，对着预算帽给余量条。</div>';
      $("q4-body").innerHTML = h;
      return;
    }
    ["tokens", "requests", "hours"].forEach(function (k) {
      var cap = q4.cap[k], used = q4.used[k], pct = q4.pct[k];
      var fill = Math.min(100, pct || 0);
      var cls = q4.over[k] ? "over" : (pct >= q4.warn_pct ? "warn" : "");
      h += '<div class="brow"><div class="cap"><span class="n">' + names[k] +
        '</span><span class="v">' + fmtN(used) + " / " +
        (cap > 0 ? fmtN(cap) : "未设帽") + "</span></div>" +
        '<div class="bar">' + (cap > 0
          ? '<div class="fill ' + cls + '" style="width:' + fill + '%"></div>' +
            '<div class="line" style="left:' + q4.warn_pct + '%"></div>'
          : "") + "</div>" +
        '<div class="pct">' + (cap > 0
          ? "已用 " + pct + "% · 余 " + Math.max(0, 100 - pct) + "%" +
            (q4.over[k] ? " · 已超帽！" : "")
          : "未设帽（按授权窗口自律）") + "</div></div>";
    });
    if (q4.used.usd) {
      h += '<div class="pct" style="padding:6px 4px">折合美元 ' +
        q4.used.usd + " 元</div>";
    }
    $("q4-body").innerHTML = h;
  }

  function render(p) {
    $("bt-name").textContent = (p.battle && p.battle.id) ? p.battle.id : "";
    renderQ1(p); renderQ2(p); renderQ3(p); renderQ4(p);
    show("st-normal");
  }

  var b = qs().get("battle");
  fetch("/api/v2/cockpit.json" + (b ? "?battle=" + encodeURIComponent(b) : ""),
        { headers: { "X-Requested-With": "cockpit" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      $("err-detail").textContent = String(e && e.message ? e.message : e);
      show("st-error");
    });
})();
</script>
</body>
</html>
