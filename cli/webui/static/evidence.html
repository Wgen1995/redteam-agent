<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphLed 观察面 · 发现</title>
<style>
  /* ── craft-v09d 皮肤单源（七页同文）：色值只落令牌区，规则区一律 var() ──
     灰阶 12 级单坡双主题镜像：浅 g1 最浅→g12 最深，深主题同名反向；
     品牌蓝 #2563EB；语义三元深主题 color-mix 混白提亮（warn 用亮琥珀字面量）；
     正文=系统无衬线栈（含 PingFang SC），等宽只给数据块（--font-mono）；
     阴影三档 --shadow-1 卡 / --shadow-2 浮层 / --shadow-3 弹窗；
     间距 4px 网格（4/8/12/16/20/24/32/48）；字号五档 12/13/15/20/24。 */
  :root { --g1:#ffffff; --g2:#f6f8fb; --g3:#eef2f7; --g4:#e3e9f2;
          --g5:#d9e1ec; --g6:#c6d0df; --g7:#a5b1c4; --g8:#8593a8;
          --g9:#5c6b80; --g10:#46536a; --g11:#2e3949; --g12:#182230;
          --radius:8px;
          --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
          --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
          --shadow-1:0 1px 2px color-mix(in srgb, var(--g12) 6%, transparent);
          --shadow-2:0 4px 12px color-mix(in srgb, var(--g12) 12%, transparent);
          --shadow-3:0 12px 32px color-mix(in srgb, var(--g12) 20%, transparent);
          --bg:var(--g2); --card:var(--g1); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#2563EB; --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 8%, var(--card));
          --ok:#157347; --bad:#d92d20; --warn:#b54708;
          --idle:var(--g8); --skeleton:var(--g4); }
  html[data-theme="dark"] { --g1:#182230; --g2:#2e3949; --g3:#46536a;
          --g4:#5c6b80; --g5:#8593a8; --g6:#a5b1c4; --g7:#c6d0df;
          --g8:#d9e1ec; --g9:#e3e9f2; --g10:#eef2f7; --g11:#f6f8fb;
          --g12:#ffffff;
          --radius:8px;
          --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
          --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
          --shadow-1:0 1px 2px color-mix(in srgb, var(--g1) 45%, transparent);
          --shadow-2:0 4px 12px color-mix(in srgb, var(--g1) 55%, transparent);
          --shadow-3:0 12px 32px color-mix(in srgb, var(--g1) 65%, transparent);
          --bg:var(--g1); --card:var(--g2); --ink:var(--g12); --dim:var(--g6);
          --line:var(--g4); --accent:color-mix(in srgb, #2563EB 55%, var(--g12));
          --accent-ink:var(--g1);
          --soft:color-mix(in srgb, var(--accent) 12%, var(--card));
          --ok:color-mix(in srgb, #157347 55%, var(--g12));
          --bad:#ff7a70;
          --warn:#f0b429;
          --idle:var(--g5); --skeleton:var(--g4); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:var(--font-sans); font-size:15px; line-height:1.6;
         font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* 侧栏骨架（ui-design-v1 冻结）：左三分组 看战况/看战果/管战场
     + 顶栏（任务切换/主题）+ 窄屏 checkbox 折叠（纯 display 切换，零动效） */
  .side-check { display:none; }
  #shell { display:grid; grid-template-columns:190px 1fr; min-height:100vh; }
  #side { padding:16px 8px; border-right:1px solid var(--line);
          background:var(--card); }
  #side .brand { font-size:15px; font-weight:600; letter-spacing:2px;
                 padding:4px 12px 12px; }
  .nav-group { margin-bottom:16px; }
  .nav-group h3 { font-size:12px; color:var(--dim); font-weight:600;
                  letter-spacing:2px; margin:0 0 4px; padding:0 12px; }
  #side nav a { display:block; padding:8px 12px; font-size:13px;
                color:var(--dim); text-decoration:none; white-space:nowrap;
                border-radius:var(--radius); }
  #side nav a:hover { color:var(--accent); background:var(--soft); }
  #side nav a.here { color:var(--accent); background:var(--soft);
                     font-weight:600; }
  #topbar { position:sticky; top:0; z-index:20; display:flex;
            align-items:baseline; flex-wrap:wrap; gap:8px 16px;
            padding:12px 24px; border-bottom:1px solid var(--line);
            background:var(--card); box-shadow:var(--shadow-2); }
  #topbar h1 { font-size:24px; font-weight:700; margin:0; letter-spacing:1px; }
  .page-sub { flex-basis:100%; margin:0; color:var(--dim); font-size:12px; }
  #battle-switch, #side-toggle, #theme-toggle { font:inherit; font-size:12px; }
  #battle-switch { margin-left:auto; padding:4px 8px;
                   border:1px solid var(--line); border-radius:var(--radius);
                   background:var(--card); color:var(--ink); }
  #side-toggle { display:none; padding:4px 12px; cursor:pointer;
                 border:1px solid var(--line); border-radius:var(--radius);
                 background:var(--card); color:var(--ink); }
  #theme-toggle { padding:4px 12px; cursor:pointer;
                  border:1px solid var(--line); border-radius:var(--radius);
                  background:var(--card); color:var(--ink); }
  #theme-toggle:hover { border-color:var(--accent); color:var(--accent); }
  /* v0.9.8 方向盘·二：报告下载钮（带下载图标；悬停=实底化强调；零动效） */
  #report-dl { display:inline-flex; align-items:center; gap:8px;
               padding:4px 16px; cursor:pointer; font:inherit; font-size:12px;
               font-weight:600; border:1px solid var(--accent);
               border-radius:var(--radius);
               background:var(--card); color:var(--accent); }
  #report-dl svg { flex:none; }
  #report-dl:hover { background:var(--accent); color:var(--accent-ink);
                     border-color:var(--accent); }
  #report-dl:disabled { opacity:.6; cursor:wait; }
  @media (max-width:920px) {
    #shell { grid-template-columns:1fr; }
    #side { display:none; }
    #side-toggle { display:inline-block; }
    .side-check:checked ~ #shell #side { display:block; border-right:none;
                                         border-bottom:1px solid var(--line); }
  }
  main { padding:20px 24px; max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line);
            border-radius:var(--radius); padding:16px; margin-bottom:16px;
            box-shadow:var(--shadow-1); }
  section h2 { font-size:13px; margin:0 0 12px; color:var(--dim);
               font-weight:600; letter-spacing:1px; }
  footer { color:var(--dim); font-size:12px; padding:8px 24px 16px; }
  /* 四态纪律：骨架/加载/空/错误（骨架=静默灰条占位，零动效） */
  .statebox { min-height:24px; }
  .state-msg { display:none; margin:4px 0; font-size:12px; color:var(--dim); }
  .statebox[data-state="loading"] .state-msg { display:block; }
  .statebox[data-state="empty"] .state-msg { display:block; }
  .statebox[data-state="error"] .state-msg { display:block; color:var(--bad); }
  .skeleton { display:none; height:12px; border-radius:calc(var(--radius)/2);
              background:var(--skeleton); margin:8px 0; }
  .statebox[data-state="loading"] .skeleton { display:block; }
  .skeleton.sk-a { width:55%; }
  .skeleton.sk-b { width:85%; }
  .skeleton.sk-c { width:40%; }
  .statebox > .content { display:none; }
  .statebox[data-state="ready"] > .content { display:block; }
  /* 状态语义 tone（status.js 单源 tone → 色变量）；徽章=淡彩底+实色字 */
  .t-ok { color:var(--ok); } .t-bad { color:var(--bad); }
  .t-warn { color:var(--warn); } .t-idle { color:var(--dim); }
  .badge { font-size:12px; padding:4px 8px; white-space:nowrap;
           border-radius:calc(var(--radius)/2);
           background:color-mix(in srgb, currentColor 12%, var(--card)); }
  #sse-state { font-size:12px; color:var(--dim); }
  #sse-state.open { color:var(--ok); }
  /* 页内 */
  #stats .content { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; }
  #stats .num { font-weight:600; }
  #filter-note { display:none; font-size:12px; color:var(--accent);
                 margin:0 0 8px; }
  body.filtered #filter-note { display:block; }
  #cards { display:grid; gap:12px; }
  .card { border:1px solid var(--line); border-radius:var(--radius);
          background:var(--bg); padding:12px; }
  .card.anchored { box-shadow:0 0 0 2px var(--accent);
                   border-color:var(--accent); }
  .card .summary { display:flex; flex-wrap:wrap; gap:8px 16px;
                   align-items:baseline; cursor:pointer; }
  .card .id { font-family:var(--font-mono); color:var(--accent); }
  .card .title { font-weight:600; }
  .card .hash { color:var(--dim); font-size:12px;
                font-family:var(--font-mono); }
  .card .detail { display:none; margin-top:12px; padding-top:12px;
                  border-top:1px dashed var(--line); font-size:12px;
                  color:var(--dim); }
  .card.open .detail { display:block; }
  .detail dl { display:grid; grid-template-columns:132px 1fr;
               gap:4px 12px; margin:0; }
  .detail dt { color:var(--dim); }
  .detail dd { margin:0; word-break:break-all;
               font-family:var(--font-mono); }
  .detail .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  </style>
<script src="/status.js"></script>
</head>
<body>
<input type="checkbox" id="side-check" class="side-check" aria-hidden="true">
<div id="shell">
  <aside id="side">
    <div class="brand">GraphLed</div>
    <nav>
      <div class="nav-group">
        <h3>看战况</h3>
        <a href="/">总览</a><a href="/activity">动态</a><a href="/session">对话</a><a href="/coverage">测试覆盖</a><a href="/graph">攻击路线</a><a class="here" href="/evidence">发现</a>
      </div>
      <div class="nav-group">
        <h3>看战果</h3>
        <a href="/metrics">战报</a><a href="/experiments">实验</a>
      </div>
      <div class="nav-group">
        <h3>管战场</h3>
        <a href="/#settings">设置（占位）</a>
      </div>
    </nav>
  </aside>
  <div id="main-col">
    <header id="topbar">
      <label for="side-check" id="side-toggle">☰ 目录</label>
      <h1>发现</h1>
      <p class="page-sub">你在看什么：每个发现对应的原始证据——命令输出、响应报文、截图，以及独立复测的验证结果。点击卡片展开明细；从总览页点击数字可带筛选跳转至本页。</p>
      <select id="battle-switch" aria-label="切换测试任务（跳到对话页）">
        <option value="">切换任务…</option>
      </select>
      <button id="report-dl" type="button" title="下载当前任务的报告产物（无则触发生成）">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M8 1.5v9"></path>
          <path d="M4.5 7 8 10.5 11.5 7"></path>
          <path d="M2 12.5V14h12v-1.5"></path>
        </svg>
        下载报告</button>
      <button id="theme-toggle" type="button">深色</button>
    </header>
<main>
  <section>
    <h2>复测结果汇总（每条证据有唯一编号）</h2>
    <div id="stats" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"></div>
    </div>
  </section>
  <section>
    <h2>证据列表（点卡片展开明细）</h2>
    <p id="filter-note"></p>
    <div id="cards-box" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <div class="skeleton sk-c"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"><div id="cards"></div></div>
    </div>
  </section>
</main>
<footer>GraphLed v0.9d · 本页数据全部来自战斗记录，只能看不能改</footer>
  </div><!-- /main-col -->
</div><!-- /shell -->
<script>
"use strict";
/* 数据面：/api/evidence.json（证据索引行 + 挂接发现→漏洞编号 + 复测结果 verdict）；
   渲染面：纯 DOM 卡片（复测语义走 status.js 单源），点击 classList 切 open，零框架零 CDN。 */

function el(tag, cls) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  return n;
}
/* 文本一律 textContent 落节点——账本文本不当 HTML 解析（防注入） */

function setBox(box, stateName, msgText) {
  TY.setState(box, stateName);
  var m = box.querySelector(".state-msg");
  if (m && msgText) { m.textContent = msgText; }
}

/* —— 主题切换钮（单源逻辑在 status.js） —— */
/* —— 顶栏任务切换（选项来自 /api/session.json；选中跳对话页） —— */
var battleSwitch = document.getElementById("battle-switch");
if (battleSwitch) {
  fetch("/api/session.json").then(function (r) { return r.json(); })
    .then(function (doc) {
      (doc.battles || []).forEach(function (b) {
        var o = document.createElement("option");
        o.value = String(b.n);
        o.textContent = b.id;
        battleSwitch.appendChild(o);
      });
      if (doc.battle && doc.battle.n) { battleSwitch.value = String(doc.battle.n); }
    }).catch(function () { /* 战例表拉不到：切换器保持占位项 */ });
  battleSwitch.addEventListener("change", function () {
    if (this.value) { window.location.href = "/session?battle=" + this.value; }
  });
}

var themeBtn = document.getElementById("theme-toggle");
TY.syncThemeButton(themeBtn);
themeBtn.addEventListener("click", function () {
  TY.toggleTheme();
  TY.syncThemeButton(themeBtn);
});

/* 复测徽章：标签+tone 全走 TY.REPLAY_STATE 单源（中文一处定义） */
function verdictBadge(v) {
  var sem = TY.REPLAY_STATE[v || ""] || TY.REPLAY_STATE[""];
  var b = el("span", "badge t-" + sem.tone);
  b.textContent = sem.label;
  return b;
}

var FILTERS = { "reproduced": "已复现", "not-reproduced": "未复现",
                "manual": "需人工", "env-diff": "环境差异" };
var activeFilter = null;
var anchored = {};                /* 每发现首张卡铸 id=f-<发现号> 锚点（防重复） */

function renderStats(st) {
  var box = document.getElementById("stats");
  var content = box.querySelector(".content");
  content.textContent = "";
  if (!st.cards) {
    setBox(box, "empty", "暂无证据（无记录）");
    return;
  }
  [["证据总数", st.cards, ""], ["已复现", st.reproduced, "t-ok"],
   ["未复现", st.not_reproduced, "t-bad"],
   ["需人工", st.manual, "t-warn"],
   ["环境差异", st.env_diff, "t-warn"],
   ["未复测", st.unprobed, "t-idle"]]
    .forEach(function (it) {
      var span = el("span");
      var num = el("span", "num " + it[2]);
      num.textContent = it[1];
      span.appendChild(document.createTextNode(it[0] + " "));
      span.appendChild(num);
      content.appendChild(span);
    });
  setBox(box, "ready");
}

function kv(dl, key, val) {
  if (!val) { return; }                    /* 空字段不占行 */
  var dt = el("dt"), dd = el("dd");
  dt.textContent = key;
  dd.textContent = val;
  dd.title = val;
  dl.appendChild(dt); dl.appendChild(dd);
}

function renderCard(c) {
  var card = el("div", "card");
  if (c.linked_finding) {
    card.setAttribute("data-fd", c.linked_finding);
    if (!anchored[c.linked_finding]) {
      anchored[c.linked_finding] = true;
      card.id = "f-" + c.linked_finding;   /* 总览发现流 #f=<发现号> 锚点 */
    }
  }
  var sum = el("div", "summary");
  sum.appendChild(verdictBadge(c.verdict));
  var id = el("span", "id");
  id.textContent = "证据 #" + String(c.id).replace(/^EV-/, "");
  sum.appendChild(id);
  var title = el("span", "title");
  title.textContent = c.title || "（无标题）";
  sum.appendChild(title);
  if (c.vuln_ref) {
    var vr = el("span");
    vr.textContent = "漏洞编号 " + c.vuln_ref;
    sum.appendChild(vr);
  }
  var h = el("span", "hash");
  h.textContent = "数据指纹 " + (c.content_hash_raw || "").slice(0, 12) +
                  " / " + (c.content_hash_norm || "").slice(0, 12);
  h.title = "原始数据指纹 content_hash_raw=" + c.content_hash_raw +
            "  规范化数据指纹 content_hash_norm=" + c.content_hash_norm;
  sum.appendChild(h);
  card.appendChild(sum);

  var detail = el("div", "detail");
  var dl = el("dl");
  kv(dl, "观测时间", c.observed_at);
  kv(dl, "网络位置", c.network_position);
  kv(dl, "来源 / 复测方式", (c.source_type || "?") + " / " + (c.repro_kind || "?"));
  kv(dl, "复测命令", c.repro_command);
  kv(dl, "原始数据指纹", c.content_hash_raw);
  kv(dl, "规范化数据指纹", c.content_hash_norm);
  kv(dl, "产物路径", c.artifact_path);
  kv(dl, "卡片路径", c.card_path);
  kv(dl, "挂接发现", c.linked_finding);
  kv(dl, "配对组", c.pair_group);
  kv(dl, "原文摘录", c.raw_excerpt);
  kv(dl, "记录时间", c.created);
  detail.appendChild(dl);
  var hint = el("div", "hint");
  hint.textContent = "复测结果取自战斗记录中最近一次复测；数据指纹用于校验证据内容是否被改动。";
  detail.appendChild(hint);
  card.appendChild(detail);

  sum.addEventListener("click", function () {
    card.classList.toggle("open");
  });
  return card;
}

function renderCards(cards) {
  var box = document.getElementById("cards-box");
  var holder = document.getElementById("cards");
  holder.textContent = "";
  anchored = {};
  if (!cards.length) {
    setBox(box, "empty", "暂无证据卡——产生发现后将在此展示对应卡片");
    return;
  }
  var shown = 0;
  cards.forEach(function (c) {
    if (activeFilter && (c.verdict || "") !== activeFilter) { return; }
    holder.appendChild(renderCard(c));
    shown += 1;
  });
  if (!shown) {
    setBox(box, "empty", "筛选后没有匹配的卡（" + FILTERS[activeFilter] + "）");
    return;
  }
  setBox(box, "ready");
}

/* —— 筛选联动（#f=reproduced 等复测态：总览点数字跳入）+ 发现锚定
   （#f=<发现号>：总览发现流点条目跳入——高亮该发现的证据卡并滚动到首张） —— */
var anchorFd = null;

function applyAnchor(fid) {
  var hit = null;
  Array.prototype.forEach.call(
    document.querySelectorAll("#cards .card"), function (card) {
      card.classList.remove("anchored");
      if (fid && card.getAttribute("data-fd") === fid) {
        card.classList.add("anchored");
        if (!hit) { hit = card; }
      }
    });
  var note = document.getElementById("filter-note");
  if (fid) {
    document.body.classList.add("filtered");
    note.textContent = "";
    note.appendChild(document.createTextNode(
      "已定位发现 #" + String(fid).replace(/^FD-/, "") +
      " 的证据卡（已高亮并滚动至此） · "));
    var clear = el("a");
    clear.href = "/evidence";
    clear.textContent = "清除定位";
    note.appendChild(clear);
    if (hit) { hit.scrollIntoView(); }
  } else if (!activeFilter) {
    document.body.classList.remove("filtered");
    note.textContent = "";
  }
}

function applyFilter() {
  var f = (location.hash || "").replace(/^#/, "");
  var kv2 = {};
  f.split("&").forEach(function (p) {
    var i = p.indexOf("=");
    if (i > 0) { kv2[p.slice(0, i)] = p.slice(i + 1); }
  });
  var want = FILTERS[kv2.f] ? kv2.f : null;
  anchorFd = !want && kv2.f ? kv2.f : null;      /* 非复测态值=发现号锚定 */
  if (want !== activeFilter) {
    activeFilter = want;
    var note = document.getElementById("filter-note");
    if (want) {
      note.textContent = "";
      var t1 = document.createTextNode("当前筛选：只看" + FILTERS[want] + " · ");
      var clear = el("a");
      clear.href = "/evidence";
      clear.textContent = "清除筛选";
      note.appendChild(t1); note.appendChild(clear);
    } else {
      note.textContent = "";
    }
    document.body.classList.toggle("filtered", !!want);
    if (lastCards) { renderCards(lastCards); }
  }
  applyAnchor(anchorFd);
}
window.addEventListener("hashchange", applyFilter);

var lastCards = null;

function refresh() {
  fetch("/api/evidence.json").then(function (r) { return r.json(); })
    .then(function (d) {
      lastCards = d.cards || [];
      applyFilter();
      renderStats(d.stats);
      renderCards(lastCards);
      applyAnchor(anchorFd);      /* 卡片入 DOM 后再锚定滚动 */
    })
    .catch(function (e) {
      setBox(document.getElementById("stats"), "error", TY.failText(e));
      setBox(document.getElementById("cards-box"), "error", TY.failText(e));
    });
}

refresh();
setInterval(refresh, 10000);

/* —— v0.9.8 方向盘：下载报告（POST 窄门；缓存命中即回文件，无产物触发生成；
   401 跳登录；无果如实弹拒因） —— */
document.getElementById("report-dl").addEventListener("click", function () {
  var btn = this;
  btn.disabled = true;
  fetch("/api/report/download", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: "{}"
  }).then(function (r) {
    if (r.status === 401) { window.location.href = "/login"; return null; }
    if (!r.ok) { return r.json().then(function (j) {
      throw new Error(j.error || ("HTTP " + r.status));
    }); }
    var disp = r.headers.get("Content-Disposition") || "";
    var m = /filename=([^;]+)/.exec(disp);
    return r.blob().then(function (b) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = m ? m[1] : "report.md";
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(a.href);
      a.remove();
    });
  }).catch(function (e) { alert("下载被拒：" + String(e.message || e)); })
    .then(function () { btn.disabled = false; });
});
</script>
