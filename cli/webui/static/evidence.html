<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探隐观察面 · 证据卡 tanyin-web v0.9d</title>
<style>
  /* ZhulongFire 皮肤 v2（v0.9d 收口批）：12 级灰阶 --g1(最浅)→--g12(最深)，
     深主题镜像（g1 最深→g12 最浅——索引=离背景近远，两主题同语义）；
     灰系核心变量挂灰阶；圆角半径 8px 统一令牌。 */
  :root { --g1:#ffffff; --g2:#f6f8fb; --g3:#eef2f7; --g4:#e3e9f2;
          --g5:#d9e1ec; --g6:#c6d0df; --g7:#a5b1c4; --g8:#8593a8;
          --g9:#5c6b80; --g10:#46536a; --g11:#2e3949; --g12:#182230;
          --radius:8px;
          --bg:var(--g2); --card:var(--g1); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#2563EB; --accent-ink:#ffffff;
          --soft:#e9effd; --ok:#157347; --bad:#d92d20; --warn:#b54708;
          --idle:var(--g8); --skeleton:var(--g4); }
  html[data-theme="dark"] { --g1:#0d1320; --g2:#151d2e; --g3:#1c2740;
          --g4:#232f4d; --g5:#2a3752; --g6:#3a4867; --g7:#4d5c80;
          --g8:#66759a; --g9:#8fa0b8; --g10:#b9c4d8; --g11:#d4dcea;
          --g12:#e8eef8;
          --radius:8px;
          --bg:var(--g1); --card:var(--g2); --ink:var(--g12); --dim:var(--g9);
          --line:var(--g5); --accent:#7aa5ff; --accent-ink:#0b1220;
          --soft:#1d2a47; --ok:#3ecf8e; --bad:#ff7a70; --warn:#f0b429;
          --idle:var(--g8); --skeleton:var(--g3); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "PingFang SC","Hiragino Sans GB",Microsoft YaHei,sans-serif; }
  a { color:var(--accent); }
  /* 侧栏骨架（ui-design-v1 冻结）：左三分组 看战况/看战果/管战场
     + 顶栏（战局切换/主题）+ 窄屏 checkbox 折叠（纯 display 切换，零动效） */
  .side-check { display:none; }
  #shell { display:grid; grid-template-columns:190px 1fr; min-height:100vh; }
  #side { padding:14px 10px; border-right:1px solid var(--line);
          background:var(--card); }
  #side .brand { font-size:15px; font-weight:600; letter-spacing:2px;
                 padding:2px 10px 12px; }
  .nav-group { margin-bottom:14px; }
  .nav-group h3 { font-size:11px; color:var(--dim); font-weight:600;
                  letter-spacing:2px; margin:0 0 4px; padding:0 10px; }
  #side nav a { display:block; padding:6px 10px; font-size:13px;
                color:var(--dim); text-decoration:none; white-space:nowrap;
                border-radius:var(--radius); }
  #side nav a:hover { color:var(--accent); background:var(--soft); }
  #side nav a.here { color:var(--accent); background:var(--soft);
                     font-weight:600; }
  #topbar { display:flex; align-items:baseline; flex-wrap:wrap;
            gap:6px 14px; padding:12px 22px; border-bottom:1px solid var(--line);
            background:var(--card); }
  #topbar h1 { font-size:18px; margin:0; letter-spacing:1px; }
  .page-sub { flex-basis:100%; margin:0; color:var(--dim); font-size:12px; }
  #battle-switch { margin-left:auto; font:inherit; font-size:12px;
                   padding:3px 8px; border:1px solid var(--line);
                   border-radius:var(--radius); background:var(--card);
                   color:var(--ink); }
  #side-toggle { display:none; font:inherit; font-size:12px; padding:3px 10px;
                 cursor:pointer; border:1px solid var(--line);
                 border-radius:var(--radius); background:var(--card);
                 color:var(--ink); }
  #theme-toggle { font:inherit; font-size:12px; padding:3px 12px; cursor:pointer;
                  border:1px solid var(--line); border-radius:var(--radius);
                  background:var(--card); color:var(--ink); }
  #theme-toggle:hover { border-color:var(--accent); color:var(--accent); }
  @media (max-width:920px) {
    #shell { grid-template-columns:1fr; }
    #side { display:none; }
    #side-toggle { display:inline-block; }
    .side-check:checked ~ #shell #side { display:block; border-right:none;
                                         border-bottom:1px solid var(--line); }
  }
  main { padding:18px 22px; max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
            padding:14px 16px; margin-bottom:16px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--dim);
               font-weight:600; letter-spacing:2px; }
  footer { color:var(--dim); font-size:11px; padding:8px 22px 18px; }
  /* 四态纪律：骨架/加载/空/错误（骨架=静默灰条占位，零动效） */
  .statebox { min-height:22px; }
  .state-msg { display:none; margin:4px 0 2px; font-size:12px; color:var(--dim); }
  .statebox[data-state="loading"] .state-msg { display:block; }
  .statebox[data-state="empty"] .state-msg { display:block; }
  .statebox[data-state="error"] .state-msg { display:block; color:var(--bad); }
  .skeleton { display:none; height:12px; border-radius:calc(var(--radius)/2);
              background:var(--skeleton); margin:6px 0; }
  .statebox[data-state="loading"] .skeleton { display:block; }
  .skeleton.sk-a { width:55%; }
  .skeleton.sk-b { width:85%; }
  .skeleton.sk-c { width:40%; }
  .statebox > .content { display:none; }
  .statebox[data-state="ready"] > .content { display:block; }
  .statebox[data-state="error"] > .content { display:block; }
  .statebox[data-state="empty"] > .content { display:none; }
  /* 状态语义 tone（status.js 单源 tone → 色变量；重放徽章同源） */
  .t-ok { color:var(--ok); } .t-bad { color:var(--bad); }
  .t-warn { color:var(--warn); } .t-idle { color:var(--dim); }
  .badge { font-size:11px; padding:1px 8px; border-radius:var(--radius);
           border:1px solid currentColor; white-space:nowrap; }
  /* 页内 */
  #stats .content { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; }
  #stats .num { font-weight:600; }
  #filter-note { display:none; font-size:12px; color:var(--accent); margin:0 0 8px; }
  body.filtered #filter-note { display:block; }
  #cards { display:grid; gap:10px; }
  .card { border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
          padding:10px 12px; }
  .card.anchored { box-shadow:0 0 0 2px var(--accent);
                   border-color:var(--accent); }
  .card .summary { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
                   cursor:pointer; }
  .card .id { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--accent); }
  .card .title { font-weight:600; }
  .card .hash { color:var(--dim); font-size:12px;
                font-family:ui-monospace,Menlo,Consolas,monospace; }
  .card .detail { display:none; margin-top:10px; padding-top:10px;
                  border-top:1px dashed var(--line); font-size:12px; color:var(--dim); }
  .card.open .detail { display:block; }   /* 纯 DOM 点击展开 */
  .detail dl { display:grid; grid-template-columns:130px 1fr; gap:4px 10px;
               margin:0; }
  .detail dt { color:var(--dim); }
  .detail dd { margin:0; word-break:break-all;
               font-family:ui-monospace,Menlo,Consolas,monospace; }
  .detail .hint { color:var(--dim); font-size:11px; margin-top:8px; }
</style>
<script src="/status.js"></script>
</head>
<body>
<input type="checkbox" id="side-check" class="side-check" aria-hidden="true">
<div id="shell">
  <aside id="side">
    <div class="brand">探隐</div>
    <nav>
      <div class="nav-group">
        <h3>看战况</h3>
        <a href="/">总览</a><a href="/activity">活动</a><a href="/session">会话</a><a href="/coverage">热图</a><a href="/graph">十边</a><a class="here" href="/evidence">证据</a>
      </div>
      <div class="nav-group">
        <h3>看战果</h3>
        <a href="/metrics">度量</a><a href="/experiments">实验</a>
      </div>
      <div class="nav-group">
        <h3>管战场</h3>
        <a href="/#settings">设置（占位）</a>
      </div>
    </nav>
  </aside>
  <div id="main-col">
    <header id="topbar">
      <label for="side-check" id="side-toggle">☰ 目录</label>
      <h1>证据卡</h1>
      <p class="page-sub">你在看什么：每个发现背后的原始证据——命令输出/响应/截图，以及独立重放有没有复现。点卡片展开明细；点战局总览的数字会带着过滤跳进来。</p>
      <select id="battle-switch" aria-label="切换战局（跳会话页回放）">
        <option value="">战局切换…</option>
      </select>
      <button id="theme-toggle" type="button">深色</button>
    </header>
<main>
  <section>
    <h2>重放三态 · 证据编号（每张卡唯一编号）汇总</h2>
    <div id="stats" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"></div>
    </div>
  </section>
  <section>
    <h2>证据卡列表（点卡片展开明细）</h2>
    <p id="filter-note"></p>
    <div id="cards-box" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <div class="skeleton sk-c"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"><div id="cards"></div></div>
    </div>
  </section>
</main>
<footer>tanyin-web v0.9d · 证据卡只读投影（证据编号账 + 重放记录 · 零写入账本）</footer>
  </div><!-- /main-col -->
</div><!-- /shell -->
<script>
"use strict";
/* 数据面：/api/evidence.json（证据编号行 + 挂接发现→漏洞编号 + 重放态 verdict）；
   渲染面：纯 DOM 卡片（重放语义走 status.js 单源），点击 classList 切 open，零框架零 CDN。 */

function el(tag, cls) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  return n;
}
/* 文本一律 textContent 落节点——账本文本不当 HTML 解析（防注入） */

function setBox(box, stateName, msgText) {
  TY.setState(box, stateName);
  var m = box.querySelector(".state-msg");
  if (m && msgText) { m.textContent = msgText; }
}

/* —— 主题切换钮（单源逻辑在 status.js） —— */
/* —— 顶栏战局切换（选项来自 /api/session.json；选中跳会话页回放） —— */
var battleSwitch = document.getElementById("battle-switch");
if (battleSwitch) {
  fetch("/api/session.json").then(function (r) { return r.json(); })
    .then(function (doc) {
      (doc.battles || []).forEach(function (b) {
        var o = document.createElement("option");
        o.value = String(b.n);
        o.textContent = b.id;
        battleSwitch.appendChild(o);
      });
      if (doc.battle && doc.battle.n) { battleSwitch.value = String(doc.battle.n); }
    }).catch(function () { /* 战例表拉不到：切换器保持占位项 */ });
  battleSwitch.addEventListener("change", function () {
    if (this.value) { window.location.href = "/session?battle=" + this.value; }
  });
}

var themeBtn = document.getElementById("theme-toggle");
TY.syncThemeButton(themeBtn);
themeBtn.addEventListener("click", function () {
  TY.toggleTheme();
  TY.syncThemeButton(themeBtn);
});

/* 重放徽章：标签+tone 全走 TY.REPLAY_STATE 单源（中文一处定义） */
function verdictBadge(v) {
  var sem = TY.REPLAY_STATE[v || ""] || TY.REPLAY_STATE[""];
  var b = el("span", "badge t-" + sem.tone);
  b.textContent = sem.label;
  return b;
}

var FILTERS = { "reproduced": "已复现", "not-reproduced": "未复现",
                "manual": "人工", "env-diff": "环境差异" };
var activeFilter = null;
var anchored = {};                /* 每发现首张卡铸 id=f-<发现号> 锚点（防重复） */

function renderStats(st) {
  var box = document.getElementById("stats");
  var content = box.querySelector(".content");
  content.textContent = "";
  if (!st.cards) {
    setBox(box, "empty", "暂无证据数据（证据编号账为空）");
    return;
  }
  [["卡总数", st.cards, ""], ["已复现", st.reproduced, "t-ok"],
   ["未复现", st.not_reproduced, "t-bad"],
   ["人工", st.manual, "t-warn"],
   ["环境差异", st.env_diff, "t-warn"],
   ["未重放", st.unprobed, "t-idle"]]
    .forEach(function (it) {
      var span = el("span");
      var num = el("span", "num " + it[2]);
      num.textContent = it[1];
      span.appendChild(document.createTextNode(it[0] + " "));
      span.appendChild(num);
      content.appendChild(span);
    });
  setBox(box, "ready");
}

function kv(dl, key, val) {
  if (!val) { return; }                    /* 空字段不占行 */
  var dt = el("dt"), dd = el("dd");
  dt.textContent = key;
  dd.textContent = val;
  dd.title = val;
  dl.appendChild(dt); dl.appendChild(dd);
}

function renderCard(c) {
  var card = el("div", "card");
  if (c.linked_finding) {
    card.setAttribute("data-fd", c.linked_finding);
    if (!anchored[c.linked_finding]) {
      anchored[c.linked_finding] = true;
      card.id = "f-" + c.linked_finding;   /* 总览发现流 #f=<发现号> 锚点 */
    }
  }
  var sum = el("div", "summary");
  sum.appendChild(verdictBadge(c.verdict));
  var id = el("span", "id");
  id.textContent = c.id;
  sum.appendChild(id);
  var title = el("span", "title");
  title.textContent = c.title || "（无题）";
  sum.appendChild(title);
  if (c.vuln_ref) {
    var vr = el("span");
    vr.textContent = "漏洞编号 " + c.vuln_ref;
    sum.appendChild(vr);
  }
  var h = el("span", "hash");
  h.textContent = "raw:" + (c.content_hash_raw || "").slice(0, 12) +
                  " norm:" + (c.content_hash_norm || "").slice(0, 12);
  h.title = "content_hash_raw=" + c.content_hash_raw +
            "  content_hash_norm=" + c.content_hash_norm;
  sum.appendChild(h);
  card.appendChild(sum);

  var detail = el("div", "detail");
  var dl = el("dl");
  kv(dl, "观测时间", c.observed_at);
  kv(dl, "网络位置", c.network_position);
  kv(dl, "来源 / 复现方式", (c.source_type || "?") + " / " + (c.repro_kind || "?"));
  kv(dl, "复现命令", c.repro_command);
  kv(dl, "原始哈希", c.content_hash_raw);
  kv(dl, "归一哈希", c.content_hash_norm);
  kv(dl, "产物路径", c.artifact_path);
  kv(dl, "卡片路径", c.card_path);
  kv(dl, "挂接发现", c.linked_finding);
  kv(dl, "配对组", c.pair_group);
  kv(dl, "原文摘录", c.raw_excerpt);
  kv(dl, "落账时间", c.created);
  detail.appendChild(dl);
  var hint = el("div", "hint");
  hint.textContent = "重放态取账本时间线最新重放行；哈希为请求响应指纹。";
  detail.appendChild(hint);
  card.appendChild(detail);

  sum.addEventListener("click", function () {
    card.classList.toggle("open");
  });
  return card;
}

function renderCards(cards) {
  var box = document.getElementById("cards-box");
  var holder = document.getElementById("cards");
  holder.textContent = "";
  anchored = {};
  if (!cards.length) {
    setBox(box, "empty", "暂无证据卡——发现落账后这里出卡");
    return;
  }
  var shown = 0;
  cards.forEach(function (c) {
    if (activeFilter && (c.verdict || "") !== activeFilter) { return; }
    holder.appendChild(renderCard(c));
    shown += 1;
  });
  if (!shown) {
    setBox(box, "empty", "过滤后无匹配卡（" + FILTERS[activeFilter] + "）");
    return;
  }
  setBox(box, "ready");
}

/* —— KPI 过滤（#f=reproduced 等重放态：总览点数字跳入）+ 发现锚定
   （#f=<发现号>：总览发现流点条目跳入——高亮该发现的证据卡并滚动到首张） —— */
var anchorFd = null;

function applyAnchor(fid) {
  var hit = null;
  Array.prototype.forEach.call(
    document.querySelectorAll("#cards .card"), function (card) {
      card.classList.remove("anchored");
      if (fid && card.getAttribute("data-fd") === fid) {
        card.classList.add("anchored");
        if (!hit) { hit = card; }
      }
    });
  var note = document.getElementById("filter-note");
  if (fid) {
    document.body.classList.add("filtered");
    note.textContent = "";
    note.appendChild(document.createTextNode(
      "已定位发现 " + fid + " 的证据卡（高亮+滚动） · "));
    var clear = el("a");
    clear.href = "/evidence";
    clear.textContent = "清除定位";
    note.appendChild(clear);
    if (hit) { hit.scrollIntoView(); }
  } else if (!activeFilter) {
    document.body.classList.remove("filtered");
    note.textContent = "";
  }
}

function applyFilter() {
  var f = (location.hash || "").replace(/^#/, "");
  var kv2 = {};
  f.split("&").forEach(function (p) {
    var i = p.indexOf("=");
    if (i > 0) { kv2[p.slice(0, i)] = p.slice(i + 1); }
  });
  var want = FILTERS[kv2.f] ? kv2.f : null;
  anchorFd = !want && kv2.f ? kv2.f : null;      /* 非重放态值=发现号锚定 */
  if (want !== activeFilter) {
    activeFilter = want;
    var note = document.getElementById("filter-note");
    if (want) {
      note.textContent = "";
      var t1 = document.createTextNode("当前过滤：只看" + FILTERS[want] + " · ");
      var clear = el("a");
      clear.href = "/evidence";
      clear.textContent = "清除过滤";
      note.appendChild(t1); note.appendChild(clear);
    } else {
      note.textContent = "";
    }
    document.body.classList.toggle("filtered", !!want);
    if (lastCards) { renderCards(lastCards); }
  }
  applyAnchor(anchorFd);
}
window.addEventListener("hashchange", applyFilter);

var lastCards = null;

function refresh() {
  fetch("/api/evidence.json").then(function (r) { return r.json(); })
    .then(function (d) {
      lastCards = d.cards || [];
      applyFilter();
      renderStats(d.stats);
      renderCards(lastCards);
      applyAnchor(anchorFd);      /* 卡片入 DOM 后再锚定滚动 */
    })
    .catch(function (e) {
      setBox(document.getElementById("stats"), "error", TY.failText(e));
      setBox(document.getElementById("cards-box"), "error", TY.failText(e));
    });
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
