<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探隐观察面 · 证据卡 tanyin-web v0.9c</title>
<style>
  /* ZhulongFire 皮肤：浅色默认 + 深色镜像（变量同名成对，切 html[data-theme]） */
  :root { --bg:#f6f8fb; --card:#ffffff; --ink:#182230; --dim:#5c6b80;
          --line:#d9e1ec; --accent:#2563EB; --accent-ink:#ffffff;
          --soft:#e9effd; --ok:#157347; --bad:#d92d20; --warn:#b54708;
          --idle:#8593a8; --skeleton:#e3e9f2; }
  html[data-theme="dark"] { --bg:#0d1320; --card:#151d2e; --ink:#e8eef8;
          --dim:#8fa0b8; --line:#2a3752; --accent:#7aa5ff; --accent-ink:#0b1220;
          --soft:#1d2a47; --ok:#3ecf8e; --bad:#ff7a70; --warn:#f0b429;
          --idle:#66759a; --skeleton:#1e2a44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "PingFang SC","Hiragino Sans GB",Microsoft YaHei,sans-serif; }
  a { color:var(--accent); }
  header { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 16px;
           padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:1px; }
  .page-sub { flex-basis:100%; margin:0; color:var(--dim); font-size:12px; }
  header nav { display:flex; gap:2px 12px; font-size:12px; margin-left:auto; }
  header nav a { color:var(--dim); text-decoration:none; white-space:nowrap; }
  header nav a:hover { color:var(--accent); }
  header nav a.here { color:var(--accent); border-bottom:2px solid var(--accent);
                      font-weight:600; }
  #theme-toggle { font:inherit; font-size:12px; padding:3px 12px; cursor:pointer;
                  border:1px solid var(--line); border-radius:14px;
                  background:var(--card); color:var(--ink); }
  #theme-toggle:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:18px 22px; max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px;
            padding:14px 16px; margin-bottom:16px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--dim);
               font-weight:600; letter-spacing:2px; }
  footer { color:var(--dim); font-size:11px; padding:8px 22px 18px; }
  /* 四态纪律：骨架/加载/空/错误（骨架=静默灰条占位，零动效） */
  .statebox { min-height:22px; }
  .state-msg { display:none; margin:4px 0 2px; font-size:12px; color:var(--dim); }
  .statebox[data-state="loading"] .state-msg { display:block; }
  .statebox[data-state="empty"] .state-msg { display:block; }
  .statebox[data-state="error"] .state-msg { display:block; color:var(--bad); }
  .skeleton { display:none; height:12px; border-radius:4px;
              background:var(--skeleton); margin:6px 0; }
  .statebox[data-state="loading"] .skeleton { display:block; }
  .skeleton.sk-a { width:55%; }
  .skeleton.sk-b { width:85%; }
  .skeleton.sk-c { width:40%; }
  .statebox > .content { display:none; }
  .statebox[data-state="ready"] > .content { display:block; }
  .statebox[data-state="error"] > .content { display:block; }
  .statebox[data-state="empty"] > .content { display:none; }
  /* 状态语义 tone（status.js 单源 tone → 色变量；重放徽章同源） */
  .t-ok { color:var(--ok); } .t-bad { color:var(--bad); }
  .t-warn { color:var(--warn); } .t-idle { color:var(--dim); }
  .badge { font-size:11px; padding:1px 8px; border-radius:9px;
           border:1px solid currentColor; white-space:nowrap; }
  /* 页内 */
  #stats .content { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; }
  #stats .num { font-weight:600; }
  #filter-note { display:none; font-size:12px; color:var(--accent); margin:0 0 8px; }
  body.filtered #filter-note { display:block; }
  #cards { display:grid; gap:10px; }
  .card { border:1px solid var(--line); border-radius:6px; background:var(--bg);
          padding:10px 12px; }
  .card .summary { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
                   cursor:pointer; }
  .card .id { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--accent); }
  .card .title { font-weight:600; }
  .card .hash { color:var(--dim); font-size:12px;
                font-family:ui-monospace,Menlo,Consolas,monospace; }
  .card .detail { display:none; margin-top:10px; padding-top:10px;
                  border-top:1px dashed var(--line); font-size:12px; color:var(--dim); }
  .card.open .detail { display:block; }   /* 纯 DOM 点击展开 */
  .detail dl { display:grid; grid-template-columns:130px 1fr; gap:4px 10px;
               margin:0; }
  .detail dt { color:var(--dim); }
  .detail dd { margin:0; word-break:break-all;
               font-family:ui-monospace,Menlo,Consolas,monospace; }
  .detail .hint { color:var(--dim); font-size:11px; margin-top:8px; }
</style>
<script>
/* STATUS-JS:BEGIN */
"use strict";
/* tanyin-web status.js · 状态语义单源（v0.9d ZhulongFire 换肤批）
   语义照 ARTEX status.ts「状态先讲清语义边界再上色」——抄语义不抄代码：
   九门门态 / 证据重放态 / 矩阵格态 → 中文标签+tone 一处定义，五页共用。
   本文件即单源；五页 <head> 内嵌字节级副本（tests/test_v09d_skin.py 字节钉同步——
   常驻 0.9c 老进程无 /status.js 路由，页面必须完全自包含，不得外链引用本文件）。 */

var TY = window.TY || {};

/* 九门：id+中文名 —— 与 phases/phases.yaml 的 states 全序 + gates.title 一致 */
TY.NINE_GATES = [
  { id: "P0", name: "授权门" },
  { id: "P1", name: "测绘" },
  { id: "P2", name: "规划" },
  { id: "P3", name: "演进循环" },
  { id: "P4", name: "汇总" },
  { id: "P5", name: "报告" },
  { id: "P5.5", name: "签发门" },
  { id: "P6.0", name: "清理门" },
  { id: "P6", name: "沉淀" }
];

/* 门态：过门=绿 / 拦下=红 / 未到=灰（label=单字徽章文案） */
TY.GATE_STATE = {
  "PASS": { label: "过", tone: "ok" },
  "FAIL": { label: "拦", tone: "bad" },
  "PENDING": { label: "待", tone: "idle" }
};

/* 证据重放态：空串=未重放（timeline 无对应 replay-probe 行） */
TY.REPLAY_STATE = {
  "reproduced": { label: "已复现", tone: "ok" },
  "not-reproduced": { label: "未复现", tone: "bad" },
  "manual": { label: "人工", tone: "warn" },
  "env-diff": { label: "环境差异", tone: "warn" },
  "": { label: "未重放", tone: "idle" }
};

/* 矩阵格态：空格=欠账（覆盖热图三态语义） */
TY.CELL_STATE = {
  "cold": { label: "已置格", tone: "ok" },
  "frozen": { label: "冻结格", tone: "info" },
  "empty": { label: "欠账空格", tone: "bad" }
};

/* 主题：浅色默认 + 深色镜像（CSS 变量同名成对）；localStorage 记忆——偏好只存本浏览器 */
TY.THEME_KEY = "tanyin-theme";

TY.applyTheme = function (theme) {
  var t = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  return t;
};

TY.savedTheme = function () {
  try { return window.localStorage.getItem(TY.THEME_KEY); }
  catch (err) { return null; }               /* 隐私模式禁存：回浅色默认 */
};

TY.toggleTheme = function () {
  var now = document.documentElement.getAttribute("data-theme") === "dark"
    ? "light" : "dark";
  TY.applyTheme(now);
  try { window.localStorage.setItem(TY.THEME_KEY, now); }
  catch (err) { /* 存不进也照样换肤 */ }
  return now;
};

TY.syncThemeButton = function (btn) {
  if (!btn) { return; }
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  btn.textContent = dark ? "浅色" : "深色";
  btn.setAttribute("aria-label", dark ? "切换到浅色主题" : "切换到深色主题");
};

/* 四态纪律：骨架/加载/空/错误 —— 一处实现五页共用（骨架=静默灰条占位，零动效） */
TY.setState = function (box, state, text) {
  if (!box) { return null; }
  box.setAttribute("data-state", state);
  if (text !== undefined && text !== null) { box.textContent = text; }
  return box;
};

TY.failText = function (err) {
  return "加载失败：" + err + "（自动重试，画面保留上次数据）";
};

/* 载入即恢复主题（内嵌于 <head>，早于正文绘制——深色用户不白闪） */
TY.bootTheme();
/* STATUS-JS:END */
</script>
</head>
<body>
<header>
  <h1>证据卡</h1>
  <p class="page-sub">你在看什么：每个发现背后的原始证据——命令输出/响应/截图，以及独立重放有没有复现。点卡片展开明细；点战局总览的数字会带着过滤跳进来。</p>
  <nav>
    <a href="/">战局总览</a><a href="/activity">活动流</a><a href="/session">会话</a><a href="/coverage">热图</a><a href="/graph">十边图</a><a class="here" href="/evidence">证据卡</a><a href="/metrics">度量</a><a href="/experiments">实验</a>
  </nav>
  <button id="theme-toggle" type="button">深色</button>
</header>
<main>
  <section>
    <h2>重放三态 · 证据编号汇总</h2>
    <div id="stats" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"></div>
    </div>
  </section>
  <section>
    <h2>证据卡列表（点卡片展开明细）</h2>
    <p id="filter-note"></p>
    <div id="cards-box" class="statebox" data-state="loading">
      <div class="skeleton sk-a"></div>
      <div class="skeleton sk-b"></div>
      <div class="skeleton sk-c"></div>
      <p class="state-msg">载入中…</p>
      <div class="content"><div id="cards"></div></div>
    </div>
  </section>
</main>
<footer>tanyin-web v0.9c · 证据卡只读投影（证据编号账 + 重放记录 · 零写入账本）</footer>
<script>
"use strict";
/* 数据面：/api/evidence.json（证据编号行 + 挂接发现→漏洞编号 + 重放态 verdict）；
   渲染面：纯 DOM 卡片（重放语义走 status.js 单源），点击 classList 切 open，零框架零 CDN。 */

function el(tag, cls) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  return n;
}
/* 文本一律 textContent 落节点——账本文本不当 HTML 解析（防注入） */

function setBox(box, stateName, msgText) {
  TY.setState(box, stateName);
  var m = box.querySelector(".state-msg");
  if (m && msgText) { m.textContent = msgText; }
}

/* —— 主题切换钮（单源逻辑在 status.js） —— */
var themeBtn = document.getElementById("theme-toggle");
TY.syncThemeButton(themeBtn);
themeBtn.addEventListener("click", function () {
  TY.toggleTheme();
  TY.syncThemeButton(themeBtn);
});

/* 重放徽章：标签+tone 全走 TY.REPLAY_STATE 单源（中文一处定义） */
function verdictBadge(v) {
  var sem = TY.REPLAY_STATE[v || ""] || TY.REPLAY_STATE[""];
  var b = el("span", "badge t-" + sem.tone);
  b.textContent = sem.label;
  return b;
}

var FILTERS = { "reproduced": "已复现", "not-reproduced": "未复现",
                "manual": "人工", "env-diff": "环境差异" };
var activeFilter = null;

function renderStats(st) {
  var box = document.getElementById("stats");
  var content = box.querySelector(".content");
  content.textContent = "";
  if (!st.cards) {
    setBox(box, "empty", "暂无证据数据（证据编号账为空）");
    return;
  }
  [["卡总数", st.cards, ""], ["已复现", st.reproduced, "t-ok"],
   ["未复现", st.not_reproduced, "t-bad"],
   ["人工", st.manual, "t-warn"],
   ["环境差异", st.env_diff, "t-warn"],
   ["未重放", st.unprobed, "t-idle"]]
    .forEach(function (it) {
      var span = el("span");
      var num = el("span", "num " + it[2]);
      num.textContent = it[1];
      span.appendChild(document.createTextNode(it[0] + " "));
      span.appendChild(num);
      content.appendChild(span);
    });
  setBox(box, "ready");
}

function kv(dl, key, val) {
  if (!val) { return; }                    /* 空字段不占行 */
  var dt = el("dt"), dd = el("dd");
  dt.textContent = key;
  dd.textContent = val;
  dd.title = val;
  dl.appendChild(dt); dl.appendChild(dd);
}

function renderCard(c) {
  var card = el("div", "card");
  var sum = el("div", "summary");
  sum.appendChild(verdictBadge(c.verdict));
  var id = el("span", "id");
  id.textContent = c.id;
  sum.appendChild(id);
  var title = el("span", "title");
  title.textContent = c.title || "（无题）";
  sum.appendChild(title);
  if (c.vuln_ref) {
    var vr = el("span");
    vr.textContent = "漏洞编号 " + c.vuln_ref;
    sum.appendChild(vr);
  }
  var h = el("span", "hash");
  h.textContent = "raw:" + (c.content_hash_raw || "").slice(0, 12) +
                  " norm:" + (c.content_hash_norm || "").slice(0, 12);
  h.title = "content_hash_raw=" + c.content_hash_raw +
            "  content_hash_norm=" + c.content_hash_norm;
  sum.appendChild(h);
  card.appendChild(sum);

  var detail = el("div", "detail");
  var dl = el("dl");
  kv(dl, "观测时间", c.observed_at);
  kv(dl, "网络位置", c.network_position);
  kv(dl, "来源 / 复现方式", (c.source_type || "?") + " / " + (c.repro_kind || "?"));
  kv(dl, "复现命令", c.repro_command);
  kv(dl, "原始哈希", c.content_hash_raw);
  kv(dl, "归一哈希", c.content_hash_norm);
  kv(dl, "产物路径", c.artifact_path);
  kv(dl, "卡片路径", c.card_path);
  kv(dl, "挂接发现", c.linked_finding);
  kv(dl, "配对组", c.pair_group);
  kv(dl, "原文摘录", c.raw_excerpt);
  kv(dl, "落账时间", c.created);
  detail.appendChild(dl);
  var hint = el("div", "hint");
  hint.textContent = "重放态取账本时间线最新重放行；哈希为请求响应指纹。";
  detail.appendChild(hint);
  card.appendChild(detail);

  sum.addEventListener("click", function () {
    card.classList.toggle("open");
  });
  return card;
}

function renderCards(cards) {
  var box = document.getElementById("cards-box");
  var holder = document.getElementById("cards");
  holder.textContent = "";
  if (!cards.length) {
    setBox(box, "empty", "暂无证据卡——发现落账后这里出卡");
    return;
  }
  var shown = 0;
  cards.forEach(function (c) {
    if (activeFilter && (c.verdict || "") !== activeFilter) { return; }
    holder.appendChild(renderCard(c));
    shown += 1;
  });
  if (!shown) {
    setBox(box, "empty", "过滤后无匹配卡（" + FILTERS[activeFilter] + "）");
    return;
  }
  setBox(box, "ready");
}

/* —— KPI 过滤（#f=reproduced 等：战局总览点数字跳入） —— */
function applyFilter() {
  var f = (location.hash || "").replace(/^#/, "");
  var kv2 = {};
  f.split("&").forEach(function (p) {
    var i = p.indexOf("=");
    if (i > 0) { kv2[p.slice(0, i)] = p.slice(i + 1); }
  });
  var want = FILTERS[kv2.f] ? kv2.f : null;
  if (want !== activeFilter) {
    activeFilter = want;
    var note = document.getElementById("filter-note");
    if (want) {
      note.textContent = "";
      var t1 = document.createTextNode("当前过滤：只看" + FILTERS[want] + " · ");
      var clear = el("a");
      clear.href = "/evidence";
      clear.textContent = "清除过滤";
      note.appendChild(t1); note.appendChild(clear);
    } else {
      note.textContent = "";
    }
    document.body.classList.toggle("filtered", !!want);
    if (lastCards) { renderCards(lastCards); }
  }
}
window.addEventListener("hashchange", applyFilter);

var lastCards = null;

function refresh() {
  fetch("/api/evidence.json").then(function (r) { return r.json(); })
    .then(function (d) {
      lastCards = d.cards || [];
      applyFilter();
      renderStats(d.stats);
      renderCards(lastCards);
    })
    .catch(function (e) {
      setBox(document.getElementById("stats"), "error", TY.failText(e));
      setBox(document.getElementById("cards-box"), "error", TY.failText(e));
    });
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
