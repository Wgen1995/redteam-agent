name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # W2·CI 护栏①（e7a6d5f1）：ruff 零错误基线——真错误类 E9/F/W605/E711-E722
    # （选取律见 ruff.toml；风格类=仓风渐进律不进基线）。
    name: ruff（零错误基线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: ruff check .
        run: ruff check .

  typecheck:
    # W2·CI 护栏②（e7a6d5f1）：mypy 渐进门 v1——8 稳定地基件 + check_untyped_defs
    # （扩张律见 mypy.ini；热件待舰落地逐批进档）。
    name: mypy（渐进 v1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mypy
      - name: mypy
        run: python -m mypy

  guard-rlimit-selfcheck:
    # W2·CI 护栏⑥（B:G2）：tanyin-guard setrlimit 资源上限 fail-closed 自检——
    # 超限执法面（CPU SIGXCPU/NPROC fork 炸/AS MemoryError）+ fail-closed 拒面
    # 在 CI 平台（Linux=AS 真执法）独立成门，防分片漏路由。
    name: B:G2 guard rlimit 自检
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: guard rlimit 全量（超限+fail-closed）
        run: python -m unittest tests.test_guard_rlimits_b_g2 -v

  tests:
    # W2·CI 护栏④（e7a6d5f1）：测试分片并行——确定性分片器（排序轮转，片集
    # 恒等可重跑）四片并行，墙钟 ≈ 全量/4；金样/evals 面独立成作业不乘片。
    name: tests (${{ matrix.os }}, py${{ matrix.python }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: E0 selfcheck static   # 批次 10（八专家 automation P3）：前置门入 CI，不再只活在 RUNBOOK
        run: python cli/tanyin-selfcheck --static
      - name: Unit tests (shard ${{ matrix.shard }})
        run: python scripts/shard_tests.py --run --shard=${{ matrix.shard }}

  golden:
    name: golden (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Golden regression
        run: python tests/run_golden.py

  evals-static:
    name: evals-static (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Evals static
        run: python cli/tanyin-evals run --suite=static --goal-dir . --out evals-report-static.json --timestamp=ci
      - name: Upload evals report
        uses: actions/upload-artifact@v4
        with:
          name: evals-report-static-${{ matrix.os }}-py${{ matrix.python }}
          path: evals-report-static.json

  coverage:
    # W2·CI 护栏⑤（e7a6d5f1）：coverage 60% 起——可 import 执法面（cli.ledger+
    # engines）为诚实分母；口径与上调律见 .coveragerc。
    name: coverage（60% 起）
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install coverage
      - name: Unit tests under coverage（全量单进程）
        run: python -m coverage run --rcfile=.coveragerc -m unittest discover -s tests
      - name: Coverage report（fail-under 60）
        run: python -m coverage report --rcfile=.coveragerc

  evals-dynamic:
    name: evals-dynamic (ubuntu)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evals dynamic
        run: python cli/tanyin-evals run --suite=dynamic --goal-dir . --out evals-report-dynamic.json --timestamp=ci
      - uses: actions/upload-artifact@v4
        with:
          name: evals-report-dynamic
          path: evals-report-dynamic.json
