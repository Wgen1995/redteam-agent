<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphLed 控制台·最终态原型(可点击)</title>
<style>
:root{
  --g0:#0a0b0d;--g1:#101216;--g2:#16181d;--g3:#1d2026;--g4:#252930;--g5:#2e333b;
  --g6:#3a4049;--g7:#4c535e;--g8:#6b7480;--g9:#8b949f;--ga:#aab3bd;--gb:#ccd3da;--gc:#e8edf2;
  --acc:#3ddc97;--acc2:#2fae78;--warn:#e8b34b;--dang:#e8635a;--info:#5aa9e6;--purple:#a78bfa;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--g0);color:var(--gb);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden}
/* ── 侧栏 ── */
#side{width:216px;background:var(--g1);border-right:1px solid var(--g3);flex-shrink:0;display:flex;flex-direction:column}
#side .logo{padding:16px;border-bottom:1px solid var(--g3)}
#side .logo b{color:var(--gc);font-size:16px;letter-spacing:.5px}
#side .logo i{display:block;font-style:normal;color:var(--g8);font-size:11px;margin-top:2px}
#side nav{flex:1;overflow-y:auto;padding:8px 0}
#side nav::-webkit-scrollbar{width:4px}#side nav::-webkit-scrollbar-thumb{background:var(--g4)}
.grp{padding:10px 14px 4px;color:var(--g8);font-size:11px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;color:var(--ga);cursor:pointer;font-size:13px;border-left:2px solid transparent}
.nav-item:hover{background:var(--g2);color:var(--gc)}
.nav-item.on{background:var(--g2);color:var(--acc);border-left-color:var(--acc)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--g6);flex-shrink:0}
.nav-item.on .dot{background:var(--acc)}
#side .foot{padding:10px 14px;border-top:1px solid var(--g3);font-size:11px;color:var(--g8)}
/* ── 主区 ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:48px;background:var(--g1);border-bottom:1px solid var(--g3);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
#top .sel{background:var(--g3);border:1px solid var(--g5);color:var(--gc);padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer}
#top .bud{font-family:var(--mono);font-size:12px;color:var(--warn)}
#top .sp{flex:1}
#top .who{color:var(--g9);font-size:12px}#top .who b{color:var(--acc)}
#view{flex:1;overflow-y:auto;padding:20px 24px}
#view::-webkit-scrollbar{width:6px}#view::-webkit-scrollbar-thumb{background:var(--g4)}
.page{display:none}.page.on{display:block}
h2.pt{font-size:17px;color:var(--gc);margin-bottom:4px}
p.pd{color:var(--g8);font-size:12px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.cards4{grid-template-columns:repeat(4,1fr)}
.cards3{grid-template-columns:repeat(3,1fr)}
.cards2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--g2);border:1px solid var(--g4);border-radius:6px;padding:14px}
.card .k{color:var(--g8);font-size:11px;margin-bottom:6px}
.card .v{font-family:var(--mono);font-size:22px;color:var(--gc)}
.card .v.acc{color:var(--acc)}.card .v.warn{color:var(--warn)}.card .v.dang{color:var(--dang)}
.card .s{color:var(--g8);font-size:11px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--g8);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--g4);font-size:11.5px;letter-spacing:.4px}
td{padding:8px 10px;border-bottom:1px solid var(--g3);color:var(--gb)}
tr:hover td{background:var(--g2)}
tr.sel td{background:var(--g3)}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:500}
.t-g{background:rgba(61,220,151,.14);color:var(--acc)}.t-y{background:rgba(232,179,75,.14);color:var(--warn)}
.t-r{background:rgba(232,99,90,.14);color:var(--dang)}.t-b{background:rgba(90,169,230,.14);color:var(--info)}
.t-p{background:rgba(167,139,250,.14);color:var(--purple)}.t-n{background:var(--g4);color:var(--g9)}
.btn{background:var(--g4);border:1px solid var(--g6);color:var(--gb);padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12.5px}
.btn:hover{background:var(--g5);color:var(--gc)}
.btn.acc{background:var(--acc2);border-color:var(--acc2);color:#08130d;font-weight:600}
.btn.acc:hover{background:var(--acc)}
.btn.dang{background:transparent;border-color:var(--dang);color:var(--dang)}
.btn.sm{padding:3px 10px;font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pane{background:var(--g2);border:1px solid var(--g4);border-radius:6px;padding:14px;margin-bottom:14px}
.pane h3{font-size:13px;color:var(--gc);margin-bottom:10px}
.mono{font-family:var(--mono)}
.bar{height:6px;background:var(--g4);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
/* 图谱 */
#graphwrap{background:var(--g1);border:1px solid var(--g4);border-radius:6px;position:relative;height:520px;overflow:hidden}
#graphsvg{width:100%;height:100%}
.legend{position:absolute;top:10px;right:10px;background:rgba(16,18,22,.92);border:1px solid var(--g5);border-radius:6px;padding:10px 12px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;z-index:2}
.legend span{display:flex;align-items:center;gap:6px;color:var(--g9)}
.ln{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#replay{position:absolute;bottom:0;left:0;right:0;background:rgba(16,18,22,.95);border-top:1px solid var(--g5);padding:10px 14px;z-index:2}
#replay input{width:100%;accent-color:var(--acc)}
#replay .fr{display:flex;justify-content:space-between;font-size:11px;color:var(--g8);margin-top:4px;font-family:var(--mono)}
.gnode{cursor:pointer}
.gnode text{fill:var(--g9);font-size:10px;font-family:var(--mono)}
.gnode:hover text{fill:var(--gc)}
/* 终端 */
#term{background:#07080a;border-radius:6px;padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.7;height:560px;overflow-y:auto;border:1px solid var(--g4)}
.c-g{color:var(--acc)}.c-y{color:var(--warn)}.c-r{color:var(--dang)}.c-b{color:var(--info)}.c-p{color:var(--purple)}.c-d{color:var(--g8)}.c-w{color:var(--gc)}
.blink{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
/* 表单 */
.fq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi label{display:block;color:var(--g8);font-size:11.5px;margin-bottom:5px}
.fi input,.fi select,.fi textarea{width:100%;background:var(--g1);border:1px solid var(--g5);border-radius:4px;color:var(--gc);padding:8px 10px;font-size:13px}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--acc2)}
.chk{display:flex;align-items:center;gap:8px;color:var(--gb);font-size:13px;cursor:pointer}
.chk input{accent-color:var(--acc2)}
/* 时钟流 */
.feed{font-family:var(--mono);font-size:12px;line-height:1.9}
.feed div{padding:2px 0;border-bottom:1px dashed var(--g3)}
.feed .t{color:var(--g8);margin-right:8px}
.kbd{background:var(--g3);border:1px solid var(--g5);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:11px;color:var(--g9)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--g4);margin-bottom:14px}
.tab{padding:7px 16px;color:var(--g8);cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.tab:hover{color:var(--gb)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.notice{position:fixed;top:60px;right:24px;background:var(--g3);border:1px solid var(--acc2);border-radius:6px;padding:10px 16px;color:var(--acc);font-size:13px;display:none;z-index:99}
</style>
</head>
